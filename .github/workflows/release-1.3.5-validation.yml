name: Control Center 1.3.5 frozen validation

on:
  pull_request:
    paths:
      - 'releases/1.3.5/**'
      - '.github/workflows/release-1.3.5-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-release-1-3-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen 1.3.5 contract
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD:releases/1.3.5)" = "b9c61b02d8be814c394ff6ec32f1e9aaf659304e"
          bash -n releases/1.3.5/preflight-1.3.5.sh
          bash -n releases/1.3.5/apply-1.3.5.sh
          bash -n releases/1.3.5/acceptance-1.3.5.sh
          bash -n releases/1.3.5/rollback-1.3.5.sh
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/1.3.5')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['release_id']==manifest['release_version']=='1.3.5'
          for stage,entry in manifest['scripts'].items():
              actual=hashlib.sha256((root/entry['path']).read_bytes()).hexdigest()
              assert actual == entry['sha256'], (stage,actual,entry['sha256'])
          print('FROZEN 1.3.5 PASS')
          PY
