name: Control Center 1.3.8 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment.json'
      - 'releases/1.3.8/**'
      - '.github/workflows/release-1.3.8-validation.yml'
      - '.github/workflows/release-1.3.7-validation.yml'
      - 'tools/validate-upgrade-contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-1-3-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          set -euxo pipefail
          bash -n releases/1.3.8/preflight-1.3.8.sh
          bash -n releases/1.3.8/apply-1.3.8.sh
          bash -n releases/1.3.8/acceptance-1.3.8.sh
          bash -n releases/1.3.8/rollback-1.3.8.sh

      - name: Manifest deployment and hashes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/1.3.8')
          manifest=json.loads((root/'manifest.json').read_text())
          dep=json.loads(pathlib.Path('deployment.json').read_text())
          assert manifest['release_id']==manifest['release_version']=='1.3.8',manifest
          assert dep['release_id']=='1.3.8' and dep['release_path']=='releases/1.3.8',dep
          for stage,entry in manifest['scripts'].items():
              p=root/entry['path']
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == entry['sha256'],(stage,actual,entry['sha256'])
              assert pathlib.Path(dep[stage]) == p,(stage,dep[stage],p)
          print('1.3.8 MANIFEST PASS')
          PY

      - name: Upgrade compatibility
        run: |
          set -euxo pipefail
          python3 tools/validate-upgrade-contract.py \
            releases/1.3.8/manifest.json \
            --require-patch-line \
            --require-version 1.2.0 \
            --require-version 1.3.0 \
            --require-version 1.3.1 \
            --require-version 1.3.2 \
            --require-version 1.3.3 \
            --require-version 1.3.4 \
            --require-version 1.3.5 \
            --require-version 1.3.6 \
            --require-version 1.3.7

      - name: Current real-server upgrade path
        run: |
          set -euxo pipefail
          git fetch origin server-state:refs/remotes/origin/server-state
          git show origin/server-state:server-state/summary.env > /tmp/current-summary.env
          cat /tmp/current-summary.env
          python3 - <<'PY'
          import json,pathlib
          values={}
          for line in pathlib.Path('/tmp/current-summary.env').read_text().splitlines():
              if '=' in line:
                  key,value=line.split('=',1); values[key]=value
          version=values.get('release_version')
          assert version,values
          pathlib.Path('/tmp/current-release.json').write_text(
              json.dumps({'version':version,'release_id':values.get('release_id')})+'\n'
          )
          print('CURRENT SERVER VERSION:',version)
          PY
          python3 tools/validate-upgrade-contract.py \
            releases/1.3.8/manifest.json \
            --server-state-release /tmp/current-release.json

      - name: Reproduce and close release metadata permission failure
        run: |
          set -euxo pipefail
          sudo useradd --system --no-create-home srvcc-meta-test
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' '{"version":"1.3.8","release_id":"1.3.8","git_sha":"test"}' | sudo tee "$tmp/release.json" >/dev/null
          sudo chown root:root "$tmp/release.json"
          sudo chmod 0640 "$tmp/release.json"
          sudo chmod 0755 "$tmp"
          if sudo -u srvcc-meta-test cat "$tmp/release.json" >/dev/null 2>&1; then
            echo 'root:root 0640 unexpectedly readable' >&2
            exit 1
          fi
          sudo chgrp srvcc-meta-test "$tmp/release.json"
          sudo -u srvcc-meta-test python3 - "$tmp/release.json" <<'PY'
          import json,pathlib,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['version']=='1.3.8'
          print('METADATA PERMISSION REPRODUCTION PASS')
          PY

      - name: Release metadata ownership contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          apply=Path('releases/1.3.8/apply-1.3.8.sh').read_text()
          acceptance=Path('releases/1.3.8/acceptance-1.3.8.sh').read_text()
          rollback=Path('releases/1.3.8/rollback-1.3.8.sh').read_text()
          api=Path('releases/1.3.8/payload/app/routers/api.py').read_text()
          assert "grp.getgrnam('srv-control').gr_gid" in apply
          assert 'os.fchown(fd,0,gid)' in apply
          assert 'os.fchmod(fd,0o640)' in apply
          assert 'runuser -u srv-control -- python3' in apply
          assert 'runuser -u srv-control -- python3' in acceptance
          assert 'chown root:srv-control "$RELEASE_FILE"' in rollback
          assert '"release": release_metadata()' in api
          assert '{"version": None, "release_id": None, "synced_at": None, "git_sha": None}' in api
          print('RELEASE METADATA OWNERSHIP CONTRACT PASS')
          PY

      - name: System action watcher recovery contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          apply=Path('releases/1.3.8/apply-1.3.8.sh').read_text()
          acceptance=Path('releases/1.3.8/acceptance-1.3.8.sh').read_text()
          rollback=Path('releases/1.3.8/rollback-1.3.8.sh').read_text()
          for text in (apply,acceptance):
              assert 'systemctl enable srv-control-system-agent.path' in text
              assert 'systemctl is-active --quiet srv-control-system-agent.path' in text
          assert 'systemctl start srv-control-system-agent.path' in apply
          assert 'systemctl start srv-control-system-agent.path' in acceptance
          assert 'systemctl enable srv-control-system-agent.path' in rollback
          unit=Path('releases/1.3.8/system/srv-control-system-agent.path').read_text()
          assert 'PathExistsGlob=/var/lib/srv-control/system-actions/*.json' in unit
          print('SYSTEM ACTION WATCHER RECOVERY CONTRACT PASS')
          PY

      - name: Inherited transaction path regression
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for stage in ('apply','acceptance','rollback'):
              p=Path(f'releases/1.3.8/{stage}-1.3.8.sh').read_text()
              assert f'{stage}-1.3.7.sh' in p
              assert "text=text.replace('1.3.7','1.3.8')" in p
              assert 'mktemp "${RELEASE_DIR}/.' in p
          old_acceptance=Path('releases/1.3.8/acceptance-1.3.7.sh').read_text()
          old_rollback=Path('releases/1.3.8/rollback-1.3.7.sh').read_text()
          assert 'adapted acceptance escaped release directory' in old_acceptance
          assert 'adapted rollback escaped release directory' in old_rollback
          print('INHERITED TRANSACTION PATH REGRESSION PASS')
          PY

      - name: Payload lineage and frozen 1.3.7
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD:releases/1.3.7)" = "d8442b7184493a7c8c4d5a50a10005873066f94b"
          test "$(git rev-parse HEAD:releases/1.3.8/payload)" = "2af40223cb56a02b3ee25851e4f547475d0b6c11"
          test "$(git rev-parse HEAD:releases/1.3.8/system)" = "36cbb0c86c3dea5fe4bdbe6a09c7a04f7d7d88d0"
          test "$(git rev-parse HEAD:releases/1.3.8/payload)" = "$(git rev-parse HEAD:releases/1.3.7/payload)"
          test "$(git rev-parse HEAD:releases/1.3.8/system)" = "$(git rev-parse HEAD:releases/1.3.7/system)"
