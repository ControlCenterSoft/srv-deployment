name: Control Center 2.0 validation

on:
  push:
    branches:
      - release/2.0.0
  pull_request:
    paths:
      - 'releases/2.0.0/**'
      - 'docs/2.0/**'
      - '.github/workflows/release-2.0-validation.yml'

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current main is carried forward
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          echo 'MAIN CARRY-FORWARD PASS'

      - name: Print release script hashes
        run: |
          sha256sum \
            releases/2.0.0/preflight-2.0.0.sh \
            releases/2.0.0/apply-2.0.0.sh \
            releases/2.0.0/acceptance-2.0.0.sh \
            releases/2.0.0/rollback-2.0.0.sh

      - name: Validate release scripts and managed helpers
        run: |
          set -euo pipefail
          for f in \
            releases/2.0.0/preflight-2.0.0.sh \
            releases/2.0.0/apply-2.0.0.sh \
            releases/2.0.0/acceptance-2.0.0.sh \
            releases/2.0.0/rollback-2.0.0.sh \
            releases/2.0.0/system/srvcc-configure-auto-updates
          do bash -n "$f"; done
          python3 -m py_compile \
            releases/2.0.0/system/srvcc-update-controller \
            releases/2.0.0/system/srv-control-backup-policy \
            releases/2.0.0/system/srv-control-os-auto-update \
            releases/2.0.0/system/srv-control-minecraft-repair
          python3 -m compileall -q releases/2.0.0/payload/app

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          for f in releases/2.0.0/payload/static/js/*.js; do node --check "$f"; done

      - name: Validate 2.0 system UI contracts
        run: |
          set -euo pipefail
          system='releases/2.0.0/payload/templates/system.html'
          client='releases/2.0.0/payload/static/js/system-2.0.js'
          stamps='releases/2.0.0/payload/static/js/github-update-timestamps.js'
          grep -Fq 'Последняя проверка обновления' "$system"
          grep -Fq 'Последнее успешное обновление' "$system"
          grep -Fq 'id="githubLastUpdateCheck"' "$system"
          grep -Fq 'id="backupDeleteSelected"' "$system"
          grep -Fq 'id="backupSelectAll"' "$system"
          grep -Fq '/api/v1/system/backups/delete-many' "$client"
          grep -Fq 'requireText: "DELETE"' "$client"
          grep -Fq 'status.last_check_at || status.checked_at' "$stamps"
          grep -Fq 'status.last_successful_update_at' "$stamps"
          ! grep -Fq 'githubLastUpdateAttempt' "$system"

      - name: Validate bulk backup API contracts
        run: |
          set -euo pipefail
          router='releases/2.0.0/payload/app/routers/system_v2.py'
          main='releases/2.0.0/payload/app/main.py'
          grep -Fq '@router.post("/backups/delete-many")' "$router"
          grep -Fq 'MAX_BULK_BACKUPS = 200' "$router"
          grep -Fq 'backup_archive(backup_id)' "$router"
          grep -Fq '"backup-delete"' "$router"
          grep -Fq 'system_v2_router' "$main"

      - name: Validate backup policy regression fixes
        run: |
          set -euo pipefail
          apply='releases/2.0.0/apply-2.0.0.sh'
          updater='releases/2.0.0/system/srvcc-update-controller'
          auto_os='releases/2.0.0/system/srv-control-os-auto-update'
          policy='releases/2.0.0/system/srv-control-backup-policy'
          # 1.x applied a visible backup unconditionally. 2.0 must not.
          ! grep -E 'srv-control-backup.*create.*pre-release|BACKUP_WORKER.*create.*pre-release' "$apply"
          grep -Fq 'No unconditional user-visible backup is created here' "$apply"
          grep -Fq "config.get(\"backup_before_update\") is True" "$updater"
          grep -Fq 'required-for-update' "$auto_os"
          grep -Fq 'raw.get("backup_before_update") is True' "$policy"
          grep -Fq 'srv-control-backup-policy scheduled' "$apply"

      - name: Validate updater failure recovery architecture
        run: |
          set -euo pipefail
          controller='releases/2.0.0/system/srvcc-update-controller'
          configurator='releases/2.0.0/system/srvcc-configure-auto-updates'
          apply='releases/2.0.0/apply-2.0.0.sh'
          grep -Fq 'schema_version": 4' "$controller"
          grep -Fq 'last_check_at' "$controller"
          grep -Fq 'last_update_attempt_at' "$controller"
          grep -Fq 'last_successful_update_at' "$controller"
          grep -Fq 'blocked-release.json' "$controller"
          grep -Fq 'automatic apply suppressed' "$controller"
          ! grep -Fq 'systemctl disable --now srvcc-github-agent.timer' "$controller"
          grep -Fq 'OnUnitInactiveSec=${INTERVAL_MINUTES}min' "$configurator"
          grep -Fq 'systemctl reset-failed "$SERVICE"' "$configurator"
          grep -Fq 'systemctl is-active --quiet srvcc-github-agent.timer' "$apply"

      - name: Validate Minecraft health-first repair and rollback safety
        run: |
          set -euo pipefail
          preflight='releases/2.0.0/preflight-2.0.0.sh'
          apply='releases/2.0.0/apply-2.0.0.sh'
          repair='releases/2.0.0/system/srv-control-minecraft-repair'
          rollback='releases/2.0.0/rollback-2.0.0.sh'
          grep -Fq 'Minecraft health is deliberately non-blocking' "$preflight"
          grep -Fq 'srv-control-minecraft-repair repair --replace-world-on-failure' "$apply"
          grep -Fq 'already-healthy' "$repair"
          grep -Fq 'cannot replace world because safety backup failed' "$repair"
          grep -Fq 'ControlCenter-Recovery-' "$repair"
          for path in \
            /opt/minecraft-bedrock/server.properties \
            /opt/minecraft/server.properties \
            /srv/minecraft/server.properties \
            /var/lib/minecraft/server.properties
          do
            grep -Fq "$path" "$apply"
            grep -Fq "$path" "$rollback"
          done

      - name: Validate clean 2.0 release identity
        run: |
          set -euo pipefail
          grep -Fq 'RELEASE_ID="2.0.0"' releases/2.0.0/apply-2.0.0.sh
          grep -Fq 'RELEASE_VERSION="2.0.0"' releases/2.0.0/apply-2.0.0.sh
          grep -Fq "p.get('version') == '2.0.0'" releases/2.0.0/acceptance-2.0.0.sh
          grep -Fq 'release_id') == '2.0.0' releases/2.0.0/acceptance-2.0.0.sh || true
          ! grep -Fq 'text=text.replace' releases/2.0.0/preflight-2.0.0.sh
          ! grep -Fq 'text=text.replace' releases/2.0.0/apply-2.0.0.sh

      - name: Validate production is not switched prematurely
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('deployment.json',encoding='utf-8'))
          assert d.get('release_id') == '1.3.8', d
          assert d.get('release_path') == 'releases/1.3.8', d
          print('PRODUCTION GUARD PASS: deployment.json remains 1.3.8')
          PY
