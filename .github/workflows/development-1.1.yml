name: Control Center 1.1.x Development

on:
  push:
    branches: ['1.1.x', 'feature/1.1-*']
  pull_request:
    branches: ['1.1.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-center-1.1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  DEVELOPMENT_VERSION: 1.1.0-dev.1

jobs:
  static-security:
    name: Static / Security
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Toolchain identity
        run: test "$(go env GOVERSION)" = go1.23.2
      - name: Go format
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: bash -n install/*.sh scripts/*.sh
      - name: Privileged worker policy
        run: ./scripts/privileged-worker-policy-check.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Gemini reviewer syntax
        run: python3 -m py_compile scripts/gemini_review.py
      - name: Gemini reviewer regression
        run: python3 -m unittest discover -s tests -p 'test_gemini_review.py' -v
      - name: Perplexity researcher syntax
        run: python3 -m py_compile scripts/perplexity_research.py
      - name: Perplexity researcher regression
        run: python3 -m unittest discover -s tests -p 'test_perplexity_research.py' -v

  unit-contract:
    name: Unit / Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Unit and contract tests
        run: go test ./...
      - name: Privileged worker race regression
        run: go test -race ./internal/privileged

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Build development artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Version=${DEVELOPMENT_VERSION} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.BuiltAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/control-center-linux-${{ matrix.arch }}" ./cmd/control-center
          sha256sum "dist/control-center-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: control-center-1.1-${{ matrix.arch }}-${{ github.sha }}
          path: dist/control-center-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  baseline-immutability:
    name: Stable 1.0.0 immutable baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Accepted 1.0.0 remains reachable
        run: git merge-base --is-ancestor 1b364ae88789696bf98537d21544de8a259d086d HEAD
      - name: Rebuild accepted 1.0.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/control-center-1.0.0 1b364ae88789696bf98537d21544de8a259d086d
          cd /tmp/control-center-1.0.0
          ./scripts/build-release.sh
          set -a
          source dist/BUILDINFO.env
          set +a
          test "$VERSION" = 1.0.0
          test "$COMMIT" = 1b364ae88789696bf98537d21544de8a259d086d
          test "$AMD64_SHA256" = 341f6a49646f92aca72692730ea61278cc03bfc1689d029d7a7ce573554fa735
          test "$ARM64_SHA256" = 5e6e959f39bd4cb554e902908863c92eb5c697f4d99b55ca97fa4735ec9419fe

  development-gate:
    name: Development gate
    if: ${{ always() }}
    needs: [static-security, unit-contract, build, baseline-immutability]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all mandatory jobs
        env:
          STATIC_SECURITY: ${{ needs.static-security.result }}
          UNIT_CONTRACT: ${{ needs.unit-contract.result }}
          BUILD: ${{ needs.build.result }}
          BASELINE: ${{ needs.baseline-immutability.result }}
        run: |
          test "$STATIC_SECURITY" = success
          test "$UNIT_CONTRACT" = success
          test "$BUILD" = success
          test "$BASELINE" = success
