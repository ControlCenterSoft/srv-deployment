name: Control Center 2.0 bootstrap validation

on:
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap-control-center-2.0.sh'
      - '.github/workflows/bootstrap-2.0-validation.yml'
      - 'deployment.json'
      - 'releases/2.0.0/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/bootstrap-control-center-2.0.sh'
      - '.github/workflows/bootstrap-2.0-validation.yml'
      - 'deployment.json'
      - 'releases/2.0.0/**'

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap shell and target
        run: |
          set -euo pipefail
          bash -n tools/bootstrap-control-center-2.0.sh
          python3 - <<'PY'
          import json, pathlib
          dep=json.loads(pathlib.Path('deployment.json').read_text(encoding='utf-8'))
          assert dep.get('enabled') is True, dep
          assert dep.get('channel') == 'production', dep
          assert dep.get('release_id') == '2.0.0', dep
          assert dep.get('release_path') == 'releases/2.0.0', dep
          text=pathlib.Path('tools/bootstrap-control-center-2.0.sh').read_text(encoding='utf-8')
          required=(
              'bash "$TMP_ROOT/repo/deploy/deploy.sh" "$PROJECT" "$REMOTE_SHA"',
              'systemctl reset-failed srvcc-github-agent.service',
              '"$CONFIGURATOR"',
              '--mode automatic',
              '--interval-minutes "$EXPECTED_INTERVAL"',
              'systemctl is-enabled --quiet srvcc-github-agent.timer',
              'systemctl is-active --quiet srvcc-github-agent.timer',
              "assert cfg.get('schema_version') == 4",
              "assert cfg.get('mode') == 'automatic'",
              "assert cfg.get('interval_minutes') == interval",
              "assert status.get('schema_version') == 4",
              "urlopen('http://127.0.0.1:8876/api/v1/health'",
              'acceptance-2.0.0.sh" "$PROJECT" "$REMOTE_SHA"',
              '"$STATE_PUBLISHER"',
              'merge-base --is-ancestor',
              'push --quiet origin --delete "$branch"',
              'release/1.4.0',
          )
          for item in required:
              assert item in text, item

          # The recovery bootstrap must configure the desired automatic mode,
          # not merely enable a timer while leaving UI/config in manual mode.
          assert 'systemctl enable --now srvcc-github-agent.timer' not in text

          # Published 1.x release branches are frozen history and must never be
          # part of the bootstrap deletion set.
          protected=(
              'release/1.2.0',
              'release/1.3.0',
              'release/1.3.4',
              'release/1.3.5',
              'release/1.3.6',
              'release/1.3.7',
              'release/1.3.8',
          )
          cleanup_block=text.split('OBSOLETE_UNPUBLISHED_BRANCHES=(',1)[1].split(')',1)[0]
          for branch in protected:
              assert branch not in cleanup_block, branch
          print('BOOTSTRAP 2.0 CONTRACT PASS: automatic 5-minute recovery and cleanup gates present')
          PY
