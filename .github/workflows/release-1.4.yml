name: SRV Control Center 1.4.0 validation

on:
  push:
    branches: [release/1.4.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts, exact source parts and PXE contract
        run: |
          set -Eeuo pipefail
          for f in releases/1.4.0/preflight.sh releases/1.4.0/apply.sh releases/1.4.0/acceptance.sh releases/1.4.0/rollback.sh; do bash -n "$f"; done
          python3 releases/1.4.0/tests/pxe_contract.py
          cat releases/1.4.0/payload/app/core/release14.parts/{00,01,02,03,04,05,06,07}.part > /tmp/release14-core.py
          cat releases/1.4.0/payload/app/routers/release14.parts/{00,01,02,03}.part > /tmp/release14-router.py
          cat releases/1.4.0/system/srv-control-release14-agent.parts/{00,01,02,03,04,05,06,07,08,09,10,11,12}.part > /tmp/release14-agent.py
          python3 -m py_compile \
            releases/1.4.0/payload/app/main.py \
            /tmp/release14-core.py \
            /tmp/release14-router.py \
            releases/1.4.0/payload/migrations/versions/14f0a1400001_dhcp_pxe_network_redirects.py \
            /tmp/release14-agent.py
          for f in releases/1.4.0/payload/static/js/*.js; do node --check "$f"; done

      - name: Verify pinned upstream PXE boot assets
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            https://github.com/ipxe/ipxe/releases/download/v2.0.0/ipxeboot.tar.gz \
            -o /tmp/ipxeboot.tar.gz
          echo '01a526d4cc791fc30362259c609d6c506cc64a7bdff51b9a5eb788354e17eee1  /tmp/ipxeboot.tar.gz' | sha256sum -c -
          tar -tzf /tmp/ipxeboot.tar.gz > /tmp/ipxe-files.txt
          for path in \
            ipxeboot/undionly.kpxe \
            ipxeboot/i386/snponly.efi \
            ipxeboot/x86_64/snponly.efi \
            ipxeboot/x86_64-sb/snponly-shim.efi \
            ipxeboot/x86_64-sb/snponly.efi \
            ipxeboot/arm32/snponly.efi \
            ipxeboot/arm64/snponly.efi \
            ipxeboot/arm64-sb/snponly-shim.efi \
            ipxeboot/arm64-sb/snponly.efi; do
            grep -Fxq "$path" /tmp/ipxe-files.txt || { echo "missing upstream iPXE asset: $path" >&2; grep -E '(^|/)(i386|x86_64|arm32|arm64)(-sb)?/.*snponly' /tmp/ipxe-files.txt || true; exit 1; }
          done
          declare -A digests=(
            [wimboot]='5f067ccdc4d084d5bf77b6c853bd0f8402dfc2b4cd1b103d358993ae97fae8e3'
            [wimboot.i386]='b770ad4fa6111d688c062478de3849806b9c3e94a6b770453ef56c94fec254d9'
            [wimboot.arm64]='b1440c6386981fb447b2f341294ec7a59546d496dff0f075b0f698c853f1c949'
          )
          for name in wimboot wimboot.i386 wimboot.arm64; do
            curl -fsSL --retry 3 --retry-all-errors \
              "https://github.com/ipxe/wimboot/releases/download/v2.9.0/$name" \
              -o "/tmp/$name"
            echo "${digests[$name]}  /tmp/$name" | sha256sum -c -
          done

      - name: Validate release manifest wiring
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          cfg=json.loads(Path('deployment.json').read_text())
          assert cfg['release_id']=='1.4.0',cfg
          assert cfg['release_path']=='releases/1.4.0',cfg
          manifest=json.loads(Path(cfg['manifest']).read_text())
          assert manifest['release_id']=='1.4.0',manifest
          assert manifest['upgrade_from']=='>=1.3.0,<1.4.0',manifest
          mismatches=[]
          for name,item in manifest['scripts'].items():
              path=Path(cfg['release_path'])/item['path']
              assert path.is_file(),(name,path)
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  mismatches.append((name,str(path),item['sha256'],actual))
          if mismatches:
              for name,path,expected,actual in mismatches:
                  print(f'MANIFEST HASH MISMATCH {name}: expected={expected} actual={actual} path={path}')
              raise SystemExit(1)
          acceptance=Path('releases/1.4.0/acceptance.sh').read_text()
          assert 'unknown PXE device received installation payload' in acceptance
          assert 'private PXE profile leaked through static media root' in acceptance
          apply=Path('releases/1.4.0/apply.sh').read_text()
          assert "{00,01,02,03,04,05,06,07,08,09,10,11,12}.part" in apply
          PY
