name: Perplexity Routine Queue Dispatcher

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      ${{
        startsWith(github.event.issue.title, '[Perplexity Routine]') &&
        contains(github.event.issue.body || '', '<!-- cc-perplexity-routine:v1 -->') &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      }}
    uses: ControlCenterSoft/srv-deployment/.github/workflows/perplexity-routine.yml@0caf9a295390d1c5baa8db5b6c07777d74d1b44f
    with:
      code_ref: 0caf9a295390d1c5baa8db5b6c07777d74d1b44f
    secrets:
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
