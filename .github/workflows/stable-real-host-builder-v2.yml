name: stable-real-host-orchestrator-builder-v3

on:
  push:
    branches: ["ci/1.0.0-stable-validation-v2"]

permissions:
  contents: read
  statuses: write

env:
  STABLE_SHA: 1b364ae88789696bf98537d21544de8a259d086d
  LAUNCHER_COMMIT: 44b358dc736998df42eca016324ea6de86e68fb4
  LAUNCHER_BLOB_SHA1: 7a3bcf32152fae84ecb499072628223775aefcc3
  STATUS_CONTEXT: control-center/stable-real-host-builder

jobs:
  build-only:
    runs-on: ubuntu-24.04
    outputs:
      orchestrator_sha: ${{ steps.build.outputs.sha }}
    steps:
      - name: Fetch immutable stable launcher
        run: |
          url="https://raw.githubusercontent.com/ControlCenterSoft/srv-deployment/${LAUNCHER_COMMIT}/ops/stable-1.0.0-real-host-acceptance-v1/run-verified.sh"
          curl -fsSL "$url" -o /tmp/launcher.sh
          size="$(wc -c < /tmp/launcher.sh | tr -d ' ')"
          actual="$({ printf 'blob %s\0' "$size"; cat /tmp/launcher.sh; } | sha1sum | awk '{print $1}')"
          test "$actual" = "$LAUNCHER_BLOB_SHA1"
      - name: Build exact orchestrator
        id: build
        run: |
          sudo env STABLE_ACCEPTANCE_BUILD_ONLY=1 OUTPUT_STABLE=/tmp/stable-v1.sh bash /tmp/launcher.sh
          sudo bash -n /tmp/stable-v1.sh
          sha="$(sudo sha256sum /tmp/stable-v1.sh | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          sudo grep -F 'RC_VERSION="1.0.0"' /tmp/stable-v1.sh
          sudo grep -F 'RC_COMMIT="1b364ae88789696bf98537d21544de8a259d086d"' /tmp/stable-v1.sh
          sudo grep -F 'BETA_VERSION="1.0.0-rc.1"' /tmp/stable-v1.sh
          sudo grep -F 'BETA_COMMIT="77b62d5829a46b1b29698495043146d79f37dc48"' /tmp/stable-v1.sh
          sudo grep -F 'scripts/stable-update-acceptance.sh' /tmp/stable-v1.sh
          ! sudo grep -Fq 'scripts/rc1-update-acceptance.sh' /tmp/stable-v1.sh
          echo "$sha  /tmp/stable-v1.sh"
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ORCHESTRATOR_SHA: ${{ steps.build.outputs.sha }}
        run: |
          STATE=failure
          DESCRIPTION='Stable real-host orchestrator build failed'
          if [[ "$JOB_STATUS" == success && -n "$ORCHESTRATOR_SHA" ]]; then
            STATE=success
            DESCRIPTION="$ORCHESTRATOR_SHA"
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            'state':os.environ['STATE'],
            'context':os.environ['STATUS_CONTEXT'],
            'description':os.environ['DESCRIPTION'],
            'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STABLE_SHA}" \
            --data-binary @/tmp/status.json
