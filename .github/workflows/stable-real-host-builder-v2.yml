name: stable-real-host-orchestrator-final-verification

on:
  push:
    branches: ["ci/1.0.0-stable-validation-v2"]

permissions:
  contents: read
  statuses: write

env:
  STABLE_SHA: 1b364ae88789696bf98537d21544de8a259d086d
  LAUNCHER_COMMIT: 91fdb0a4ed5a8d781787926f575269c6bd6beabb
  LAUNCHER_BLOB_SHA1: 7665827ace6b0e9ab8d7dd920ba75e55024ecd22
  EXPECTED_ORCHESTRATOR_SHA256: d2b8c4428d3a0a9716bd09f94ec92aac235df59da78abf13897a533bbab18b84
  STATUS_CONTEXT: control-center/stable-real-host-final

jobs:
  verify-final:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch immutable final wrapper
        run: |
          url="https://raw.githubusercontent.com/ControlCenterSoft/srv-deployment/${LAUNCHER_COMMIT}/ops/stable-1.0.0-real-host-acceptance-final/run-verified.sh"
          curl -fsSL "$url" -o /tmp/final-wrapper.sh
          size="$(wc -c < /tmp/final-wrapper.sh | tr -d ' ')"
          actual="$({ printf 'blob %s\0' "$size"; cat /tmp/final-wrapper.sh; } | sha1sum | awk '{print $1}')"
          test "$actual" = "$LAUNCHER_BLOB_SHA1"
          bash -n /tmp/final-wrapper.sh
      - name: Rebuild exact pinned orchestrator
        id: build
        run: |
          sudo env STABLE_ACCEPTANCE_BUILD_ONLY=1 OUTPUT_STABLE=/tmp/stable-final.sh bash /tmp/final-wrapper.sh
          sudo bash -n /tmp/stable-final.sh
          actual="$(sudo sha256sum /tmp/stable-final.sh | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ORCHESTRATOR_SHA256"
          sudo grep -F 'RC_VERSION="1.0.0"' /tmp/stable-final.sh
          sudo grep -F 'RC_COMMIT="1b364ae88789696bf98537d21544de8a259d086d"' /tmp/stable-final.sh
          sudo grep -F 'BETA_VERSION="1.0.0-rc.1"' /tmp/stable-final.sh
          sudo grep -F 'BETA_COMMIT="77b62d5829a46b1b29698495043146d79f37dc48"' /tmp/stable-final.sh
          sudo grep -F 'scripts/stable-update-acceptance.sh' /tmp/stable-final.sh
          ! sudo grep -Fq 'scripts/rc1-update-acceptance.sh' /tmp/stable-final.sh
          echo "$actual  /tmp/stable-final.sh"
      - name: Publish final wrapper verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION='Final stable real-host wrapper verification failed'
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION="$EXPECTED_ORCHESTRATOR_SHA256"
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            'state':os.environ['STATE'],
            'context':os.environ['STATUS_CONTEXT'],
            'description':os.environ['DESCRIPTION'],
            'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STABLE_SHA}" \
            --data-binary @/tmp/status.json
