name: stable-real-host-orchestrator-builder-v2

on:
  push:
    branches: ["ci/1.0.0-stable-validation-v2"]

permissions:
  contents: read
  statuses: write

env:
  STABLE_SHA: 1b364ae88789696bf98537d21544de8a259d086d
  RC_V7_COMMIT: fe579e3f38e18bf1fc56a93699489b762206427d
  RC_V7_BLOB_SHA1: 65625a24659540df4226cf60134365f18b2917cd
  STATUS_CONTEXT: control-center/stable-builder-inspect

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Build immutable RC v7 script
        run: |
          url="https://raw.githubusercontent.com/ControlCenterSoft/srv-deployment/${RC_V7_COMMIT}/ops/rc1-real-host-acceptance-v7/run-verified.sh"
          curl -fsSL "$url" -o /tmp/rc-v7-launcher.sh
          size="$(wc -c < /tmp/rc-v7-launcher.sh | tr -d ' ')"
          actual="$({ printf 'blob %s\0' "$size"; cat /tmp/rc-v7-launcher.sh; } | sha1sum | awk '{print $1}')"
          test "$actual" = "$RC_V7_BLOB_SHA1"
          sudo env RC1_V7_BUILD_ONLY=1 OUTPUT_V7=/tmp/rc-v7.sh bash /tmp/rc-v7-launcher.sh
          bash -n /tmp/rc-v7.sh
          echo '=== RC V7 UPDATE ACCEPTANCE ANCHORS ==='
          grep -n -C 2 'rc1-update-acceptance.sh' /tmp/rc-v7.sh
      - name: Publish inspection status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION='RC v7 builder anchor inspection failed'
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='RC v7 builder anchors inspected'
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            'state':os.environ['STATE'],
            'context':os.environ['STATUS_CONTEXT'],
            'description':os.environ['DESCRIPTION'],
            'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STABLE_SHA}" \
            --data-binary @/tmp/status.json
