name: Validate Control Center runtime

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-samba-pty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.11
          fetch-depth: 0
      - name: Repair completed interactive Samba provision handling once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('system/control-center-samba-apply')
          s=p.read_text()
          if 'success_markers=[b\'Once the above files are installed' in s:
              print('Samba PTY completion repair already present')
              raise SystemExit(0)
          old="sent=set();buf=b'';secret=password.encode();deadline=time.time()+240\ntry:\n while True:\n  if time.time()>deadline:\n   os.kill(pid,signal.SIGKILL);raise SystemExit('samba-tool interactive provision timeout')"
          new="sent=set();buf=b'';secret=password.encode();deadline=time.time()+240\nsuccess_markers=[b'Once the above files are installed, your Samba AD server will be ready to use',b'Server Role:',b'DOMAIN SID:']\nsuccess_seen=False;success_deadline=None;forced_after_success=False\ntry:\n while True:\n  now=time.time()\n  if success_deadline is not None and now>success_deadline:\n   forced_after_success=True\n   try:os.kill(pid,signal.SIGTERM)\n   except ProcessLookupError:pass\n   time.sleep(1)\n   done,status=os.waitpid(pid,os.WNOHANG)\n   if done!=pid:\n    try:os.kill(pid,signal.SIGKILL)\n    except ProcessLookupError:pass\n   break\n  if now>deadline:\n   os.kill(pid,signal.SIGKILL);raise SystemExit('samba-tool interactive provision timeout')"
          if old not in s: raise SystemExit('PTY deadline marker not found exactly once')
          s=s.replace(old,new,1)
          old2="   buf=(buf+chunk)[-8192:]\n   for key,marker,answer in prompts:\n    if key not in sent and marker in buf:\n     os.write(fd,answer.encode('utf-8')+b'\\n');sent.add(key);break"
          new2="   buf=(buf+chunk)[-8192:]\n   for key,marker,answer in prompts:\n    if key not in sent and marker in buf:\n     os.write(fd,answer.encode('utf-8')+b'\\n');sent.add(key);break\n   if not success_seen and all(marker in buf for marker in success_markers):\n    success_seen=True;success_deadline=time.time()+10\n    try:os.write(fd,b'\\x04')\n    except OSError:pass"
          if old2 not in s: raise SystemExit('PTY output marker not found exactly once')
          s=s.replace(old2,new2,1)
          old3="rc=os.waitstatus_to_exitcode(status)\nif rc!=0:raise SystemExit(rc)\nrequired={'realm','domain','role','dns','forwarder','password','retype'}\nif not required.issubset(sent):raise SystemExit('samba-tool interactive prompt contract incomplete: '+','.join(sorted(required-sent)))"
          new3="rc=os.waitstatus_to_exitcode(status)\nif rc!=0 and not (success_seen and forced_after_success):raise SystemExit(rc)\nrequired={'realm','domain','role','dns','forwarder','password','retype'}\nif not required.issubset(sent):raise SystemExit('samba-tool interactive prompt contract incomplete: '+','.join(sorted(required-sent)))\nif not success_seen:raise SystemExit('samba-tool interactive provision success markers were not observed')\nfor artifact in ('/etc/samba/smb.conf','/var/lib/samba/private/krb5.conf','/var/lib/samba/private/sam.ldb'):\n if not os.path.isfile(artifact) or os.path.getsize(artifact)==0:raise SystemExit('samba-tool provision artifact missing: '+artifact)"
          if old3 not in s: raise SystemExit('PTY result marker not found exactly once')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          if git diff --quiet -- system/control-center-samba-apply; then
            exit 0
          fi
          bash -n system/control-center-samba-apply
          python3 - <<'PY'
          from pathlib import Path
          s=Path('system/control-center-samba-apply').read_text()
          for x in ['success_markers=',"os.write(fd,b'\\x04')",'forced_after_success','samba-tool provision artifact missing']:
              assert x in s,x
          assert '--adminpass=' not in s
          PY
          rm -f .github/workflows/one-shot-fix-samba-pty.yml
          git config user.name 'Control Center Release Bot'
          git config user.email '40738562+filosoff31@users.noreply.github.com'
          git add system/control-center-samba-apply .github/workflows/one-shot-fix-samba-pty.yml
          git commit -m '1.0.11: accept completed Samba provision without PTY hang'
          git push origin HEAD:release/1.0.11

  bootstrap-auth:
    needs: repair-samba-pty
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install clean server without pre-created portal user
        run: |
          set -euo pipefail
          # GitHub-hosted runners ship with an existing password-capable sudo
          # account. A real root-only clean server does not. Lock every existing
          # human sudo/wheel identity for this disposable job so the installer
          # must exercise the documented controladmin bootstrap path instead of
          # correctly adopting the runner account as an existing portal admin.
          while IFS=: read -r user _ uid _; do
            [[ "$uid" =~ ^[0-9]+$ ]] || continue
            (( uid >= 1000 )) || continue
            groups="$(id -nG "$user" 2>/dev/null || true)"
            if grep -qwE '(sudo|wheel)' <<<"$groups"; then sudo passwd -l "$user" >/dev/null 2>&1 || true; fi
          done </etc/passwd

          OUT=/tmp/control-center-bootstrap-install.out
          if ! sudo bash install/install.sh >"$OUT" 2>&1; then
            sed -E 's/^(  Пароль: ).*/\1***REDACTED***/' "$OUT"
            exit 1
          fi

      - name: Prove documented controladmin first login
        run: |
          set -euo pipefail
          OUT=/tmp/control-center-bootstrap-install.out
          USERNAME="$(sed -n 's/^  Логин:  //p' "$OUT" | tail -1)"
          PASSWORD="$(sed -n 's/^  Пароль: //p' "$OUT" | tail -1)"
          [[ "$USERNAME" == controladmin ]]
          [[ ${#PASSWORD} -ge 20 ]]
          echo "::add-mask::$PASSWORD"
          echo 'CHECKPOINT bootstrap-output-ok'
          getent passwd controladmin | awk -F: '$1=="controladmin" && $7=="/usr/sbin/nologin"{ok=1} END{exit !ok}'
          echo 'CHECKPOINT bootstrap-account-ok'
          id -nG controladmin | tr ' ' '\n' | grep -qx control-center-admins
          echo 'CHECKPOINT bootstrap-group-ok'
          sudo passwd -S controladmin | awk '$2=="P"{ok=1} END{exit !ok}'
          echo 'CHECKPOINT bootstrap-password-status-ok'

          python3 - "$USERNAME" "$PASSWORD" >/tmp/control-center-bootstrap-login.json <<'PY'
          import json,sys
          print(json.dumps({'mode':'local','username':sys.argv[1],'password':sys.argv[2]}))
          PY
          curl -fsS -c /tmp/control-center-bootstrap.cookies \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/control-center-bootstrap-login.json \
            http://127.0.0.1:8080/api/auth/login >/tmp/control-center-bootstrap-login-result.json
          echo 'CHECKPOINT bootstrap-login-http-ok'
          python3 - /tmp/control-center-bootstrap-login-result.json <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]));assert j.get('ok') is True,j
          PY
          echo 'CHECKPOINT bootstrap-login-json-ok'
          curl -fsS -b /tmp/control-center-bootstrap.cookies \
            http://127.0.0.1:8080/api/auth/session | \
            python3 -c "import json,sys;j=json.load(sys.stdin);assert j['authenticated'] and j['source']=='local' and j['role']=='admin' and j['username']=='controladmin'"
          echo 'CHECKPOINT bootstrap-session-ok'

          ! sudo grep -R -F --binary-files=without-match "$PASSWORD" \
            /var/lib/control-center /var/lib/control-center-system /var/lib/control-center-root \
            /etc/control-center /opt/control-center 2>/dev/null
          echo 'CHECKPOINT bootstrap-no-plaintext-ok'
          rm -f /tmp/control-center-bootstrap-login.json /tmp/control-center-bootstrap-login-result.json /tmp/control-center-bootstrap.cookies "$OUT"
          unset PASSWORD

  runtime:
    needs: repair-samba-pty
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare real local portal identities
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash ccciadmin
          sudo usermod -aG sudo ccciadmin
          echo 'ccciadmin:CcLocal!Passw0rd-2026' | sudo chpasswd
          sudo useradd -m -s /bin/bash ccviewer
          echo 'ccviewer:CcViewer!Passw0rd-2026' | sudo chpasswd

      - name: Install release exactly as shipped
        run: |
          set -euo pipefail
          sudo bash install/install.sh

      - name: Run full Domain DNS Storage Auth DHCP lifecycle
        env:
          CC_TEST_ADMIN_USER: ccciadmin
          CC_TEST_ADMIN_PASSWORD: CcLocal!Passw0rd-2026
          CC_TEST_VIEWER_USER: ccviewer
          CC_TEST_VIEWER_PASSWORD: CcViewer!Passw0rd-2026
          CC_TEST_DOMAIN_PASSWORD: DomTest!Passw0rd-2026
        run: |
          set -euo pipefail
          sudo -E bash scripts/runtime-acceptance-1.0.11.sh

      - name: Final diagnostics on failure
        if: failure()
        run: |
          set +e
          sudo systemctl status control-center control-center-authd control-center-samba-apply.service control-center-domain-destroy.service control-center-dns-apply.service control-center-storage-apply.service control-center-dhcp-server.service --no-pager || true
          sudo journalctl -u control-center -u control-center-authd -u control-center-samba-apply.service -u control-center-domain-destroy.service -u control-center-dns-apply.service -u control-center-storage-apply.service -n 500 --no-pager || true
          sudo cat /var/lib/control-center-system/samba-status.json 2>/dev/null || true
          sudo cat /var/lib/control-center-system/samba-last.log 2>/dev/null || true
          sudo find /var/lib/control-center-system/cleanup-audits -maxdepth 1 -type f -print -exec cat {} \; 2>/dev/null || true
          dpkg --audit || true

          sudo rm -rf /tmp/control-center-ci-diagnostics
          sudo install -d -m 0755 \
            /tmp/control-center-ci-diagnostics/state \
            /tmp/control-center-ci-diagnostics/journal \
            /tmp/control-center-ci-diagnostics/acceptance
          sudo chown -R "$USER:$USER" /tmp/control-center-ci-diagnostics

          for f in \
            samba-status.json samba-last.log dns-status.json storage-status.json \
            dhcp-status.json dhcp-reservations-status.json market-status.json; do
            sudo test -f "/var/lib/control-center-system/$f" && sudo cp "/var/lib/control-center-system/$f" "/tmp/control-center-ci-diagnostics/state/$f" || true
          done
          sudo test -d /var/lib/control-center-system/modules && sudo cp -a /var/lib/control-center-system/modules /tmp/control-center-ci-diagnostics/state/modules || true
          sudo test -d /var/lib/control-center-system/cleanup-audits && sudo cp -a /var/lib/control-center-system/cleanup-audits /tmp/control-center-ci-diagnostics/state/cleanup-audits || true
          sudo find /tmp -maxdepth 1 -type f -name 'control-center-samba-*' -exec cp {} /tmp/control-center-ci-diagnostics/acceptance/ \; 2>/dev/null || true

          sudo journalctl -u control-center -u control-center-authd -u control-center-samba-apply.service -u control-center-domain-destroy.service -u control-center-dns-apply.service -u control-center-storage-apply.service --no-pager > /tmp/control-center-ci-diagnostics/journal/control-center.log 2>&1 || true
          sudo systemctl status control-center control-center-authd control-center-samba-apply.service control-center-domain-destroy.service control-center-dns-apply.service control-center-storage-apply.service control-center-dhcp-server.service --no-pager > /tmp/control-center-ci-diagnostics/systemd-status.txt 2>&1 || true
          dpkg --audit > /tmp/control-center-ci-diagnostics/dpkg-audit.txt 2>&1 || true
          sudo chown -R "$USER:$USER" /tmp/control-center-ci-diagnostics

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-1.0.11-runtime-diagnostics
          path: /tmp/control-center-ci-diagnostics
          if-no-files-found: warn
          retention-days: 7
