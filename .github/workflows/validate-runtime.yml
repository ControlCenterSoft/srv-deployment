name: Validate Control Center runtime

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare real local portal identities
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash ccciadmin
          sudo usermod -aG sudo ccciadmin
          echo 'ccciadmin:CcLocal!Passw0rd-2026' | sudo chpasswd
          sudo useradd -m -s /bin/bash ccviewer
          echo 'ccviewer:CcViewer!Passw0rd-2026' | sudo chpasswd

      - name: Install release exactly as shipped
        run: |
          set -euo pipefail
          sudo bash install/install.sh

      - name: Run full Domain DNS Storage Auth DHCP lifecycle
        env:
          CC_TEST_ADMIN_USER: ccciadmin
          CC_TEST_ADMIN_PASSWORD: CcLocal!Passw0rd-2026
          CC_TEST_VIEWER_USER: ccviewer
          CC_TEST_VIEWER_PASSWORD: CcViewer!Passw0rd-2026
          CC_TEST_DOMAIN_PASSWORD: DomTest!Passw0rd-2026
        run: |
          set -euo pipefail
          sudo -E bash scripts/runtime-acceptance-1.0.11.sh

      - name: Final diagnostics on failure
        if: failure()
        run: |
          set +e
          sudo systemctl status control-center control-center-authd control-center-samba-apply.service control-center-domain-destroy.service control-center-dns-apply.service control-center-storage-apply.service control-center-dhcp-server.service --no-pager || true
          sudo journalctl -u control-center -u control-center-authd -u control-center-samba-apply.service -u control-center-domain-destroy.service -u control-center-dns-apply.service -u control-center-storage-apply.service -n 500 --no-pager || true
          sudo cat /var/lib/control-center-system/samba-status.json 2>/dev/null || true
          sudo cat /var/lib/control-center-system/samba-last.log 2>/dev/null || true
          sudo find /var/lib/control-center-system/cleanup-audits -maxdepth 1 -type f -print -exec cat {} \; 2>/dev/null || true
          dpkg --audit || true

          sudo rm -rf /tmp/control-center-ci-diagnostics
          sudo install -d -m 0755 \
            /tmp/control-center-ci-diagnostics/state \
            /tmp/control-center-ci-diagnostics/journal \
            /tmp/control-center-ci-diagnostics/acceptance
          sudo chown -R "$USER:$USER" /tmp/control-center-ci-diagnostics

          for f in \
            samba-status.json samba-last.log dns-status.json storage-status.json \
            dhcp-status.json dhcp-reservations-status.json market-status.json; do
            sudo test -f "/var/lib/control-center-system/$f" && sudo cp "/var/lib/control-center-system/$f" "/tmp/control-center-ci-diagnostics/state/$f" || true
          done
          sudo test -d /var/lib/control-center-system/modules && sudo cp -a /var/lib/control-center-system/modules /tmp/control-center-ci-diagnostics/state/modules || true
          sudo test -d /var/lib/control-center-system/cleanup-audits && sudo cp -a /var/lib/control-center-system/cleanup-audits /tmp/control-center-ci-diagnostics/state/cleanup-audits || true
          sudo find /tmp -maxdepth 1 -type f -name 'control-center-samba-*' -exec cp {} /tmp/control-center-ci-diagnostics/acceptance/ \; 2>/dev/null || true

          sudo journalctl -u control-center -u control-center-authd -u control-center-samba-apply.service -u control-center-domain-destroy.service -u control-center-dns-apply.service -u control-center-storage-apply.service --no-pager > /tmp/control-center-ci-diagnostics/journal/control-center.log 2>&1 || true
          sudo systemctl status control-center control-center-authd control-center-samba-apply.service control-center-domain-destroy.service control-center-dns-apply.service control-center-storage-apply.service control-center-dhcp-server.service --no-pager > /tmp/control-center-ci-diagnostics/systemd-status.txt 2>&1 || true
          dpkg --audit > /tmp/control-center-ci-diagnostics/dpkg-audit.txt 2>&1 || true
          sudo chown -R "$USER:$USER" /tmp/control-center-ci-diagnostics

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-1.0.11-runtime-diagnostics
          path: /tmp/control-center-ci-diagnostics
          if-no-files-found: warn
          retention-days: 7
