name: Validate Control Center runtime

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install release exactly as shipped
        run: |
          set -euo pipefail
          sudo bash install/install.sh

      - name: Validate installed version and default HTTP runtime
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' </opt/control-center/VERSION)" = "1.0.9"
          test "$(tr -d '[:space:]' </opt/control-center/BUILD)" = "20260819.3"
          sudo grep -qx 'CONTROL_CENTER_PORT=8080' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_SSL=0' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_STANDARD_PORT=0' /etc/control-center/web.env
          curl -fsS http://127.0.0.1:8080/api/health | python3 -m json.tool
          curl -fsS http://127.0.0.1:8080/api/system | python3 -m json.tool >/dev/null
          sudo -u control-center psql -d control_center -Atqc "select version from control_center.schema_migrations order by version desc limit 1" | grep -qx 002
          systemctl is-active --quiet control-center
          systemctl cat control-center | grep -F 'AmbientCapabilities=CAP_NET_BIND_SERVICE'

      - name: Switch live runtime to custom HTTPS 8443
        run: |
          set -euo pipefail
          sudo systemctl stop control-center-web-apply.path
          sudo tee /var/lib/control-center/web-pending.json >/dev/null <<'JSON'
          {"port":8443,"previous_port":8080,"ssl_enabled":true,"previous_ssl_enabled":false,"standard_port":false,"previous_standard_port":false,"job_id":"ci-https-8443","requested_at":1}
          JSON
          if ! sudo bash -x /usr/local/sbin/control-center-web-apply; then
            echo '=== web-status.json ==='
            sudo cat /var/lib/control-center-system/web-status.json 2>/dev/null || true
            echo '=== web.env ==='
            sudo cat /etc/control-center/web.env 2>/dev/null || true
            echo '=== control-center.service ==='
            systemctl status control-center --no-pager -l || true
            echo '=== control-center journal ==='
            journalctl -u control-center -n 120 --no-pager || true
            exit 1
          fi
          curl -kfsS https://127.0.0.1:8443/api/health | python3 -m json.tool
          sudo openssl x509 -in /etc/control-center/tls/server.crt -noout -subject -issuer -dates -ext subjectAltName
          test "$(sudo stat -c '%U:%G %a' /etc/control-center/tls/server.key)" = "root:control-center 640"
          sudo grep -qx 'CONTROL_CENTER_PORT=8443' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_SSL=1' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_STANDARD_PORT=0' /etc/control-center/web.env

      - name: Switch live runtime to standard HTTP 80
        run: |
          set -euo pipefail
          sudo tee /var/lib/control-center/web-pending.json >/dev/null <<'JSON'
          {"port":80,"previous_port":8443,"ssl_enabled":false,"previous_ssl_enabled":true,"standard_port":true,"previous_standard_port":false,"job_id":"ci-http-80","requested_at":2}
          JSON
          if ! sudo /usr/local/sbin/control-center-web-apply; then
            sudo cat /var/lib/control-center-system/web-status.json 2>/dev/null || true
            systemctl status control-center --no-pager -l || true
            journalctl -u control-center -n 120 --no-pager || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:80/api/health | python3 -m json.tool
          sudo grep -qx 'CONTROL_CENTER_PORT=80' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_SSL=0' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_STANDARD_PORT=1' /etc/control-center/web.env

      - name: Switch live runtime to standard HTTPS 443
        run: |
          set -euo pipefail
          sudo tee /var/lib/control-center/web-pending.json >/dev/null <<'JSON'
          {"port":443,"previous_port":80,"ssl_enabled":true,"previous_ssl_enabled":false,"standard_port":true,"previous_standard_port":true,"job_id":"ci-https-443","requested_at":3}
          JSON
          if ! sudo /usr/local/sbin/control-center-web-apply; then
            sudo cat /var/lib/control-center-system/web-status.json 2>/dev/null || true
            systemctl status control-center --no-pager -l || true
            journalctl -u control-center -n 120 --no-pager || true
            exit 1
          fi
          curl -kfsS https://127.0.0.1:443/api/health | python3 -m json.tool
          WEB_JSON="$(curl -kfsS https://127.0.0.1:443/api/settings/web)"
          python3 - "$WEB_JSON" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['runtime_port']==443
          assert j['runtime_ssl'] is True
          assert j['runtime_standard_port'] is True
          PY
          sudo grep -qx 'CONTROL_CENTER_PORT=443' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_SSL=1' /etc/control-center/web.env
          sudo grep -qx 'CONTROL_CENTER_STANDARD_PORT=1' /etc/control-center/web.env

      - name: Run full installed acceptance
        run: |
          set -euo pipefail
          sudo bash scripts/acceptance-1.0.9.sh

      - name: Verify rollback-ready state and no dpkg damage
        run: |
          set -euo pipefail
          test -z "$(dpkg --audit 2>&1 || true)"
          sudo -u control-center psql -d control_center -Atqc "select count(*)>=1 from control_center.ad_dc_preflight_runs" | grep -qx t
          systemctl is-active --quiet control-center
