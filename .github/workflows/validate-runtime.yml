name: Validate Control Center runtime

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare real local portal identities
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash ccciadmin
          sudo usermod -aG sudo ccciadmin
          echo 'ccciadmin:CcLocal!Passw0rd-2026' | sudo chpasswd
          sudo useradd -m -s /bin/bash ccviewer
          echo 'ccviewer:CcViewer!Passw0rd-2026' | sudo chpasswd

      - name: Install release exactly as shipped
        run: |
          set -euo pipefail
          sudo bash install/install.sh

      - name: Run full Domain DNS Storage Auth DHCP lifecycle
        env:
          CC_TEST_ADMIN_USER: ccciadmin
          CC_TEST_ADMIN_PASSWORD: CcLocal!Passw0rd-2026
          CC_TEST_VIEWER_USER: ccviewer
          CC_TEST_VIEWER_PASSWORD: CcViewer!Passw0rd-2026
          CC_TEST_DOMAIN_PASSWORD: DomTest!Passw0rd-2026
        run: |
          set -euo pipefail
          sudo -E bash scripts/runtime-acceptance-1.0.11.sh

      - name: Final diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status control-center control-center-authd control-center-samba-apply.service control-center-domain-destroy.service control-center-dns-apply.service control-center-storage-apply.service control-center-dhcp-server.service --no-pager || true
          sudo journalctl -u control-center -u control-center-authd -u control-center-samba-apply.service -u control-center-domain-destroy.service -u control-center-dns-apply.service -u control-center-storage-apply.service -n 500 --no-pager || true
          sudo cat /var/lib/control-center-system/samba-status.json 2>/dev/null || true
          sudo cat /var/lib/control-center-system/samba-last.log 2>/dev/null || true
          sudo find /var/lib/control-center-system/cleanup-audits -maxdepth 1 -type f -print -exec cat {} \; 2>/dev/null || true
          dpkg --audit || true
