name: Trusted Release Gate

on:
  pull_request_target:
    branches:
      - main
      - '1.1.x'
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: trusted-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-only:
    if: >-
      ${{ github.event.pull_request.draft == false &&
          (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == '1.1.x') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # pull_request_target/pull_request_review are intentional: the validator is
      # always loaded from protected main. Never checkout, import, source, or
      # execute pull-request-controlled files in this job. This workflow cannot
      # merge; Integrator retains the only merge authority after applicable
      # exact-SHA QA/Security/Quality gates are complete.
      - name: Checkout trusted gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact head, current base and independent review without merge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          python3 scripts/release_gate.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --wait-seconds 900 \
            --no-merge
