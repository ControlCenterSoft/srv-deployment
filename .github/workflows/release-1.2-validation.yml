name: SRV Control Center 1.2.0 validation

on:
  push:
    branches: [release/1.2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate archived 1.2.0 release descriptor
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('releases/1.2.0')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['release_id']=='1.2.0', manifest
          assert manifest['release_version']=='1.2.0', manifest

          # deployment.json tracks the currently promoted production release.
          # Only validate 1.2.0 wiring when 1.2.0 itself is the active descriptor.
          cfg=json.loads(Path('deployment.json').read_text())
          if cfg.get('release_id')=='1.2.0':
              assert cfg['release_path']=='releases/1.2.0', cfg
              assert cfg['manifest']=='releases/1.2.0/manifest.json', cfg
          PY

      - name: Validate release script checksums
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('releases/1.2.0')
          manifest=json.loads((root/'manifest.json').read_text())
          bad=False
          for name,item in manifest['scripts'].items():
              digest=hashlib.sha256((root/item['path']).read_bytes()).hexdigest()
              print(f'{name}: {digest} expected={item["sha256"]}')
              if digest != item['sha256']:
                  bad=True
          if bad:
              raise SystemExit('release script checksum mismatch')
          PY

      - name: Syntax and compile validation
        run: |
          bash -n releases/1.2.0/preflight.sh
          bash -n releases/1.2.0/apply.sh
          bash -n releases/1.2.0/acceptance.sh
          bash -n releases/1.2.0/rollback.sh
          bash -n releases/1.2.0/system/install-auth.sh
          bash -n releases/1.2.0/system/srvcc-configure-auto-updates
          python3 -m compileall -q releases/1.2.0/payload/app
          python3 -m py_compile \
            releases/1.2.0/system/srv-control-system-agent \
            releases/1.2.0/system/srv-control-backup \
            releases/1.2.0/system/srv-control-os-auto-update
          node --check releases/1.2.0/payload/static/js/dashboard.js
          node --check releases/1.2.0/payload/static/js/access.js
          node --check releases/1.2.0/payload/static/js/adguard.js
          node --check releases/1.2.0/payload/static/js/minecraft.js
          node --check releases/1.2.0/payload/static/js/system.js
          node --check releases/1.2.0/payload/static/js/shell.js

      - name: Validate 1.2.0 UI contract
        run: |
          grep -Fq 'Топ 3 по CPU' releases/1.2.0/payload/templates/dashboard.html
          grep -Fq 'Топ 3 по RAM' releases/1.2.0/payload/templates/dashboard.html
          grep -Fq 'grid-template-columns: repeat(4' releases/1.2.0/payload/static/css/dashboard-1.2.css
          grep -Fq 'Полный администратор' releases/1.2.0/payload/templates/access.html
          grep -Fq 'data-module="minecraft"' releases/1.2.0/payload/templates/shell.html
          grep -Fq 'adguardConfigForm' releases/1.2.0/payload/templates/adguard.html
          grep -Fq 'minecraftConfigForm' releases/1.2.0/payload/templates/minecraft.html
          ! grep -R -n -E 'пока не работает|будет реализовано|недоступно потому' \
            releases/1.2.0/payload/templates releases/1.2.0/payload/static

  database-rbac-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python and PostgreSQL dependencies
        run: |
          python -m venv /tmp/srvcc-venv
          /tmp/srvcc-venv/bin/pip install --disable-pip-version-check -r releases/1.2.0/payload/requirements.lock
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          sudo systemctl start postgresql

      - name: Create service account and database
        run: |
          sudo groupadd --system srv-control || true
          sudo useradd --system --gid srv-control --home-dir /var/lib/srv-control --shell /usr/sbin/nologin srv-control || true
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='srv-control'" | grep -q 1 || sudo -u postgres createuser --login srv-control
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='srv_control'" | grep -q 1 || sudo -u postgres createdb --owner=srv-control srv_control
          sudo install -d -m 0750 -o root -g srv-control /opt/srv-control
          sudo cp -a releases/1.2.0/payload/. /opt/srv-control/
          sudo chown -R root:srv-control /opt/srv-control
          sudo find /opt/srv-control -type d -exec chmod 0750 {} +
          sudo find /opt/srv-control -type f -exec chmod 0640 {} +

      - name: Apply complete migration chain
        run: |
          sudo -u srv-control env \
            PYTHONPATH=/opt/srv-control \
            PYTHONDONTWRITEBYTECODE=1 \
            /tmp/srvcc-venv/bin/alembic \
            -c /opt/srv-control/alembic.ini \
            upgrade head
          test "$(sudo -u srv-control psql -d srv_control -Atc 'SELECT version_num FROM alembic_version LIMIT 1;')" = "12f0a1200001"

      - name: Validate direct user Write and Full Administrator
        run: |
          sudo -u srv-control env \
            PYTHONPATH=/opt/srv-control \
            PYTHONDONTWRITEBYTECODE=1 \
            /tmp/srvcc-venv/bin/python - <<'PY'
          from app.core.rbac import (
              FULL_ADMIN_PERMISSION_KEY, MODULES, delete_grant,
              has_permission, is_full_admin, permissions_for, upsert_grant,
          )
          from app.core.system_auth import Identity, _elevate_rbac_admin

          identity=Identity(
              username='ci-user', uid=65000, gid=65000,
              groups=('ci-group',), auth_source='local', is_admin=False,
          )
          ids=[]
          try:
              grant=upsert_grant(
                  subject_type='user', subject_name='ci-user', source='local',
                  module='network', access='write', actor='ci',
              )
              ids.append(int(grant['id']))
              assert has_permission(identity,'network','write') is True
              assert has_permission(identity,'minecraft','write') is False
              assert is_full_admin(identity) is False

              admin=upsert_grant(
                  subject_type='user', subject_name='ci-user', source='local',
                  module='network', access='admin', actor='ci',
              )
              ids.append(int(admin['id']))
              assert admin['module']=='*' and admin['access']=='admin'
              assert is_full_admin(identity) is True
              elevated=_elevate_rbac_admin(identity)
              assert elevated.is_admin is True
              permissions=permissions_for(elevated)
              assert permissions[FULL_ADMIN_PERMISSION_KEY]=='admin'
              for module in MODULES:
                  assert has_permission(elevated,module,'write') is True
          finally:
              for grant_id in reversed(ids):
                  delete_grant(grant_id)
          PY

      - name: Validate dashboard and Minecraft collectors
        run: |
          sudo -u srv-control env \
            PYTHONPATH=/opt/srv-control \
            PYTHONDONTWRITEBYTECODE=1 \
            /tmp/srvcc-venv/bin/python - <<'PY'
          from app.core.metrics import snapshot
          from app.core.minecraft import snapshot as minecraft_snapshot

          metrics=snapshot()
          assert len(metrics['processes']['cpu_top']) <= 3
          assert len(metrics['processes']['memory_top']) <= 3
          minecraft=minecraft_snapshot()
          assert isinstance(minecraft,dict)
          assert 'installed' in minecraft and 'properties' in minecraft
          PY
