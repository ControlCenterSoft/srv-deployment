name: inspect-rc-v7-for-stable

on:
  push:
    branches: ["ops/1.0.0-stable-real-host-v1"]

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark inspection pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({"state":"pending","context":"ops/stable-v1-inspect","description":"Inspecting accepted RC v7 anchors","target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
      - name: Materialize immutable accepted RC v7 orchestrator
        run: |
          set -Eeuo pipefail
          url='https://raw.githubusercontent.com/ControlCenterSoft/srv-deployment/fe579e3f38e18bf1fc56a93699489b762206427d/ops/rc1-real-host-acceptance-v7/run-verified.sh'
          curl -fsSL "$url" -o /tmp/v7-launcher.sh
          chmod 0700 /tmp/v7-launcher.sh
          sudo env RC1_V7_BUILD_ONLY=1 OUTPUT_V7=/tmp/v7.sh bash /tmp/v7-launcher.sh
          sudo chown "$USER:$USER" /tmp/v7.sh
          printf 'V7_SHA256='; sha256sum /tmp/v7.sh | awk '{print $1}'
          bash -n /tmp/v7.sh
      - name: Inspect stable transformation anchors
        run: |
          set -Eeuo pipefail
          echo '=== CONSTANTS ==='
          grep -nE '^(RC_|BETA_|PRIOR_RC_|BASE=|REPORT_|RESUME_|GO_VERSION|BACKEND_URL|PROXY_URL)' /tmp/v7.sh || true
          echo '=== FUNCTIONS ==='
          grep -nE '^[a-zA-Z_][a-zA-Z0-9_]*\(\)' /tmp/v7.sh || true
          echo '=== RECOVERY AND INITIAL PHASE ==='
          sed -n '510,625p' /tmp/v7.sh
          echo '=== CONTINUE AND RESUME PHASES ==='
          sed -n '625,790p' /tmp/v7.sh
      - name: Publish inspection result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure; DESC='Stable v1 anchor inspection failed'
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Stable v1 anchor inspection passed'; fi
          export STATE DESC
          python3 - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({"state":os.environ["STATE"],"context":"ops/stable-v1-inspect","description":os.environ["DESC"],"target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
