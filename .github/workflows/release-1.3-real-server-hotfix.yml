name: SRV Control Center 1.3.x real-server acceptance regression

on:
  push:
    branches: [release/1.3.*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-server-acceptance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production acceptance wiring
        run: |
          set -Eeuo pipefail
          ACCEPTANCE="$(python3 -c 'import json; print(json.load(open("deployment.json"))["acceptance"])')"
          bash -n "$ACCEPTANCE"
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          cfg=json.loads(Path('deployment.json').read_text())
          manifest=json.loads(Path(cfg['manifest']).read_text())
          item=manifest['scripts']['acceptance']
          root=Path(cfg['release_path'])
          expected=root / item['path']

          assert cfg['channel']=='production',cfg
          assert re.fullmatch(r'1\.3\.\d+',cfg['release_id']),cfg
          assert cfg['acceptance']==str(expected),(cfg['acceptance'],str(expected))
          assert manifest['release_id']==manifest['release_version']==cfg['release_id'],manifest

          data=expected.read_bytes()
          assert hashlib.sha256(data).hexdigest()==item['sha256']
          wrapper=data.decode('utf-8')
          source=(root/'acceptance.sh').read_text(encoding='utf-8')

          required=(
              'mkdir -p -- "$restored/cache"',
              'defaultNamingContext',
              '-b "$restored_base_dn" -s base objectSid',
              'restored domain naming context missing',
              'restored domain SID missing',
              'acceptance SID hotfix anchor not found; refusing unsafe patch',
          )
          contract_text=wrapper
          if not all(x in contract_text for x in required):
              m=re.search(r'acceptance-(1\.3\.\d+)\.sh',wrapper)
              assert m, 'active acceptance wrapper does not contain real-server hotfix contract or a validated predecessor helper'
              predecessor=m.group(1)
              helper=root/f'acceptance-{predecessor}.sh'
              assert helper.is_file(),helper
              target=cfg['release_id']
              adaptation=(
                  f"text=text.replace('{predecessor}','{target}')" in wrapper
                  or f'text=text.replace("{predecessor}","{target}")' in wrapper
                  or target==predecessor
              )
              assert adaptation, f'release identity adaptation missing: {predecessor} -> {target}'
              contract_text=helper.read_text(encoding='utf-8')

          for needle in required:
              assert needle in contract_text,needle

          old_sid = '''    restored_sid="$(ldbsearch -H "$restored_sam" -b '' -s base objectSid 2>/dev/null | awk '/^objectSid: /{print $2; exit}')"\n    [[ "$restored_sid" == "$live_sid" ]] || fail "restored domain SID mismatch"\n'''
          assert old_sid in source, 'production acceptance SID anchor changed unexpectedly'
          print('REAL-SERVER ACCEPTANCE CONTRACT PASS:',cfg['release_id'])
          PY
