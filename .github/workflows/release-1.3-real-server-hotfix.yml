name: SRV Control Center 1.3.0 real-server hotfix

on:
  push:
    branches: [release/1.3.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-server-acceptance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production acceptance wiring
        run: |
          set -Eeuo pipefail
          bash -n releases/1.3.0/acceptance-real-server.sh
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          cfg=json.loads(Path('deployment.json').read_text())
          manifest=json.loads(Path(cfg['manifest']).read_text())
          item=manifest['scripts']['acceptance']
          expected=str(Path(cfg['release_path']) / item['path'])

          assert cfg['channel']=='production',cfg
          assert cfg['release_id']=='1.3.0',cfg
          assert cfg['acceptance']==expected,(cfg['acceptance'],expected)

          data=Path(expected).read_bytes()
          assert hashlib.sha256(data).hexdigest()==item['sha256']
          text=data.decode('utf-8')
          source=Path('releases/1.3.0/acceptance.sh').read_text(encoding='utf-8')

          assert 'mkdir -p -- "$restored/cache"' in text
          assert 'defaultNamingContext' in text
          assert '-b "$restored_base_dn" -s base objectSid' in text
          assert 'restored domain naming context missing' in text
          assert 'restored domain SID missing' in text
          assert 'acceptance SID hotfix anchor not found; refusing unsafe patch' in text

          old_sid = '''    restored_sid="$(ldbsearch -H "$restored_sam" -b '' -s base objectSid 2>/dev/null | awk '/^objectSid: /{print $2; exit}')"\n    [[ "$restored_sid" == "$live_sid" ]] || fail "restored domain SID mismatch"\n'''
          assert old_sid in source, 'production acceptance SID anchor changed unexpectedly'
          PY
