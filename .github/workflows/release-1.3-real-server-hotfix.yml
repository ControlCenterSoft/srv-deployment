name: SRV Control Center 1.3.0 real-server hotfix

on:
  push:
    branches: [release/1.3.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-server-acceptance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production acceptance wiring
        run: |
          set -Eeuo pipefail
          bash -n releases/1.3.0/acceptance-real-server.sh
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          cfg=json.loads(Path('deployment.json').read_text())
          manifest=json.loads(Path(cfg['manifest']).read_text())
          item=manifest['scripts']['acceptance']
          expected=str(Path(cfg['release_path']) / item['path'])
          assert cfg['channel']=='production',cfg
          assert cfg['release_id']=='1.3.0',cfg
          assert cfg['acceptance']==expected,(cfg['acceptance'],expected)
          data=Path(expected).read_bytes()
          assert hashlib.sha256(data).hexdigest()==item['sha256']
          text=data.decode('utf-8')
          assert 'mkdir -p -- "$restored/cache"' in text
          assert 'acceptance hotfix anchor not found; refusing unsafe patch' in text
          PY
