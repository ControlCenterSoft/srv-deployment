name: Validate Control Center release

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: python -m py_compile app/main.py app/wsgi.py license/issue-license.py

      - name: JavaScript syntax
        run: node --check app/static/app.js

      - name: Bash syntax
        run: |
          set -euo pipefail
          for f in \
            install/install.sh \
            install/uninstall.sh \
            update/control-center-update \
            update/control-center-os-update \
            network/control-center-network-apply \
            market/control-center-market-apply \
            market/control-center-dhcp-apply \
            license/control-center-license-apply \
            scripts/acceptance-1.0.5.sh \
            scripts/acceptance-1.0.6.sh; do
            bash -n "$f"
          done

      - name: Validate release consistency and 1.0.6 features
        run: |
          python - <<'PY'
          import ast,json,pathlib,re
          root=pathlib.Path('.')
          for p in root.rglob('*.json'): json.loads(p.read_text())

          module=ast.parse((root/'app/main.py').read_text()); values={}
          for node in module.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id in {'APP_VERSION','APP_BUILD'}:
                          values[target.id]=ast.literal_eval(node.value)
          version=values['APP_VERSION']; build=values['APP_BUILD']
          assert re.fullmatch(r'\d+\.\d+\.\d+',version)

          deployment=json.loads((root/'deployment.json').read_text())
          assert deployment['release']==version and deployment['build']==build
          assert deployment['channel']=='production'
          assert deployment['release_branch']==f'release/{version}'
          app_release=json.loads((root/'app/release.json').read_text())
          assert app_release=={'version':version,'build':build}
          manifest=json.loads((root/'releases'/version/'manifest.json').read_text())
          assert manifest['release']==version and manifest['build']==build and manifest['channel']=='production'

          installer=(root/'install/install.sh').read_text()
          assert re.search(rf'^VERSION={re.escape(version)}$',installer,re.M)
          assert 'ReadOnlyPaths=/var/lib/control-center-system /var/lib/control-center-license /etc/netplan/90-control-center.yaml /etc/dnsmasq.d/control-center-dhcp.conf' in installer
          assert '/gunicorn ' in installer and 'wsgi:app' in installer

          main=(root/'app/main.py').read_text()
          for token in [
              "@app.get('/api/networks')",
              "@app.post('/api/dhcp/check')",
              "@app.get('/api/notifications')",
              'extra_options',
              'NETPLAN_CONF',
              'DHCP_CONF',
              'SYSTEM_STATE_DIR',
          ]: assert token in main, token

          dhcp=(root/'market/control-center-dhcp-apply').read_text()
          assert 'extra_options' in dhcp and "lines.append(f'dhcp-option={code},{value}')" in dhcp
          network=(root/'network/control-center-network-apply').read_text()
          assert 'chown root:control-center "$TMP"' in network and 'chmod 0640 "$TMP"' in network

          template=(root/'app/templates/index.html').read_text()
          for token in ['interfacesTable','dhcpServiceStatus','dhcpOptionsTable','checkDhcp','notificationBell','mobileBackdrop','/static/app.js?v={{ version }}']:
              assert token in template,token
          inline=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>',template,re.I)
          assert not inline, f'inline script tags found: {inline}'

          css=(root/'app/static/app.css').read_text()
          assert 'html{font-size:15px}' in css
          assert '@media(max-width:900px)' in css and 'mobile-nav-open' in css

          js=(root/'app/static/app.js').read_text()
          for token in ['/api/notifications','READ_KEY','renderInterfaces','extra_options','/api/dhcp/check']:
              assert token in js,token

          wsgi=(root/'app/wsgi.py').read_text()
          assert "script-src 'self';" in wsgi and 'unsafe-inline' not in wsgi

          lifecycle=(root/'docs/UPDATE-LIFECYCLE-POLICY-RU.md').read_text()
          assert 'не заявляет строгую совместимость с Semantic Versioning' in lifecycle
          assert 'последовательный production-релиз' in lifecycle
          readme=(root/'README.md').read_text()
          assert f'Control Center {version}' in readme
          print(f'Validated Control Center {version} build {build}')
          PY

      - name: Validate Professional public key
        run: openssl pkey -pubin -in license/vendor-public.pem -noout

      - name: Reject private signing keys
        run: |
          set -euo pipefail
          if git ls-files | grep -Eai '(^|/)(private|secret|signing)[^/]*(\.pem|\.key)$'; then
            echo 'Private/signing key material must never be committed.' >&2
            exit 1
          fi
          if grep -RIl --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY' .; then
            echo 'Private key material detected in repository.' >&2
            exit 1
          fi

      - name: Required documentation
        run: |
          set -euo pipefail
          for f in \
            docs/README.md docs/EULA-RU.md docs/PRODUCT-EDITIONS.md docs/UPDATE-LIFECYCLE-POLICY-RU.md docs/RELEASE-HISTORY.md \
            docs/INSTALL.md docs/UPDATE.md docs/OS_UPDATES.md docs/LICENSING.md \
            docs/NETWORK.md docs/DHCP.md docs/NOTIFICATIONS.md docs/UI.md docs/SECURITY.md docs/TROUBLESHOOTING.md \
            releases/1.0.6/README.md releases/1.0.6/manifest.json; do
            test -s "$f"
          done
