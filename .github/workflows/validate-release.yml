name: Validate Control Center release

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: |
          python -m py_compile \
            app/main.py app/wsgi.py app/database.py app/db_migrate.py app/db_cli.py \
            app/release_107.py app/release_108.py license/issue-license.py

      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/release-108.js

      - name: Bash syntax
        run: |
          set -euo pipefail
          for f in \
            install/install.sh install/install-base-1.0.7.sh \
            install/uninstall.sh install/uninstall-base-1.0.7.sh \
            update/control-center-update update/control-center-update-base-1.0.7 update/control-center-os-update \
            system/control-center-web-apply \
            network/control-center-network-apply \
            market/control-center-market-apply market/control-center-dhcp-apply \
            license/control-center-license-apply \
            scripts/acceptance-1.0.5.sh scripts/acceptance-1.0.6.sh scripts/acceptance-1.0.7.sh scripts/acceptance-1.0.8.sh; do
            bash -n "$f"
          done

      - name: Validate release consistency and 1.0.8 architecture
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          for p in root.rglob('*.json'):
              json.loads(p.read_text())
          app_release=json.loads((root/'app/release.json').read_text())
          version=app_release['version']; build=app_release['build']
          assert version=='1.0.8' and build=='20260819.1'
          deployment=json.loads((root/'deployment.json').read_text())
          assert deployment['release']==version and deployment['build']==build
          assert deployment['channel']=='production' and deployment['release_branch']==f'release/{version}'
          manifest=json.loads((root/'releases'/version/'manifest.json').read_text())
          assert manifest['release']==version and manifest['build']==build
          assert manifest['database']['engine']=='PostgreSQL'

          wsgi=(root/'app/wsgi.py').read_text()
          assert 'import release_108' in wsgi and 'release_108.register(app, main)' in wsgi
          ext=(root/'app/release_108.py').read_text()
          for token in [
              "VERSION = '1.0.8'", "BUILD = '20260819.1'", '/api/settings/update/install',
              'update_available', 'market-events.jsonl', 'Установка…', 'Работает', 'Ошибка',
              "app.view_functions['market']", "app.view_functions['notifications']",
              "request.path == '/static/app.js'", "request.path == '/static/app.css'",
          ]: assert token in ext,token

          overlay=(root/'app/static/release-108.js').read_text()
          for token in ['market108','service-runtime-status','installUpdate','refreshUpdate108','/api/settings/update/install']:
              assert token in overlay,token
          css=(root/'app/static/release-108.css').read_text()
          for token in ['service-runtime-status','installing','error','update-ready-108']:
              assert token in css,token

          market=(root/'market/control-center-market-apply').read_text()
          for token in ['policy-rc.d','market-events.jsonl','market-last.log','dnsmasq --test','status running','event started','event succeeded']:
              assert token in market,token
          assert 'ln -s /dev/null' not in market

          installer=(root/'install/install.sh').read_text()
          for token in ['install-base-1.0.7.sh','VERSION=1.0.8','BUILD=20260819.1','control-center-update-now.path','control-center-update-base-1.0.7']:
              assert token in installer,token
          base_installer=(root/'install/install-base-1.0.7.sh').read_text()
          assert 'postgresql postgresql-client' in base_installer and 'db_migrate.py' in base_installer

          updater=(root/'update/control-center-update').read_text()
          for token in ['control-center-update-base-1.0.7','update-now','FORCE_UPDATE']:
              assert token in updater,token
          base_updater=(root/'update/control-center-update-base-1.0.7').read_text()
          assert 'BUILD_FILE' in base_updater and 'pg_dump' in base_updater and 'app/release.json' in base_updater

          req=(root/'requirements.txt').read_text()
          assert re.search(r'^psycopg\[binary\]>=3\.2,<4\.0$',req,re.M)
          assert (root/'app/requirements.txt').read_text()==req
          print(f'Validated Control Center {version} build {build}')
          PY

      - name: Install PostgreSQL and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          python -m pip install -r requirements.txt
          sudo systemctl start postgresql
          sudo -u postgres pg_isready

      - name: Validate real PostgreSQL migration and peer authentication
        run: |
          set -euo pipefail
          PYTHON="${pythonLocation}/bin/python"
          sudo rm -rf /tmp/control-center-ci-app
          sudo cp -a app /tmp/control-center-ci-app
          sudo chown -R root:root /tmp/control-center-ci-app
          sudo chmod -R a+rX /tmp/control-center-ci-app
          if ! id control-center >/dev/null 2>&1; then sudo useradd --system --home /tmp/control-center-ci --shell /usr/sbin/nologin control-center; fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE IF EXISTS control_center;'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'DROP ROLE IF EXISTS "control-center";'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE "control-center" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD NULL;'
          sudo -u postgres createdb --owner=control-center control_center
          sudo -u control-center psql -d control_center -Atqc 'SELECT current_user,current_database()' | grep -qx 'control-center|control_center'
          sudo -u control-center env CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' "$PYTHON" /tmp/control-center-ci-app/db_migrate.py
          sudo -u control-center env CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' PYTHONPATH=/tmp/control-center-ci-app "$PYTHON" - <<'PY'
          import database
          h=database.health()
          assert h['ok'] and h['database']=='control_center' and h['role']=='control-center'
          assert h['migration']['version']=='001'
          database.set_setting('web.port',8080)
          database.upsert_job('ci-job','ci','queued',payload={'ok':True})
          database.sync_notifications([{'id':'ci-event','source':'ci','title':'CI','state':'ok','severity':'ok','message':'PostgreSQL works','timestamp':1}])
          database.mark_notifications(['ci-event'])
          database.upsert_local_node(edition='Professional',version='1.0.8',build='20260819.1')
          assert database.cluster_nodes()
          PY

      - name: Validate real DHCP install and remove lifecycle
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/control-center /var/lib/control-center-system
          sudo install -d -o control-center -g control-center -m 0755 /var/lib/control-center
          sudo install -d -o root -g control-center -m 0750 /var/lib/control-center-system /var/lib/control-center-system/modules
          sudo rm -f /etc/dnsmasq.d/control-center-dhcp.conf
          sudo apt-get remove -y dnsmasq >/dev/null 2>&1 || true
          sudo tee /var/lib/control-center/market-pending.json >/dev/null <<'JSON'
          {"module":"dhcp","action":"install","request_id":"ci-dhcp-install","requested_at":1}
          JSON
          sudo bash market/control-center-market-apply
          dpkg-query -W -f='${Status}' dnsmasq | grep -q 'install ok installed'
          sudo python3 - <<'PY'
          import json
          state=json.load(open('/var/lib/control-center-system/modules/dhcp.json'))
          status=json.load(open('/var/lib/control-center-system/market-status.json'))
          assert state['installed'] is True and state['package']=='dnsmasq'
          assert status['state']=='running' and status['module']=='dhcp'
          events=[json.loads(x) for x in open('/var/lib/control-center-system/market-events.jsonl') if x.strip()]
          assert any(x['phase']=='started' and x['action']=='install' for x in events)
          assert any(x['phase']=='succeeded' and x['action']=='install' for x in events)
          PY
          sudo dnsmasq --test --conf-file=/etc/dnsmasq.d/control-center-dhcp.conf
          ! systemctl is-active --quiet dnsmasq.service
          sudo tee /var/lib/control-center/market-pending.json >/dev/null <<'JSON'
          {"module":"dhcp","action":"remove","request_id":"ci-dhcp-remove","requested_at":2}
          JSON
          sudo bash market/control-center-market-apply
          test ! -e /var/lib/control-center-system/modules/dhcp.json
          test ! -e /etc/dnsmasq.d/control-center-dhcp.conf

      - name: Validate Professional public key
        run: openssl pkey -pubin -in license/vendor-public.pem -noout

      - name: Reject private signing keys
        run: |
          set -euo pipefail
          if git ls-files | grep -Eai '(^|/)(private|secret|signing)[^/]*(\.pem|\.key)$'; then
            echo 'Private/signing key material must never be committed.' >&2
            exit 1
          fi
          if grep -RIl --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY' .; then
            echo 'Private key material detected in repository.' >&2
            exit 1
          fi

      - name: Required documentation
        run: |
          set -euo pipefail
          for f in \
            README.md docs/README.md docs/EULA-RU.md docs/PRODUCT-EDITIONS.md docs/UPDATE-LIFECYCLE-POLICY-RU.md docs/RELEASE-HISTORY.md \
            docs/INSTALL.md docs/POSTGRESQL.md docs/WEB-PORT.md docs/UPDATE.md docs/OS_UPDATES.md docs/LICENSING.md \
            docs/NETWORK.md docs/DHCP.md docs/NOTIFICATIONS.md docs/UI.md docs/SECURITY.md docs/TROUBLESHOOTING.md \
            releases/1.0.8/README.md releases/1.0.8/manifest.json; do
            test -s "$f"
          done
