name: Validate Control Center release

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile \
            app/main.py app/main_base_107.py app/wsgi.py app/database.py app/db_migrate.py \
            app/release_107.py app/release_108.py app/release_108_build2.py app/release_109.py \
            app/release_110.py app/release_110_fix.py app/release_111.py app/release_111_guard.py \
            app/release_111_safety.py app/release_111_notifications.py app/release_111_services.py \
            app/release_111_dependencies.py app/release_111_dhcp.py app/release_111_services_assets.py \
            app/release_111_auth.py system/control-center-authd
          for f in \
            app/static/app.js app/static/release-108.js app/static/release-110.js app/static/release-110-fix.js \
            app/static/release-111.js app/static/release-111-services.js app/static/release-111-ui-fix.js \
            app/static/release-111-login.js app/static/release-111-compliance.js; do node --check "$f"; done
          for f in \
            install/install.sh install/uninstall.sh \
            system/control-center-web-run system/control-center-web-apply system/control-center-hostname-apply \
            system/control-center-samba-apply system/control-center-samba-approve system/control-center-samba-package-guard \
            system/control-center-domain-pre system/control-center-domain-post system/control-center-domain-orchestrate \
            system/control-center-domain-restore-prestate system/control-center-domain-destroy \
            network/control-center-network-apply market/control-center-market-apply market/control-center-dhcp-apply \
            market/control-center-dns-apply market/control-center-storage-apply market/control-center-dhcp-reservations-apply \
            scripts/acceptance-1.0.11.sh scripts/runtime-acceptance-1.0.11.sh; do bash -n "$f"; done

      - name: Validate release architecture and document contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          for p in r.rglob('*.json'): json.loads(p.read_text())
          assert json.loads((r/'app/release.json').read_text())=={'version':'1.0.11','build':'20260819.5'}
          dep=json.loads((r/'deployment.json').read_text());assert dep['release']=='1.0.11' and dep['build']=='20260819.5' and dep['audit'] in {'pending','passed'}
          man=json.loads((r/'releases/1.0.11/manifest.json').read_text())
          assert man['database']['schema_migration']=='005'
          assert man['authentication']['clean_install_bootstrap_user']=='controladmin'
          assert man['authentication']['clean_install_bootstrap_shell']=='/usr/sbin/nologin'
          assert man['authentication']['bootstrap_password_one_time_output'] is True
          assert man['authentication']['bootstrap_password_plaintext_persisted'] is False
          assert man['services']['domain']['administrator_sid_uid0_acceptance'] is True
          assert man['services']['domain']['portal_admin_group_required']=='Control Center Admins'
          assert man['services']['domain']['exact_package_prestate_restore'] is True
          assert man['services']['dhcp']['reservation_pagination'] is True
          assert man['services']['dhcp']['reservation_pagination_page_size']==10
          assert man['samba_ad_dc']['exact_package_prestate_restore'] is True
          assert man['samba_ad_dc']['administrator_sid_uid0_acceptance'] is True

          w=(r/'app/wsgi.py').read_text()
          for x in ['release_111_services.register','release_111_dependencies.register','release_111_dhcp.register','release_111_auth.register']:assert x in w,x
          svc=(r/'app/release_111_services.py').read_text()
          for x in ["'domain'", "'dns'", "'storage'", '/api/dhcp/clients','/api/domain/remove','/api/services/cleanup/audits']:assert x in svc,x

          auth=(r/'app/release_111_auth.py').read_text();daemon=(r/'system/control-center-authd').read_text()
          for x in ['/api/auth/login','SESSION_COOKIE_HTTPONLY','rbac_mode']:assert x in auth,x
          for x in ['SO_PEERCRED','pamtester','ntlm_auth','wbinfo','control-center-admins']:assert x in daemon,x

          pre=(r/'system/control-center-domain-pre').read_text();destroy=(r/'system/control-center-domain-destroy').read_text()
          assert 'prestate_fingerprints' in pre and 'prestate_fingerprints_match' in destroy and 'nTDSDSA' in destroy
          dns=(r/'market/control-center-dns-apply').read_text();storage=(r/'market/control-center-storage-apply').read_text()
          assert 'unbound' in dns and 'cleanup-audits' in dns
          assert 'samba_standalone' in storage and 'preserved_user_data' in storage
          dhcp=(r/'market/control-center-dhcp-reservations-apply').read_text();assert 'dhcp-host=' in dhcp and 'dhcp_reservations' in dhcp
          mig=(r/'app/migrations/005_rbac_services_dhcp.sql').read_text()
          for x in ['rbac_roles','rbac_bindings','service_dependencies','dhcp_reservations','service_cleanup_audits']:assert x in mig,x

          installer=(r/'install/install.sh').read_text()
          for x in [
              'control-center-authd.service','control-center-domain-destroy.path','control-center-dns-apply.path',
              'control-center-storage-apply.path','control-center-dhcp-reservations-apply.path','migration 005',
              'candidate=controladmin','--shell /usr/sbin/nologin','BOOTSTRAP_PASSWORD=',
              "openssl rand -base64 27",'| chpasswd',"printf '  Пароль: %s\\n'"
          ]: assert x in installer,x
          assert 'passwd -l "$candidate"' not in installer

          compliance=(r/'app/static/release-111-compliance.js').read_text()
          assert 'DHCP_CLIENTS_PAGE_SIZE_COMPLIANCE111 = 10' in compliance
          assert 'dhcpClientsPager111' in compliance
          assets=(r/'app/release_111_services_assets.py').read_text()
          assert "'release-111-compliance.js'" in assets

          post=(r/'system/control-center-domain-post').read_text()
          for x in ["group listmembers 'Control Center Admins'",'group addmembers', 'wbinfo --name-to-sid']:
              assert x in post,x
          orch=(r/'system/control-center-domain-orchestrate').read_text()
          for x in ['wbinfo --sid-to-uid','Administrator SID maps to UID 0','idmap_ldb:use rfc2307 = no']:
              assert x in orch,x

          guard=(r/'system/control-center-samba-package-guard').read_text()
          for x in ['apt-get -s install','s/^Remv','apt-get download','--allow-downgrades','apt-mark manual','apt-mark auto','restore-persistent','domain-package-prestate']:
              assert x in guard,x
          restore=(r/'system/control-center-domain-restore-prestate').read_text()
          assert 'restore-persistent' in restore

          assert '--adminpass=' not in (r/'system/control-center-samba-apply').read_text()
          print('1.0.11 architecture/document/manifest contract OK')
          PY

      - name: Setup PostgreSQL application test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client dnsmasq-base
          python -m pip install -r requirements.txt
          sudo systemctl start postgresql
          id control-center >/dev/null 2>&1 || sudo useradd --system --home /tmp/control-center-ci --shell /usr/sbin/nologin control-center
          sudo -u postgres psql -d postgres -c 'DROP DATABASE IF EXISTS control_center;'
          sudo -u postgres psql -d postgres -c 'DROP ROLE IF EXISTS "control-center";'
          sudo -u postgres psql -d postgres -c 'CREATE ROLE "control-center" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD NULL;'
          sudo -u postgres createdb --owner=control-center control_center
          sudo install -d -o control-center -g control-center -m 0755 /var/lib/control-center /run/control-center
          sudo install -d -o root -g control-center -m 0750 /var/lib/control-center-system /var/lib/control-center-system/modules
          sudo install -d -o root -g root -m 0700 /var/lib/control-center-root /run/control-center-root
          sudo cp -a app /tmp/control-center-ci-app
          sudo chmod -R a+rX /tmp/control-center-ci-app

      - name: Validate migrations through 005
        run: |
          PYTHON="${pythonLocation}/bin/python"
          sudo -u control-center env CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' "$PYTHON" /tmp/control-center-ci-app/db_migrate.py
          sudo -u control-center psql -d control_center -Atqc "select version from control_center.schema_migrations order by version desc limit 1" | grep -qx 005
          for table in ad_dc_profiles ad_dc_lifecycle_jobs ad_dc_health_runs rbac_roles rbac_bindings service_dependencies dhcp_reservations service_cleanup_audits; do
            sudo -u control-center psql -d control_center -Atqc "select to_regclass('control_center.${table}') is not null" | grep -qx t
          done
          sudo -u control-center psql -d control_center -Atqc "select count(*) from control_center.service_dependencies where service_id='domain' and required" | grep -qx 2
          sudo -u control-center psql -d control_center -Atqc "select count(*) from control_center.rbac_roles where role_id in ('admin','viewer')" | grep -qx 2

      - name: Validate API security, Market and dependencies
        env:
          CONTROL_CENTER_TEST_BYPASS_AUTH: '1'
          CONTROL_CENTER_DB_DSN: 'dbname=control_center user=control-center host=/var/run/postgresql'
        run: |
          PYTHON="${pythonLocation}/bin/python"
          sudo -u control-center env CONTROL_CENTER_TEST_BYPASS_AUTH=1 CONTROL_CENTER_DB_DSN="$CONTROL_CENTER_DB_DSN" PYTHONPATH=/tmp/control-center-ci-app "$PYTHON" - <<'PY'
          import main,wsgi
          roles={'lan':{'enabled':True,'interface':'ccad0','method':'static','ip':'10.77.11.1','mask':24,'gateway':'','dns':['1.1.1.1']},'wan':{'enabled':False,'interface':'','method':'disabled'}}
          ifaces=[{'name':'ccad0','dns':['1.1.1.1'],'state':'up','ipv4':['10.77.11.1/24'],'rx_bytes':0,'tx_bytes':0}]
          main._effective_network_config=lambda:(roles,ifaces,'test');main._interfaces=lambda:ifaces
          c=wsgi.app.test_client()
          h=c.get('/api/health');assert h.status_code==200 and h.get_json()['version']=='1.0.11'
          m=c.get('/api/market').get_json();ids={x['id'] for x in m['items']};assert {'domain','dns','storage'}.issubset(ids)
          d=next(x for x in m['items'] if x['id']=='domain');assert set(d['dependencies'])=={'dns','storage'}
          r=c.post('/api/samba/readiness',json={'realm':'ci.example.test','netbios_domain':'CITEST','network_role':'lan','dns_forwarder':'1.1.1.1'});assert r.status_code==200
          j=r.get_json();assert j['details']['dependencies']['domain_requires_dns'] and j['details']['dependencies']['domain_requires_storage']
          assert c.get('/api/dhcp/clients').status_code==200
          assets=c.get('/static/app.js').get_data(as_text=True)
          assert 'dhcpClientsPager111' in assets and 'DHCP_CLIENTS_PAGE_SIZE_COMPLIANCE111 = 10' in assets
          assert 'data-domain-remove-open' in assets
          print('API architecture OK')
          PY

      - name: Validate auth guard without bypass
        env:
          CONTROL_CENTER_DB_DSN: 'dbname=control_center user=control-center host=/var/run/postgresql'
        run: |
          PYTHON="${pythonLocation}/bin/python"
          sudo -u control-center env CONTROL_CENTER_DB_DSN="$CONTROL_CENTER_DB_DSN" PYTHONPATH=/tmp/control-center-ci-app "$PYTHON" - <<'PY'
          import wsgi
          c=wsgi.app.test_client()
          assert c.get('/').status_code in {301,302}
          assert c.get('/api/market').status_code==401
          assert c.get('/api/health').status_code==200
          assert c.get('/login').status_code==200
          print('Auth guard OK')
          PY

      - name: Security and docs policy
        run: |
          set -euo pipefail
          openssl pkey -pubin -in license/vendor-public.pem -noout
          ! git ls-files | grep -Eai '(^|/)(private|secret|signing)[^/]*(\.pem|\.key)$'
          ! grep -RIl --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY' .
          for f in README.md docs/INSTALL.md docs/SAMBA-AD-DC.md docs/NETWORK.md docs/DHCP.md docs/AUTHENTICATION.md docs/NOTIFICATIONS.md docs/SECURITY.md docs/POSTGRESQL.md releases/1.0.11/README.md releases/1.0.11/manifest.json; do test -s "$f"; done
          grep -Fq 'Список пагинируется по 10 строк' docs/DHCP.md
          grep -Fq 'Случайный пароль показывается только в выводе установки' docs/AUTHENTICATION.md
          grep -Fq '/var/lib/control-center-root/domain-package-prestate' docs/SECURITY.md
          grep -Fq 'Domain/DNS/Storage cleanup-audits' docs/NOTIFICATIONS.md
