name: Validate Control Center release

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          python -m py_compile app/main.py app/wsgi.py license/issue-license.py

      - name: Bash syntax
        run: |
          set -euo pipefail
          for f in \
            install/install.sh \
            install/uninstall.sh \
            update/control-center-update \
            update/control-center-os-update \
            network/control-center-network-apply \
            market/control-center-market-apply \
            market/control-center-dhcp-apply \
            license/control-center-license-apply \
            scripts/acceptance-1.0.5.sh; do
            bash -n "$f"
          done

      - name: Validate JSON and release consistency
        run: |
          python - <<'PY'
          import ast,json,pathlib,re
          root=pathlib.Path('.')
          for p in root.rglob('*.json'): json.loads(p.read_text())
          module=ast.parse((root/'app/main.py').read_text()); version=None
          for node in module.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='APP_VERSION': version=ast.literal_eval(node.value)
          assert version and re.fullmatch(r'\d+\.\d+\.\d+',version)
          deployment=json.loads((root/'deployment.json').read_text())
          assert deployment['release']==version
          assert deployment['channel']=='production'
          assert deployment['release_branch']==f'release/{version}'
          manifest=json.loads((root/'releases'/version/'manifest.json').read_text())
          assert manifest['release']==version and manifest['channel']=='production'

          installer=(root/'install/install.sh').read_text()
          assert re.search(rf'^VERSION={re.escape(version)}$',installer,re.M)
          for token in ['/var/lib/control-center-system','/var/lib/control-center-root','/var/lib/control-center-license','ReadOnlyPaths=/var/lib/control-center-system /var/lib/control-center-license','InaccessiblePaths=/var/lib/control-center-root','/gunicorn ','wsgi:app','control-center-dhcp-server.service']:
              assert token in installer, token

          req=(root/'requirements.txt').read_text()
          assert re.search(r'^gunicorn>=26\.0,<27\.0$',req,re.M)
          assert (root/'app/requirements.txt').read_text()==req

          updater=(root/'update/control-center-update').read_text()
          assert "^APP_VERSION[[:space:]]*=" in updater
          assert '/var/lib/control-center-system' in updater and '/var/lib/control-center-root' in updater
          osup=(root/'update/control-center-os-update').read_text()
          assert '/var/lib/control-center-system' in osup and '/run/control-center-apt.lock' in osup

          network=(root/'network/control-center-network-apply').read_text()
          dhcp=(root/'market/control-center-dhcp-apply').read_text()
          market=(root/'market/control-center-market-apply').read_text()
          license_helper=(root/'license/control-center-license-apply').read_text()
          assert '/var/lib/control-center-system' in network and '/var/lib/control-center-root' in network
          assert '/var/lib/control-center-system' in dhcp and '/var/lib/control-center-root' in dhcp
          assert 'net.netmask' in dhcp and '--conf-file="$TARGET"' in dhcp
          assert 'DHCP Server не зарегистрирован как управляемый модуль' in dhcp
          assert '/var/lib/control-center-system' in market and 'package_owned' in market
          assert 'установленный вне Control Center' in market
          assert '/var/lib/control-center-system' in license_helper and 'chmod 0640 "$OUT"' in license_helper

          wsgi=(root/'app/wsgi.py').read_text()
          for token in ['Content-Security-Policy','X-Frame-Options','MAX_CONTENT_LENGTH','mkstemp','os.replace','Origin']:
              assert token in wsgi, token

          template=(root/'app/templates/index.html').read_text()
          assert 'const esc=' in template
          assert 'Ctrl + K' in template

          readme=(root/'README.md').read_text()
          assert f'Control Center {version}' in readme
          print(f'Validated release {version}')
          PY

      - name: Validate Professional public key
        run: openssl pkey -pubin -in license/vendor-public.pem -noout

      - name: Reject private signing keys
        run: |
          set -euo pipefail
          if git ls-files | grep -Eai '(^|/)(private|secret|signing)[^/]*(\.pem|\.key)$'; then
            echo 'Private/signing key material must never be committed.' >&2
            exit 1
          fi
          if grep -RIl --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY' .; then
            echo 'Private key material detected in repository.' >&2
            exit 1
          fi

      - name: Required documentation
        run: |
          set -euo pipefail
          for f in docs/README.md docs/INSTALL.md docs/UPDATE.md docs/OS_UPDATES.md docs/LICENSING.md docs/NETWORK.md docs/DHCP.md docs/SECURITY.md docs/TROUBLESHOOTING.md docs/AUDIT-1.0.5.md; do
            test -s "$f"
          done
