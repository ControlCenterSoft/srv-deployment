name: Validate Control Center release

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile \
            app/main.py app/main_base_107.py app/wsgi.py app/database.py app/db_migrate.py app/db_cli.py \
            app/release_107.py app/release_108.py app/release_108_build2.py app/release_109.py \
            app/release_110.py app/release_110_fix.py license/issue-license.py
          node --check app/static/app.js
          node --check app/static/release-108.js
          node --check app/static/release-110.js
          node --check app/static/release-110-fix.js
          for f in \
            install/install.sh install/install-base-1.0.7.sh install/install-base-1.0.8.sh install/uninstall.sh \
            update/control-center-update update/control-center-os-update \
            system/control-center-web-run system/control-center-web-apply system/control-center-hostname-apply \
            network/control-center-network-apply market/control-center-market-apply market/control-center-dhcp-apply \
            license/control-center-license-apply scripts/acceptance-1.0.10.sh; do
            bash -n "$f"
          done

      - name: Validate 1.0.10 release architecture
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          for p in root.rglob('*.json'):
              json.loads(p.read_text())
          rel=json.loads((root/'app/release.json').read_text())
          assert rel=={'version':'1.0.10','build':'20260819.4'}
          dep=json.loads((root/'deployment.json').read_text())
          assert dep['release']=='1.0.10' and dep['build']=='20260819.4'
          assert dep['channel']=='production' and dep['release_branch']=='release/1.0.10'
          assert dep['audit'] in {'pending','passed'}
          manifest=json.loads((root/'releases/1.0.10/manifest.json').read_text())
          assert manifest['database']['schema_migration']=='003'
          assert manifest['samba_ad_dc']['provisioning_enabled'] is False
          assert manifest['samba_ad_dc']['target_production_release']=='1.0.11'
          main=(root/'app/main.py').read_text()
          assert re.search(r"^APP_VERSION\s*=\s*['\"]1\.0\.10['\"]",main,re.M)
          assert re.search(r"^APP_BUILD\s*=\s*['\"]20260819\.4['\"]",main,re.M)
          wsgi=(root/'app/wsgi.py').read_text()
          for token in ['import release_110','release_110.register(app, main)','import release_110_fix','release_110_fix.register(app, main)']:
              assert token in wsgi,token
          ext=(root/'app/release_110.py').read_text()
          for token in [
              "VERSION = '1.0.10'", "BUILD = '20260819.4'", '/api/settings/hostname',
              '/api/samba/readiness','/api/samba/plan','next_release_target',"'1.0.11'",
              'installation_enabled', 'provisioning_enabled', '_validate_network_110',
              "'enabled': False", 'standard_http_port=80', 'standard_https_port=443',
              'PostgreSQL недоступен'
          ]:
              assert token in ext,token
          fix=(root/'app/release_110_fix.py').read_text()
          assert 'web_settings_110_reconciled' in fix and "database.set_setting('web.port'" in fix
          migration=(root/'app/migrations/003_samba_ad_dc_readiness.sql').read_text()
          for table in ['ad_dc_readiness_runs','ad_dc_change_plans']:
              assert f'control_center.{table}' in migration,table
          js=(root/'app/static/release-110.js').read_text()
          for token in ['__disabled__','wanDashboardCard','lanDashboardCard','saveHostname110','/api/samba/readiness','/api/samba/plan']:
              assert token in js,token
          helper=(root/'system/control-center-web-apply').read_text()
          assert 'DB_SYNC=1' in helper and 'PostgreSQL временно недоступен' in helper
          assert "if ! set_db \"$PORT\" \"$SSL\" \"$STANDARD\" >/tmp/control-center-web-db-sync.log" in helper
          host=(root/'system/control-center-hostname-apply').read_text()
          assert 'hostnamectl set-hostname' in host and 'hostname.rollback' in host and 'hosts.rollback' in host
          net=(root/'network/control-center-network-apply').read_text()
          for token in ['WAN and LAN cannot both be disabled',"'enabled':False",'gateway forbidden while WAN is enabled']:
              assert token in net,token
          installer=(root/'install/install.sh').read_text()
          for token in ['Control Center 1.0.10 build 20260819.4','control-center-hostname-apply.path','control-center-db-migrate.service','Restart=on-failure','CAP_NET_BIND_SERVICE']:
              assert token in installer,token
          assert 'samba-tool domain provision' not in ext
          print('Architecture 1.0.10 OK')
          PY

      - name: Install PostgreSQL and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client dnsmasq-base
          python -m pip install -r requirements.txt
          sudo systemctl start postgresql
          sudo -u postgres pg_isready

      - name: Prepare peer-auth PostgreSQL database
        run: |
          set -euo pipefail
          if ! id control-center >/dev/null 2>&1; then sudo useradd --system --home /tmp/control-center-ci --shell /usr/sbin/nologin control-center; fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE IF EXISTS control_center;'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'DROP ROLE IF EXISTS "control-center";'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE "control-center" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD NULL;'
          sudo -u postgres createdb --owner=control-center control_center
          sudo install -d -o control-center -g control-center -m 0755 /var/lib/control-center
          sudo install -d -o root -g control-center -m 0750 /var/lib/control-center-system /var/lib/control-center-system/modules
          sudo rm -rf /tmp/control-center-ci-app
          sudo cp -a app /tmp/control-center-ci-app
          sudo chown -R root:root /tmp/control-center-ci-app
          sudo chmod -R a+rX /tmp/control-center-ci-app

      - name: Validate PostgreSQL migrations 001 through 003
        run: |
          set -euo pipefail
          PYTHON="${pythonLocation}/bin/python"
          sudo -u control-center env CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' "$PYTHON" /tmp/control-center-ci-app/db_migrate.py
          sudo -u control-center psql -d control_center -Atqc "select version from control_center.schema_migrations order by version desc limit 1" | grep -qx 003
          for table in ad_dc_profiles ad_dc_nodes ad_dc_preflight_runs ad_dc_readiness_runs ad_dc_change_plans; do
            sudo -u control-center psql -d control_center -Atqc "select to_regclass('control_center.${table}') is not null" | grep -qx t
          done
          sudo -u control-center env CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' "$PYTHON" /tmp/control-center-ci-app/db_migrate.py | grep -q 'SKIP 003_samba_ad_dc_readiness.sql'

      - name: Validate Flask APIs and degraded Web settings
        run: |
          set -euo pipefail
          PYTHON="${pythonLocation}/bin/python"
          sudo -u control-center env \
            CONTROL_CENTER_DB_DSN='dbname=control_center user=control-center host=/var/run/postgresql' \
            CONTROL_CENTER_PORT=8080 CONTROL_CENTER_SSL=0 CONTROL_CENTER_STANDARD_PORT=0 \
            PYTHONPATH=/tmp/control-center-ci-app \
            "$PYTHON" - <<'PY'
          import database,main,release_110,wsgi
          c=wsgi.app.test_client()
          h=c.get('/api/health'); assert h.status_code==200; assert h.get_json()['version']=='1.0.10'; assert h.get_json()['build']=='20260819.4'
          s=c.get('/api/system'); assert s.status_code==200; sj=s.get_json(); assert isinstance(sj['wan']['enabled'],bool); assert isinstance(sj['lan']['enabled'],bool)
          w=c.get('/api/settings/web'); assert w.status_code==200; wj=w.get_json(); assert wj['standard_http_port']==80 and wj['standard_https_port']==443 and wj['database_synced'] is True
          database.set_setting('web.port',9999)
          w=c.get('/api/settings/web'); assert w.status_code==200 and w.get_json()['database_synced'] is True
          assert int(database.get_setting('web.port'))==int(w.get_json()['port'])
          old_set=release_110.database.set_setting; old_job=release_110.database.upsert_job
          release_110.database.set_setting=lambda *a,**k: (_ for _ in ()).throw(RuntimeError('db-down'))
          release_110.database.upsert_job=lambda *a,**k: (_ for _ in ()).throw(RuntimeError('db-down'))
          p=c.post('/api/settings/web',json={'standard_port':True,'ssl_enabled':False,'port':9999}); assert p.status_code==202,p.get_data(as_text=True); assert p.get_json()['port']==80
          release_110.database.set_setting=old_set; release_110.database.upsert_job=old_job
          bad=c.post('/api/settings/hostname',json={'hostname':'bad name!'}); assert bad.status_code==400
          good=c.post('/api/settings/hostname',json={'hostname':'cc-ci110'}); assert good.status_code in (200,202)
          r=c.get('/api/samba/readiness'); assert r.status_code==200; rj=r.get_json(); assert rj['details']['provisioning_enabled'] is False and rj['details']['next_release_target']=='1.0.11'
          plan=c.post('/api/samba/plan'); assert plan.status_code==200; pj=plan.get_json(); assert pj['plan']['phase']=='dry-run-only' and pj['plan']['provisioning_enabled'] is False
          m=c.get('/api/market'); samba=next(x for x in m.get_json()['items'] if x['id']=='samba'); assert samba['installable'] is False
          original=main._interfaces
          main._interfaces=lambda:[{'name':'eth0'},{'name':'eth1'}]
          one=release_110._validate_network_110(main,{'wan':{'enabled':True,'interface':'eth0','method':'dhcp'},'lan':{'enabled':False,'method':'disabled'}})
          assert one['wan']['enabled'] and not one['lan']['enabled']
          lan_only=release_110._validate_network_110(main,{'wan':{'enabled':False,'method':'disabled'},'lan':{'enabled':True,'interface':'eth1','method':'static','ip':'192.168.50.1','mask':24,'gateway':'192.168.50.254','dns':['1.1.1.1']}})
          assert lan_only['lan']['gateway']=='192.168.50.254'
          try: release_110._validate_network_110(main,{'wan':{'enabled':False,'method':'disabled'},'lan':{'enabled':False,'method':'disabled'}}); raise AssertionError('both disabled accepted')
          except ValueError: pass
          main._interfaces=original
          assets=c.get('/static/app.js'); assert assets.status_code==200 and b'release-110-fix' not in assets.data
          assert b'dhcpBefore110Fix' in assets.data
          print('Flask/API 1.0.10 smoke OK')
          PY
          sudo rm -f /var/lib/control-center/hostname-pending.json /var/lib/control-center/web-pending.json

      - name: Validate TLS certificate command
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -subj '/CN=control-center-ci' \
            -addext 'subjectAltName=DNS:a-very-long-control-center-ci-host.example.internal,DNS:localhost,IP:127.0.0.1' \
            -keyout "$TMP/server.key" -out "$TMP/server.crt" >/dev/null 2>&1
          openssl x509 -in "$TMP/server.crt" -noout -ext subjectAltName | grep -Fq 'DNS:a-very-long-control-center-ci-host.example.internal'
          openssl pkey -in "$TMP/server.key" -noout
          rm -rf "$TMP"

      - name: Validate DHCP install/remove regression
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/local/lib/control-center
          sudo install -m 0755 market/control-center-market-apply-base-1.0.8 /usr/local/lib/control-center/control-center-market-apply-base-1.0.8
          sudo rm -rf /var/lib/control-center /var/lib/control-center-system
          sudo install -d -o control-center -g control-center -m 0755 /var/lib/control-center
          sudo install -d -o root -g control-center -m 0750 /var/lib/control-center-system /var/lib/control-center-system/modules
          sudo rm -f /etc/dnsmasq.d/control-center-dhcp.conf
          sudo apt-get remove -y dnsmasq >/dev/null 2>&1 || true
          sudo tee /var/lib/control-center/market-pending.json >/dev/null <<'JSON'
          {"module":"dhcp","action":"install","request_id":"ci-dhcp-install","requested_at":1}
          JSON
          sudo bash market/control-center-market-apply
          dpkg-query -W -f='${Status}' dnsmasq | grep -q 'install ok installed'
          sudo dnsmasq --test --conf-file=/etc/dnsmasq.d/control-center-dhcp.conf
          sudo tee /var/lib/control-center/market-pending.json >/dev/null <<'JSON'
          {"module":"dhcp","action":"remove","request_id":"ci-dhcp-remove","requested_at":2}
          JSON
          sudo bash market/control-center-market-apply
          test ! -e /var/lib/control-center-system/modules/dhcp.json

      - name: Validate Professional public key and repository secrets policy
        run: |
          set -euo pipefail
          openssl pkey -pubin -in license/vendor-public.pem -noout
          ! git ls-files | grep -Eai '(^|/)(private|secret|signing)[^/]*(\.pem|\.key)$'
          ! grep -RIl --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY' .

      - name: Required documentation
        run: |
          set -euo pipefail
          for f in README.md docs/INSTALL.md docs/POSTGRESQL.md docs/WEB-PORT.md docs/SAMBA-AD-DC.md docs/NETWORK.md docs/NOTIFICATIONS.md docs/SECURITY.md docs/TROUBLESHOOTING.md releases/1.0.10/README.md releases/1.0.10/manifest.json; do
            test -s "$f"
          done
