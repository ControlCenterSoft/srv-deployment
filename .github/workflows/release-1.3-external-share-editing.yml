name: SRV Control Center 1.3.0 external share editing

on:
  push:
    branches:
      - hotfix/1.3.0-external-share-editing
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-share-editing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate syntax and UI contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile releases/1.3.0/system/srv-control-samba-agent
          node --check releases/1.3.0/payload/static/js/shares.js
          grep -Fq 'external_share: external' releases/1.3.0/payload/static/js/shares.js
          grep -Fq 'share && share.system' releases/1.3.0/payload/static/js/shares.js
          grep -Fq 'update_external_share' releases/1.3.0/system/srv-control-samba-agent
          grep -Fq 'protected/system Samba share cannot be edited' releases/1.3.0/system/srv-control-samba-agent

      - name: Install Samba parser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends samba-common-bin

      - name: Exercise external share update and rollback
        run: |
          set -Eeuo pipefail
          sudo python3 - <<'PY'
          import importlib.machinery
          import pathlib
          import tempfile

          module = importlib.machinery.SourceFileLoader(
              'srvcc_samba_agent_external_test',
              'releases/1.3.0/system/srv-control-samba-agent',
          ).load_module()

          root = pathlib.Path(tempfile.mkdtemp(prefix='srvcc-ext-share.'))
          data = root / 'artemiy-data'
          data.mkdir()
          main = root / 'smb.conf'
          external = root / 'external.conf'
          managed = root / 'srv-control-shares.conf'

          main.write_text(
              '[global]\n'
              '    workgroup = TESTDOM\n'
              '    server role = standalone server\n'
              f'    include = {external}\n'
              '\n'
              '[sysvol]\n'
              f'    path = {root / "sysvol"}\n',
              encoding='utf-8',
          )
          (root / 'sysvol').mkdir()
          external.write_text(
              '[artemiy]\n'
              f'    path = {data}\n'
              '    comment = Artemiy old\n'
              '    browseable = yes\n'
              '    read only = no\n'
              '    guest ok = no\n'
              '    valid users = TESTDOM\\olduser\n'
              '    write list = TESTDOM\\olduser\n',
              encoding='utf-8',
          )
          managed.write_text('# managed\n', encoding='utf-8')

          module.SMB_CONF = main
          module.SHARES_INCLUDE = managed
          module._reload_samba = lambda: None
          module._refresh_share_snapshot = lambda: None

          payload = {
              'external_share': True,
              'share_name': 'artemiy',
              'name': 'artemiy',
              'path': str(data),
              'comment': 'Artemiy edited',
              'browseable': False,
              'subjects': [
                  {'type': 'user', 'name': 'pavel', 'access': 'write'},
                  {'type': 'group', 'name': 'Domain Users', 'access': 'read'},
              ],
          }
          detail = module.update_external_share(payload)
          assert 'external share updated in place: artemiy' in detail, detail
          text = external.read_text(encoding='utf-8')
          assert 'comment = Artemiy edited' in text, text
          assert 'browseable = no' in text, text
          assert 'guest ok = no' in text, text
          assert 'valid users = TESTDOM\\pavel, @"TESTDOM\\Domain Users"' in text, text
          assert 'read list = @"TESTDOM\\Domain Users"' in text, text
          assert 'write list = TESTDOM\\pavel' in text, text
          assert 'read only = yes' in text, text

          try:
              module.update_external_share({**payload, 'share_name': 'sysvol', 'name': 'sysvol', 'path': str(root / 'sysvol')})
          except RuntimeError as exc:
              assert 'protected/system' in str(exc), exc
          else:
              raise AssertionError('protected sysvol edit was accepted')

          try:
              module.update_external_share({**payload, 'name': 'artemiy2'})
          except RuntimeError as exc:
              assert 'renaming an external share is not supported' in str(exc), exc
          else:
              raise AssertionError('external share rename was accepted')

          before = external.read_bytes()
          roles = iter(['standalone server', 'active directory domain controller'])
          module.samba_role = lambda: next(roles)
          rollback_payload = {**payload, 'comment': 'must rollback'}
          try:
              module.update_external_share(rollback_payload)
          except RuntimeError as exc:
              assert 'Samba role changed' in str(exc), exc
          else:
              raise AssertionError('role-changing update did not fail')
          assert external.read_bytes() == before, 'external config was not restored after role mismatch'

          print('EXTERNAL SHARE EDIT PASS', detail)
          PY
