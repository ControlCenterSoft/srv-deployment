name: Apply share external-path hotfix v2

on:
  push:
    branches: [hotfix/1.3.0-share-create-external-path]
    paths:
      - .github/workflows/_apply-share-create-external-path-hotfix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.3.0-share-create-external-path
          fetch-depth: 0
      - name: Patch production share creation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('releases/1.3.0/system/srv-control-samba-admin')
          monitor = Path('releases/1.3.0/system/srv-control-samba-shares-monitor')
          service = Path('releases/1.3.0/system/srv-control-samba-agent.service')
          js = Path('releases/1.3.0/payload/static/js/shares.js')

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement in {path}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_function(path: Path, name: str, next_name: str, body: str) -> None:
              text = path.read_text(encoding='utf-8')
              start_token = f'def {name}('
              end_token = f'\ndef {next_name}('
              start = text.find(start_token)
              end = text.find(end_token, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'cannot locate function {name} -> {next_name} in {path}')
              text = text[:start] + body.rstrip() + '\n\n' + text[end + 1:]
              path.write_text(text, encoding='utf-8')

          # Domain principals: consume testparm stdout only.
          replace_function(admin, 'domain_prefix', 'subject_token', r'''
          def domain_prefix() -> str:
              completed = subprocess.run(
                  ["testparm", "-s", "--suppress-prompt", "--parameter-name", "workgroup"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  timeout=10,
                  check=False,
                  env={**os.environ, "LC_ALL": "C.UTF-8", "LANG": "C.UTF-8"},
              )
              if completed.returncode != 0:
                  return "DOMAIN"
              lines = [line.strip() for line in (completed.stdout or "").splitlines() if line.strip()]
              return lines[-1] if lines else "DOMAIN"
          ''')

          # /srv/shares stays fully data-managed. Existing directories under
          # approved storage roots may be published without changing their data.
          replace_function(admin, 'validate_share_path', 'render_shares', r'''
          def path_is_under(path: Path, root: Path) -> bool:
              normalized = Path(os.path.normpath(str(path)))
              normalized_root = Path(os.path.normpath(str(root)))
              return normalized != normalized_root and normalized_root in normalized.parents


          EXTERNAL_SHARE_ROOTS = tuple(
              Path(value) for value in ("/home", "/srv", "/mnt", "/media", "/data", "/storage")
          )


          def share_data_managed(item: dict[str, Any]) -> bool:
              if "data_managed" in item:
                  return bool(item.get("data_managed"))
              raw = item.get("path")
              if raw is None or not str(raw).strip():
                  return True
              return path_is_under(Path(os.path.normpath(str(raw))), SHARE_ROOT)


          def validate_share_path(
              name: str,
              value: object | None,
              *,
              allow_external: bool = False,
              require_external_existing: bool = False,
          ) -> Path:
              if value is None or not str(value).strip():
                  path = SHARE_ROOT / name
              else:
                  path = Path(clean_text(value, maximum=1024, allow_empty=False))
              if not path.is_absolute():
                  raise RuntimeError("share path must be absolute")
              normalized = Path(os.path.normpath(str(path)))
              if path_is_under(normalized, SHARE_ROOT):
                  return normalized
              if not allow_external:
                  raise RuntimeError(f"managed share path must be under {SHARE_ROOT}")
              root = next((candidate for candidate in EXTERNAL_SHARE_ROOTS if path_is_under(normalized, candidate)), None)
              if root is None:
                  allowed = ", ".join(str(candidate) for candidate in EXTERNAL_SHARE_ROOTS)
                  raise RuntimeError(f"external share path must be below one of: {allowed}")
              if require_external_existing or normalized.exists():
                  if not normalized.exists() or not normalized.is_dir() or normalized.is_symlink():
                      raise RuntimeError("external share path must be an existing normal directory")
                  resolved = normalized.resolve(strict=True)
                  resolved_root = root.resolve(strict=False)
                  if not path_is_under(resolved, resolved_root):
                      raise RuntimeError("external share path resolves outside its approved data root")
              return normalized
          ''')

          # Scope render_shares path validation to each registry item's data ownership.
          text = admin.read_text(encoding='utf-8')
          start = text.index('def render_shares(')
          end = text.index('\ndef ensure_include(', start)
          block = text[start:end]
          old = '        path = validate_share_path(name, item.get("path"))\n'
          if block.count(old) != 1:
              raise SystemExit(f'render_shares path line count={block.count(old)}')
          block = block.replace(old, '        path = validate_share_path(name, item.get("path"), allow_external=not share_data_managed(item))\n')
          admin.write_text(text[:start] + block + text[end:], encoding='utf-8')

          # Quota/ACL are never applied to an existing external directory.
          text = admin.read_text(encoding='utf-8')
          start = text.index('def apply_quota(')
          end = text.index('\ndef apply_posix_acl(', start)
          block = text[start:end]
          marker = '    if limit < 0 or limit > 1024 * 1024:\n        raise RuntimeError("share quota is outside supported range")\n'
          addition = marker + '''    if not share_data_managed(item):\n        if limit:\n            raise RuntimeError("quota is not managed for an external share path")\n        return {\n            "limit_gib": None,\n            "project_id": None,\n            "backend": None,\n            "supported": False,\n            "reason": "external-path",\n        }\n'''
          if block.count(marker) != 1:
              raise SystemExit('apply_quota range marker mismatch')
          block = block.replace(marker, addition, 1)
          admin.write_text(text[:start] + block + text[end:], encoding='utf-8')

          text = admin.read_text(encoding='utf-8')
          start = text.index('def apply_posix_acl(')
          end = text.index('\ndef normalize_share_payload(', start)
          block = text[start:end]
          marker = 'def apply_posix_acl(item: dict[str, Any]) -> None:\n'
          if block.count(marker) != 1:
              raise SystemExit('apply_posix_acl marker mismatch')
          block = block.replace(marker, marker + '    if not share_data_managed(item):\n        return\n', 1)
          admin.write_text(text[:start] + block + text[end:], encoding='utf-8')

          replace_function(admin, 'normalize_share_payload', 'share_operation', r'''
          def normalize_share_payload(payload: dict[str, Any], existing: dict[str, Any] | None = None) -> dict[str, Any]:
              source = dict(existing or {})
              raw_name = payload.get("name") if "name" in payload else payload.get("share_name") or source.get("name")
              name = share_name(raw_name)
              source["name"] = name
              raw_path = payload.get("path") if "path" in payload else source.get("path")
              path = validate_share_path(name, raw_path, allow_external=True, require_external_existing=True)
              data_managed = path_is_under(path, SHARE_ROOT)
              if existing is not None and data_managed != share_data_managed(existing):
                  raise RuntimeError("share data scope cannot be changed between managed and external paths")
              source["path"] = str(path)
              source["data_managed"] = data_managed
              if "comment" in payload:
                  source["comment"] = clean_text(payload.get("comment") or "", maximum=1024)
              else:
                  source.setdefault("comment", "")
              if "browseable" in payload:
                  source["browseable"] = bool(payload.get("browseable"))
              else:
                  source.setdefault("browseable", True)
              if "subjects" in payload:
                  subjects = payload.get("subjects")
                  if not isinstance(subjects, list):
                      raise RuntimeError("share subjects must be a list")
                  for subject in subjects:
                      if not isinstance(subject, dict):
                          raise RuntimeError("invalid share subject")
                      subject_token(subject)
                  source["subjects"] = subjects
              elif "subjects" not in source:
                  source["subjects"] = []
              if "quota" in payload:
                  if not isinstance(payload.get("quota"), dict):
                      raise RuntimeError("share quota must be an object")
                  merged_quota = dict(source.get("quota") or {})
                  merged_quota.update(payload["quota"])
                  source["quota"] = merged_quota
              else:
                  source.setdefault("quota", {})
              if not data_managed:
                  limit = (source.get("quota") or {}).get("limit_gib") if isinstance(source.get("quota"), dict) else None
                  if limit not in {None, "", 0, "0"}:
                      raise RuntimeError("quota is not managed for an external share path")
              return source
          ''')

          replace_function(admin, 'share_operation', 'sha256_file', r'''
          def share_operation(action: str, payload: dict[str, Any]) -> str:
              registry = load_registry()
              if action == "samba-share-create":
                  item = normalize_share_payload(payload)
                  if registry_entry(registry, str(item["name"])) is not None:
                      raise RuntimeError("managed share already exists")
                  path = Path(str(item["path"]))
                  created_dir = ensure_share_directory(path) if share_data_managed(item) else False
                  registry["shares"].append(item)
                  try:
                      quota = apply_quota(item, registry)
                      item["quota"] = quota
                      apply_posix_acl(item)
                      apply_share_config(registry)
                      save_registry(registry)
                  except Exception:
                      if created_dir:
                          try:
                              if path.is_dir() and not any(path.iterdir()):
                                  if filesystem_info(path).get("fstype") == "btrfs" and shutil.which("btrfs"):
                                      subprocess.run(["btrfs", "subvolume", "delete", str(path)], check=False)
                                  else:
                                      path.rmdir()
                          except Exception:
                              pass
                      raise
                  scope = "managed-data" if share_data_managed(item) else "external-existing"
                  return f"share created: {item['name']}; scope={scope}"

              old_name = share_name(payload.get("share_name"))
              existing = registry_entry(registry, old_name)
              if existing is None:
                  raise RuntimeError("managed share not found")
              if action == "samba-share-update":
                  item = normalize_share_payload(payload, existing)
                  if str(item["name"]).casefold() != old_name.casefold() and registry_entry(registry, str(item["name"])):
                      raise RuntimeError("target share name already exists")
                  path = Path(str(item["path"]))
                  if share_data_managed(item):
                      ensure_share_directory(path)
                  else:
                      validate_share_path(str(item["name"]), item.get("path"), allow_external=True, require_external_existing=True)
                  index = registry["shares"].index(existing)
                  registry["shares"][index] = item
                  quota = apply_quota(item, registry)
                  item["quota"] = quota
                  apply_posix_acl(item)
                  apply_share_config(registry)
                  save_registry(registry)
                  return f"share updated: {item['name']}"
              if action == "samba-share-delete":
                  data_managed = share_data_managed(existing)
                  path = validate_share_path(old_name, existing.get("path"), allow_external=not data_managed)
                  if bool(payload.get("delete_data")) and not data_managed:
                      raise RuntimeError("refusing to delete data for an external share path")
                  registry["shares"] = [item for item in registry["shares"] if item is not existing]
                  apply_share_config(registry)
                  save_registry(registry)
                  if bool(payload.get("delete_data")) and path.exists():
                      if path.is_symlink() or SHARE_ROOT not in path.parents:
                          raise RuntimeError("refusing to delete unsafe share data path")
                      if filesystem_info(path).get("fstype") == "btrfs" and shutil.which("btrfs"):
                          probe = subprocess.run(
                              ["btrfs", "subvolume", "show", str(path)],
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                              check=False,
                          )
                          if probe.returncode == 0:
                              run(["btrfs", "subvolume", "delete", str(path)], timeout=1800)
                          else:
                              shutil.rmtree(path)
                      else:
                          shutil.rmtree(path)
                  return f"share removed: {old_name}; data_deleted={bool(payload.get('delete_data'))}"
              raise RuntimeError("unsupported share operation")
          ''')

          replace_function(admin, 'share_roots', 'create_domain_backup', r'''
          def share_roots(registry: dict[str, Any]) -> list[str]:
              roots: list[str] = []
              for item in registry.get("shares", []):
                  if not isinstance(item, dict) or not share_data_managed(item):
                      continue
                  name = share_name(item.get("name"))
                  path = validate_share_path(name, item.get("path"))
                  roots.append(str(path).lstrip("/"))
              return sorted(set(roots))
          ''')

          replace_once(
              monitor,
              '                "managed": managed is not None,\n                "subjects": managed.get("subjects", []) if managed else [],\n',
              '                "managed": managed is not None,\n                "data_managed": bool(managed.get("data_managed", True)) if managed else False,\n                "subjects": managed.get("subjects", []) if managed else [],\n',
              'monitor data_managed',
          )
          replace_once(service, 'ProtectHome=true\n', 'ProtectHome=read-only\n', 'agent ProtectHome')

          replacements = [
              (
                  '            flags.push(share.managed ? "управляемая" : share.system ? "системная" : "внешняя");\n',
                  '            flags.push(share.managed ? (share.data_managed === false ? "внешний каталог" : "управляемая") : share.system ? "системная" : "внешняя");\n',
                  'list flag',
              ),
              (
                  '        const external = Boolean(!creating && share && !share.managed);\n        const value = share || {name: "", comment: "", path: "", browseable: true, subjects: [{type: "everyone", name: "Everyone", access: "read"}], quota: {}};\n',
                  '        const external = Boolean(!creating && share && !share.managed);\n        const externalData = Boolean(!creating && share && share.managed && share.data_managed === false);\n        const value = share || {name: "", comment: "", path: "", browseable: true, subjects: [{type: "everyone", name: "Everyone", access: "read"}], quota: {}};\n',
                  'externalData variable',
              ),
              (
                  '''        const externalNote = external\n            ? '<div class="badge-row"><span class="badge warn">Внешняя шара: параметры будут изменены в существующем smb.conf/include. Каталог и данные не перемещаются. Квота и файловые ACL автоматически не меняются.</span></div>'\n            : "";\n''',
                  '''        const externalNote = external\n            ? '<div class="badge-row"><span class="badge warn">Внешняя шара: параметры будут изменены в существующем smb.conf/include. Каталог и данные не перемещаются. Квота и файловые ACL автоматически не меняются.</span></div>'\n            : externalData\n                ? '<div class="badge-row"><span class="badge warn">Внешний каталог: Control Center управляет SMB-публикацией, но не меняет квоту, POSIX ACL и не удаляет данные этого каталога.</span></div>'\n                : "";\n''',
                  'external note',
              ),
              (
                  '                    <label><span>Путь</span><input id="sPath" maxlength="1024" placeholder="/srv/shares/ShareName" value="${esc(value.path || "")}"></label>\n',
                  '                    <label><span>Путь</span><input id="sPath" maxlength="1024" placeholder="Пусто = /srv/shares/ShareName; внешний каталог должен существовать" value="${esc(value.path || "")}"></label>\n',
                  'path placeholder',
              ),
              (
                  '                ${external ? "" : `<div class="badge-row"><span class="badge ${value.filesystem && value.filesystem.quota_supported ? "ok" : "warn"}">${esc(quotaLabel(value.filesystem))}</span></div>`}\n',
                  '                ${external || externalData ? "" : `<div class="badge-row"><span class="badge ${value.filesystem && value.filesystem.quota_supported ? "ok" : "warn"}">${esc(quotaLabel(value.filesystem))}</span></div>`}\n',
                  'quota badge',
              ),
              (
                  '                ${!creating && !external && fullAdmin ? \'<div class="checkbox-row"><label><input id="deleteShareData" type="checkbox"> При удалении также удалить каталог и все данные</label></div>\' : ""}\n',
                  '                ${!creating && !external && !externalData && fullAdmin ? \'<div class="checkbox-row"><label><input id="deleteShareData" type="checkbox"> При удалении также удалить каталог и все данные</label></div>\' : ""}\n',
                  'delete data checkbox',
              ),
              (
                  '        if (external) {\n            byId("sName").disabled = true;\n            byId("sQuota").disabled = true;\n        }\n',
                  '        if (external) byId("sName").disabled = true;\n        if (external || externalData) byId("sQuota").disabled = true;\n',
                  'disable quota',
              ),
              (
                  '            const quotaRaw = external ? "" : byId("sQuota").value.trim();\n',
                  '            const quotaRaw = external || externalData ? "" : byId("sQuota").value.trim();\n',
                  'quota payload',
              ),
          ]
          for old, new, label in replacements:
              replace_once(js, old, new, label)

          print('production patch applied')
          PY

          python3 -m py_compile releases/1.3.0/system/srv-control-samba-admin releases/1.3.0/system/srv-control-samba-shares-monitor
          node --check releases/1.3.0/payload/static/js/shares.js
          grep -Fq 'ProtectHome=read-only' releases/1.3.0/system/srv-control-samba-agent.service
          grep -Fq 'external share path must be an existing normal directory' releases/1.3.0/system/srv-control-samba-admin
          grep -Fq 'data_managed' releases/1.3.0/system/srv-control-samba-shares-monitor
          git diff --check

          git config user.name "srvcc-hotfix-bot"
          git config user.email "40738562+filosoff31@users.noreply.github.com"
          git add releases/1.3.0/system/srv-control-samba-admin \
                  releases/1.3.0/system/srv-control-samba-shares-monitor \
                  releases/1.3.0/system/srv-control-samba-agent.service \
                  releases/1.3.0/payload/static/js/shares.js
          git commit -m "Allow safe publication of external share paths"
          git push origin HEAD:hotfix/1.3.0-share-create-external-path
