name: Apply share external-path hotfix

on:
  push:
    branches: [hotfix/1.3.0-share-create-external-path]
    paths:
      - .github/workflows/_apply-share-create-external-path-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.3.0-share-create-external-path
          fetch-depth: 0
      - name: Patch production share creation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          admin = Path('releases/1.3.0/system/srv-control-samba-admin')
          monitor = Path('releases/1.3.0/system/srv-control-samba-shares-monitor')
          js = Path('releases/1.3.0/payload/static/js/shares.js')

          # 1. Read the NetBIOS domain from testparm stdout only.  The old helper
          # merged stderr and stdout, which can corrupt domain principals.
          replace_once(
              admin,
              '''def domain_prefix() -> str:\n    value = run(["testparm", "-s", "--parameter-name", "workgroup"], timeout=10, check=False).strip()\n    return value or "DOMAIN"\n''',
              '''def testparm_scalar(parameter: str) -> str:\n    completed = subprocess.run(\n        ["testparm", "-s", "--suppress-prompt", "--parameter-name", parameter],\n        text=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.DEVNULL,\n        timeout=10,\n        check=False,\n        env={**os.environ, "LC_ALL": "C.UTF-8", "LANG": "C.UTF-8"},\n    )\n    if completed.returncode != 0:\n        return ""\n    lines = [line.strip() for line in (completed.stdout or "").splitlines() if line.strip()]\n    return lines[-1] if lines else ""\n\n\ndef domain_prefix() -> str:\n    return testparm_scalar("workgroup") or "DOMAIN"\n'''
          )

          # 2. Classify share paths. /srv/shares remains fully data-managed.
          # Existing directories under approved data roots may be published,
          # but Control Center never chmods, quotas or deletes their data.
          old_validate = '''def validate_share_path(name: str, value: object | None) -> Path:\n    if value is None or not str(value).strip():\n        path = SHARE_ROOT / name\n    else:\n        path = Path(clean_text(value, maximum=1024, allow_empty=False))\n    if not path.is_absolute():\n        raise RuntimeError("share path must be absolute")\n    normalized = Path(os.path.normpath(str(path)))\n    root = Path(os.path.normpath(str(SHARE_ROOT)))\n    if normalized == root or root not in normalized.parents:\n        raise RuntimeError(f"managed share path must be under {SHARE_ROOT}")\n    return normalized\n'''
          new_validate = '''EXTERNAL_SHARE_ROOTS = tuple(Path(value) for value in ("/home", "/srv", "/mnt", "/media", "/data", "/storage"))\n\n\ndef path_is_under(path: Path, root: Path) -> bool:\n    normalized = Path(os.path.normpath(str(path)))\n    normalized_root = Path(os.path.normpath(str(root)))\n    return normalized != normalized_root and normalized_root in normalized.parents\n\n\ndef share_data_managed(item: dict[str, Any]) -> bool:\n    if "data_managed" in item:\n        return bool(item.get("data_managed"))\n    raw = item.get("path")\n    if raw is None or not str(raw).strip():\n        return True\n    path = Path(os.path.normpath(str(raw)))\n    return path_is_under(path, SHARE_ROOT)\n\n\ndef validate_share_path(\n    name: str,\n    value: object | None,\n    *,\n    allow_external: bool = False,\n    require_external_existing: bool = False,\n) -> Path:\n    if value is None or not str(value).strip():\n        path = SHARE_ROOT / name\n    else:\n        path = Path(clean_text(value, maximum=1024, allow_empty=False))\n    if not path.is_absolute():\n        raise RuntimeError("share path must be absolute")\n    normalized = Path(os.path.normpath(str(path)))\n    if path_is_under(normalized, SHARE_ROOT):\n        return normalized\n    if not allow_external:\n        raise RuntimeError(f"managed share path must be under {SHARE_ROOT}")\n    lexical_root = next((root for root in EXTERNAL_SHARE_ROOTS if path_is_under(normalized, root)), None)\n    if lexical_root is None:\n        allowed = ", ".join(str(root) for root in EXTERNAL_SHARE_ROOTS)\n        raise RuntimeError(f"external share path must be below one of: {allowed}")\n    if require_external_existing or normalized.exists():\n        if not normalized.exists() or not normalized.is_dir() or normalized.is_symlink():\n            raise RuntimeError("external share path must be an existing normal directory")\n        resolved = normalized.resolve(strict=True)\n        resolved_root = lexical_root.resolve(strict=False)\n        if not path_is_under(resolved, resolved_root):\n            raise RuntimeError("external share path resolves outside its approved data root")\n    return normalized\n'''
          replace_once(admin, old_validate, new_validate)

          replace_once(
              admin,
              '        path = validate_share_path(name, item.get("path"))\n',
              '        path = validate_share_path(name, item.get("path"), allow_external=not share_data_managed(item))\n'
          )

          old_quota = '''def apply_quota(item: dict[str, Any], registry: dict[str, Any]) -> dict[str, Any]:\n    raw = item.get("quota") if isinstance(item.get("quota"), dict) else {}\n    limit_raw = raw.get("limit_gib")\n    limit = 0 if limit_raw in {None, "", 0, "0"} else int(limit_raw)\n    if limit < 0 or limit > 1024 * 1024:\n        raise RuntimeError("share quota is outside supported range")\n    path = validate_share_path(str(item["name"]), item.get("path"))\n'''
          new_quota = '''def apply_quota(item: dict[str, Any], registry: dict[str, Any]) -> dict[str, Any]:\n    raw = item.get("quota") if isinstance(item.get("quota"), dict) else {}\n    limit_raw = raw.get("limit_gib")\n    limit = 0 if limit_raw in {None, "", 0, "0"} else int(limit_raw)\n    if limit < 0 or limit > 1024 * 1024:\n        raise RuntimeError("share quota is outside supported range")\n    if not share_data_managed(item):\n        if limit:\n            raise RuntimeError("quota is not managed for an external share path")\n        return {\n            "limit_gib": None,\n            "project_id": None,\n            "backend": None,\n            "supported": False,\n            "reason": "external-path",\n        }\n    path = validate_share_path(str(item["name"]), item.get("path"))\n'''
          replace_once(admin, old_quota, new_quota)

          old_acl = '''def apply_posix_acl(item: dict[str, Any]) -> None:\n    if not shutil.which("setfacl"):\n        return\n    path = validate_share_path(str(item["name"]), item.get("path"))\n'''
          new_acl = '''def apply_posix_acl(item: dict[str, Any]) -> None:\n    if not share_data_managed(item):\n        return\n    if not shutil.which("setfacl"):\n        return\n    path = validate_share_path(str(item["name"]), item.get("path"))\n'''
          replace_once(admin, old_acl, new_acl)

          old_normalize = '''def normalize_share_payload(payload: dict[str, Any], existing: dict[str, Any] | None = None) -> dict[str, Any]:\n    source = dict(existing or {})\n    raw_name = payload.get("name") if "name" in payload else payload.get("share_name") or source.get("name")\n    name = share_name(raw_name)\n    source["name"] = name\n    source["path"] = str(validate_share_path(name, payload.get("path") if "path" in payload else source.get("path")))\n    if "comment" in payload:\n        source["comment"] = clean_text(payload.get("comment") or "", maximum=1024)\n    else:\n        source.setdefault("comment", "")\n    if "browseable" in payload:\n        source["browseable"] = bool(payload.get("browseable"))\n    else:\n        source.setdefault("browseable", True)\n    if "subjects" in payload:\n        subjects = payload.get("subjects")\n        if not isinstance(subjects, list):\n            raise RuntimeError("share subjects must be a list")\n        for subject in subjects:\n            if not isinstance(subject, dict):\n                raise RuntimeError("invalid share subject")\n            subject_token(subject)\n        source["subjects"] = subjects\n    elif "subjects" not in source:\n        source["subjects"] = []\n    if "quota" in payload:\n        if not isinstance(payload.get("quota"), dict):\n            raise RuntimeError("share quota must be an object")\n        merged_quota = dict(source.get("quota") or {})\n        merged_quota.update(payload["quota"])\n        source["quota"] = merged_quota\n    else:\n        source.setdefault("quota", {})\n    return source\n'''
          new_normalize = '''def normalize_share_payload(payload: dict[str, Any], existing: dict[str, Any] | None = None) -> dict[str, Any]:\n    source = dict(existing or {})\n    raw_name = payload.get("name") if "name" in payload else payload.get("share_name") or source.get("name")\n    name = share_name(raw_name)\n    source["name"] = name\n    raw_path = payload.get("path") if "path" in payload else source.get("path")\n    path = validate_share_path(name, raw_path, allow_external=True, require_external_existing=True)\n    data_managed = path_is_under(path, SHARE_ROOT)\n    if existing is not None and data_managed != share_data_managed(existing):\n        raise RuntimeError("share data scope cannot be changed between managed and external paths")\n    source["path"] = str(path)\n    source["data_managed"] = data_managed\n    if "comment" in payload:\n        source["comment"] = clean_text(payload.get("comment") or "", maximum=1024)\n    else:\n        source.setdefault("comment", "")\n    if "browseable" in payload:\n        source["browseable"] = bool(payload.get("browseable"))\n    else:\n        source.setdefault("browseable", True)\n    if "subjects" in payload:\n        subjects = payload.get("subjects")\n        if not isinstance(subjects, list):\n            raise RuntimeError("share subjects must be a list")\n        for subject in subjects:\n            if not isinstance(subject, dict):\n                raise RuntimeError("invalid share subject")\n            subject_token(subject)\n        source["subjects"] = subjects\n    elif "subjects" not in source:\n        source["subjects"] = []\n    if "quota" in payload:\n        if not isinstance(payload.get("quota"), dict):\n            raise RuntimeError("share quota must be an object")\n        merged_quota = dict(source.get("quota") or {})\n        merged_quota.update(payload["quota"])\n        source["quota"] = merged_quota\n    else:\n        source.setdefault("quota", {})\n    if not data_managed:\n        limit = (source.get("quota") or {}).get("limit_gib") if isinstance(source.get("quota"), dict) else None\n        if limit not in {None, "", 0, "0"}:\n            raise RuntimeError("quota is not managed for an external share path")\n    return source\n'''
          replace_once(admin, old_normalize, new_normalize)

          replace_once(
              admin,
              '        created_dir = ensure_share_directory(path)\n',
              '        created_dir = ensure_share_directory(path) if share_data_managed(item) else False\n'
          )
          replace_once(
              admin,
              '        ensure_share_directory(path)\n        index = registry["shares"].index(existing)\n',
              '        if share_data_managed(item):\n            ensure_share_directory(path)\n        else:\n            validate_share_path(str(item["name"]), item.get("path"), allow_external=True, require_external_existing=True)\n        index = registry["shares"].index(existing)\n'
          )
          replace_once(
              admin,
              '''    if action == "samba-share-delete":\n        path = validate_share_path(old_name, existing.get("path"))\n        registry["shares"] = [item for item in registry["shares"] if item is not existing]\n''',
              '''    if action == "samba-share-delete":\n        data_managed = share_data_managed(existing)\n        path = validate_share_path(old_name, existing.get("path"), allow_external=not data_managed)\n        if bool(payload.get("delete_data")) and not data_managed:\n            raise RuntimeError("refusing to delete data for an external share path")\n        registry["shares"] = [item for item in registry["shares"] if item is not existing]\n'''
          )

          old_roots = '''def share_roots(registry: dict[str, Any]) -> list[str]:\n    roots: list[str] = []\n    for item in registry.get("shares", []):\n        if not isinstance(item, dict):\n            continue\n        name = share_name(item.get("name"))\n        path = validate_share_path(name, item.get("path"))\n        roots.append(str(path).lstrip("/"))\n    return sorted(set(roots))\n'''
          new_roots = '''def share_roots(registry: dict[str, Any]) -> list[str]:\n    roots: list[str] = []\n    for item in registry.get("shares", []):\n        if not isinstance(item, dict) or not share_data_managed(item):\n            continue\n        name = share_name(item.get("name"))\n        path = validate_share_path(name, item.get("path"))\n        roots.append(str(path).lstrip("/"))\n    return sorted(set(roots))\n'''
          replace_once(admin, old_roots, new_roots)

          # 3. Expose data ownership semantics to the web UI.
          replace_once(
              monitor,
              '                "managed": managed is not None,\n                "subjects": managed.get("subjects", []) if managed else [],\n',
              '                "managed": managed is not None,\n                "data_managed": bool(managed.get("data_managed", True)) if managed else False,\n                "subjects": managed.get("subjects", []) if managed else [],\n'
          )

          # 4. Make the UI distinguish a managed Samba publication from
          # ownership of the underlying external directory.
          replace_once(
              js,
              '            flags.push(share.managed ? "управляемая" : share.system ? "системная" : "внешняя");\n',
              '            flags.push(share.managed ? (share.data_managed === false ? "внешний каталог" : "управляемая") : share.system ? "системная" : "внешняя");\n'
          )
          replace_once(
              js,
              '        const external = Boolean(!creating && share && !share.managed);\n        const value = share || {name: "", comment: "", path: "", browseable: true, subjects: [{type: "everyone", name: "Everyone", access: "read"}], quota: {}};\n',
              '        const external = Boolean(!creating && share && !share.managed);\n        const externalData = Boolean(!creating && share && share.managed && share.data_managed === false);\n        const value = share || {name: "", comment: "", path: "", browseable: true, subjects: [{type: "everyone", name: "Everyone", access: "read"}], quota: {}};\n'
          )
          replace_once(
              js,
              '''        const externalNote = external\n            ? '<div class="badge-row"><span class="badge warn">Внешняя шара: параметры будут изменены в существующем smb.conf/include. Каталог и данные не перемещаются. Квота и файловые ACL автоматически не меняются.</span></div>'\n            : "";\n''',
              '''        const externalNote = external\n            ? '<div class="badge-row"><span class="badge warn">Внешняя шара: параметры будут изменены в существующем smb.conf/include. Каталог и данные не перемещаются. Квота и файловые ACL автоматически не меняются.</span></div>'\n            : externalData\n                ? '<div class="badge-row"><span class="badge warn">Внешний каталог: Control Center управляет SMB-публикацией, но не меняет квоту, POSIX ACL и не удаляет данные этого каталога.</span></div>'\n                : "";\n'''
          )
          replace_once(
              js,
              '                    <label><span>Путь</span><input id="sPath" maxlength="1024" placeholder="/srv/shares/ShareName" value="${esc(value.path || "")}"></label>\n',
              '                    <label><span>Путь</span><input id="sPath" maxlength="1024" placeholder="Пусто = /srv/shares/ShareName; внешний каталог должен существовать" value="${esc(value.path || "")}"></label>\n'
          )
          replace_once(
              js,
              '                ${external ? "" : `<div class="badge-row"><span class="badge ${value.filesystem && value.filesystem.quota_supported ? "ok" : "warn"}">${esc(quotaLabel(value.filesystem))}</span></div>`}\n',
              '                ${external || externalData ? "" : `<div class="badge-row"><span class="badge ${value.filesystem && value.filesystem.quota_supported ? "ok" : "warn"}">${esc(quotaLabel(value.filesystem))}</span></div>`}\n'
          )
          replace_once(
              js,
              '                ${!creating && !external && fullAdmin ? \'<div class="checkbox-row"><label><input id="deleteShareData" type="checkbox"> При удалении также удалить каталог и все данные</label></div>\' : ""}\n',
              '                ${!creating && !external && !externalData && fullAdmin ? \'<div class="checkbox-row"><label><input id="deleteShareData" type="checkbox"> При удалении также удалить каталог и все данные</label></div>\' : ""}\n'
          )
          replace_once(
              js,
              '        if (external) {\n            byId("sName").disabled = true;\n            byId("sQuota").disabled = true;\n        }\n',
              '        if (external) byId("sName").disabled = true;\n        if (external || externalData) byId("sQuota").disabled = true;\n'
          )
          replace_once(
              js,
              '            const quotaRaw = external ? "" : byId("sQuota").value.trim();\n',
              '            const quotaRaw = external || externalData ? "" : byId("sQuota").value.trim();\n'
          )

          print('production patch applied')
          PY

          python3 -m py_compile releases/1.3.0/system/srv-control-samba-admin releases/1.3.0/system/srv-control-samba-shares-monitor
          node --check releases/1.3.0/payload/static/js/shares.js

          git diff --check
          git diff -- releases/1.3.0/system/srv-control-samba-admin releases/1.3.0/system/srv-control-samba-shares-monitor releases/1.3.0/payload/static/js/shares.js

          git config user.name "srvcc-hotfix-bot"
          git config user.email "40738562+filosoff31@users.noreply.github.com"
          git add releases/1.3.0/system/srv-control-samba-admin releases/1.3.0/system/srv-control-samba-shares-monitor releases/1.3.0/payload/static/js/shares.js
          git commit -m "Allow safe publication of external share paths"
          git push origin HEAD:hotfix/1.3.0-share-create-external-path
