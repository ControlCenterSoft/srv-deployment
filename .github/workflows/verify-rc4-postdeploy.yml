name: Verify RC4 post-deploy state

on:
  pull_request:
    branches: [1.1.x]
    paths:
      - '.github/workflows/verify-rc4-postdeploy.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Read-only RC4 post-deploy verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.CONTROL_CENTER_STAGING_HOST }}
      STAGING_USER: ${{ secrets.CONTROL_CENTER_STAGING_USER }}
      STAGING_PORT: ${{ secrets.CONTROL_CENTER_STAGING_PORT }}
      STAGING_SSH_KEY: ${{ secrets.CONTROL_CENTER_STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.CONTROL_CENTER_STAGING_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER"
          test -n "$STAGING_SSH_KEY" && test -n "$STAGING_KNOWN_HOSTS"
          STAGING_PORT="${STAGING_PORT:-22}"
          install -d -m 0700 "$RUNNER_TEMP/ccverify-ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$RUNNER_TEMP/ccverify-ssh/id"
          chmod 0600 "$RUNNER_TEMP/ccverify-ssh/id"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/ccverify-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ccverify-ssh/known_hosts"
          printf 'SSH_PORT=%s\n' "$STAGING_PORT" >> "$GITHUB_ENV"
          printf 'SSH_KEY=%s\n' "$RUNNER_TEMP/ccverify-ssh/id" >> "$GITHUB_ENV"
          printf 'SSH_KNOWN_HOSTS=%s\n' "$RUNNER_TEMP/ccverify-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Verify exact runtime and operational state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$SSH_KEY" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" -o ConnectTimeout=10 "$STAGING_USER@$STAGING_HOST" '
            set -eu
            systemctl is-active --quiet control-center.service
            systemctl is-active --quiet control-center-privileged-worker.service
            systemctl is-enabled --quiet control-center-privileged-worker.service
            test -S /run/control-center/privileged-worker.sock
            test "$(stat -Lc "%U:%G:%a" /run/control-center/privileged-worker.sock)" = "root:control-center:660"
            test -L /usr/local/lib/control-center/current
            test -L /usr/local/lib/control-center/previous
            test -z "$(systemctl --failed --no-legend --plain)"
            curl -fsS http://127.0.0.1:8876/api/v1/health >/dev/null
            curl -fsS http://127.0.0.1:8876/api/v1/readiness | grep -Fq '"'"'"ready":true'"'"'
            curl -fsS http://127.0.0.1:8876/api/v1/version | grep -Fq '"'"'"version":"1.1.0-rc.4"'"'"'
            curl -fsS http://127.0.0.1:8876/api/v1/version | grep -Fq '"'"'"commit":"81413014bc597b7c5e0d89caeb88b6a3dae27a3d"'"'"'
          '
