name: post-release-main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  ACCEPTED_VERSION: 1.0.0
  ACCEPTED_COMMIT: 1b364ae88789696bf98537d21544de8a259d086d
  ACCEPTED_BUILT_AT: 2026-08-20T16:07:56Z
  ACCEPTED_AMD64_SHA256: 341f6a49646f92aca72692730ea61278cc03bfc1689d029d7a7ce573554fa735
  ACCEPTED_ARM64_SHA256: 5e6e959f39bd4cb554e902908863c92eb5c697f4d99b55ca97fa4735ec9419fe

jobs:
  integration-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Toolchain identity
        run: test "$(go env GOVERSION)" = go1.23.2
      - name: Accepted source is an ancestor
        run: git merge-base --is-ancestor "$ACCEPTED_COMMIT" HEAD
      - name: Fail closed on runtime drift after acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_COMMIT"..HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/ci.yml|deployment.json|evidence/1.0.0-production-closure.md)
                ;;
              *)
                echo "ERROR: post-release main changes accepted runtime/tooling path: $path" >&2
                exit 1
                ;;
            esac
          done
      - name: Current source regression
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          bash -n install/install.sh install/uninstall.sh install/update.sh scripts/*.sh
          ./scripts/secret-scan.sh
      - name: Rebuild exact accepted 1.0.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/control-center-accepted "$ACCEPTED_COMMIT"
          cd /tmp/control-center-accepted
          ./scripts/build-release.sh
          set -a
          source dist/BUILDINFO.env
          set +a
          test "$VERSION" = "$ACCEPTED_VERSION"
          test "$COMMIT" = "$ACCEPTED_COMMIT"
          test "$BUILT_AT" = "$ACCEPTED_BUILT_AT"
          test "$GO_VERSION" = 1.23.2
          test "$AMD64_SHA256" = "$ACCEPTED_AMD64_SHA256"
          test "$ARM64_SHA256" = "$ACCEPTED_ARM64_SHA256"
          cp dist/SHA256SUMS /tmp/accepted-first-sums
          ./scripts/build-release.sh
          cmp /tmp/accepted-first-sums dist/SHA256SUMS
      - name: Canonical production manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('deployment.json').read_text())
          r=p['release']
          assert p['schema'] == 1
          assert p['product'] == 'control-center'
          assert r['version'] == '1.0.0'
          assert r['channel'] == 'stable'
          assert r['status'] == 'production-ready'
          assert r['acceptance'] == 'passed'
          assert r['source_commit'] == '1b364ae88789696bf98537d21544de8a259d086d'
          assert r['built_at'] == '2026-08-20T16:07:56Z'
          assert r['artifacts']['linux_amd64_sha256'] == '341f6a49646f92aca72692730ea61278cc03bfc1689d029d7a7ce573554fa735'
          assert r['artifacts']['linux_arm64_sha256'] == '5e6e959f39bd4cb554e902908863c92eb5c697f4d99b55ca97fa4735ec9419fe'
          print('PRODUCTION_MANIFEST=PASSED')
          PY
