name: Control Center 1.3.6 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment.json'
      - 'releases/1.3.6/**'
      - '.github/workflows/release-1.3.6-validation.yml'
      - '.github/workflows/release-1.3.5-validation.yml'
      - 'tools/validate-upgrade-contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-1-3-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          set -euxo pipefail
          bash -n releases/1.3.6/preflight-1.3.6.sh
          bash -n releases/1.3.6/apply-1.3.6.sh
          bash -n releases/1.3.6/acceptance-1.3.6.sh
          bash -n releases/1.3.6/rollback-1.3.6.sh

      - name: Manifest deployment and hashes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/1.3.6')
          manifest=json.loads((root/'manifest.json').read_text())
          dep=json.loads(pathlib.Path('deployment.json').read_text())
          assert manifest['release_id']==manifest['release_version']=='1.3.6',manifest
          assert dep['release_id']=='1.3.6' and dep['release_path']=='releases/1.3.6',dep
          for stage,entry in manifest['scripts'].items():
              p=root/entry['path']
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == entry['sha256'],(stage,actual,entry['sha256'])
              assert pathlib.Path(dep[stage]) == p,(stage,dep[stage],p)
          print('1.3.6 MANIFEST PASS')
          PY

      - name: Upgrade compatibility
        run: |
          set -euxo pipefail
          python3 tools/validate-upgrade-contract.py \
            releases/1.3.6/manifest.json \
            --require-patch-line \
            --require-version 1.2.0 \
            --require-version 1.3.0 \
            --require-version 1.3.1 \
            --require-version 1.3.2 \
            --require-version 1.3.3 \
            --require-version 1.3.4 \
            --require-version 1.3.5

      - name: Second bootstrap cycle regression
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('releases/1.3.6/apply-1.3.3.sh').read_text()
          wrapper=Path('releases/1.3.6/apply-1.3.6.sh').read_text()
          assert 'systemctl enable --now minecraft-update.timer\n' in source
          assert '/usr/local/sbin/srv-control-minecraft updater >/dev/null\n' in source
          assert "old='systemctl enable --now minecraft-update.timer\\n'" in wrapper
          assert "new='systemctl enable --now minecraft-update.timer >/dev/null 2>&1 || true\\n'" in wrapper
          assert "old='/usr/local/sbin/srv-control-minecraft updater >/dev/null\\n'" in wrapper
          assert "new='/usr/local/sbin/srv-control-minecraft updater >/dev/null 2>&1 || true\\n'" in wrapper
          assert 'systemctl enable --now srvcc-github-agent.timer' in wrapper
          assert "data['version']='1.3.6'" in wrapper
          print('SECOND BOOTSTRAP CYCLE REGRESSION PASS')
          PY

      - name: Acceptance isolation contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases/1.3.6/acceptance-1.3.6.sh').read_text()
          assert 'acceptance-1.3.3.sh' in p
          assert 'text=text.replace("1.3.3","1.3.6")' in p
          assert 'Optional Minecraft subsystem health is deliberately non-transactional' in p
          assert "data.get('version') == '1.3.6'" in p
          print('ACCEPTANCE ISOLATION PASS')
          PY

      - name: Payload lineage and frozen releases
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD:releases/1.3.5)" = "b9c61b02d8be814c394ff6ec32f1e9aaf659304e"
          test "$(git rev-parse HEAD:releases/1.3.6/payload)" = "$(git rev-parse HEAD:releases/1.3.5/payload)"
          test "$(git rev-parse HEAD:releases/1.3.6/system)" = "$(git rev-parse HEAD:releases/1.3.5/system)"
