name: Control Center 1.3.6 frozen validation

on:
  pull_request:
    paths:
      - 'releases/1.3.6/**'
      - '.github/workflows/release-1.3.6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-release-1-3-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen 1.3.6 contract
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD:releases/1.3.6)" = "f7423bf6a1288283aa0c1b5bbe4a880817fefc28"
          bash -n releases/1.3.6/preflight-1.3.6.sh
          bash -n releases/1.3.6/apply-1.3.6.sh
          bash -n releases/1.3.6/acceptance-1.3.6.sh
          bash -n releases/1.3.6/rollback-1.3.6.sh
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/1.3.6')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['release_id']==manifest['release_version']=='1.3.6'
          for stage,entry in manifest['scripts'].items():
              actual=hashlib.sha256((root/entry['path']).read_bytes()).hexdigest()
              assert actual == entry['sha256'], (stage,actual,entry['sha256'])
          print('FROZEN 1.3.6 PASS')
          PY
