name: Control Center 1.1.x Full Acceptance

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_version:
        description: Release-candidate semantic version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_version:
        description: Release-candidate semantic version
        required: true
        default: 1.1.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: control-center-1.1-acceptance-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GO_VERSION: '1.23.2'
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  CANONICAL_REF: refs/remotes/origin/1.1.x

jobs:
  full-validation:
    name: Full deterministic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Exact GATE-FROZEN identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          [[ "$CANDIDATE_VERSION" =~ ^1\.1\.0-rc\.[0-9]+$ ]]
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          git fetch --no-tags origin 1.1.x:"$CANONICAL_REF"
          GATE_FROZEN_SHA="$(git rev-parse "$CANONICAL_REF")"
          test "$GATE_FROZEN_SHA" = "$CANDIDATE_SHA"
      - name: Deterministic gates
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          bash -n install/*.sh scripts/*.sh
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          ./scripts/secret-scan.sh
          git diff --check

  baseline-immutability:
    name: Stable 1.0.0 reproducibility
    needs: [full-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Rebuild exact accepted 1.0.0
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 1b364ae88789696bf98537d21544de8a259d086d HEAD
          git worktree add --detach /tmp/control-center-1.0.0 1b364ae88789696bf98537d21544de8a259d086d
          cd /tmp/control-center-1.0.0
          ./scripts/build-release.sh
          set -a
          source dist/BUILDINFO.env
          set +a
          test "$VERSION" = 1.0.0
          test "$COMMIT" = 1b364ae88789696bf98537d21544de8a259d086d
          test "$AMD64_SHA256" = 341f6a49646f92aca72692730ea61278cc03bfc1689d029d7a7ce573554fa735
          test "$ARM64_SHA256" = 5e6e959f39bd4cb554e902908863c92eb5c697f4d99b55ca97fa4735ec9419fe

  reproducible-build:
    name: Reproducible ${{ matrix.arch }} dual runtime
    needs: [full-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build both runtimes twice and compare
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILT_AT="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for pass in 1 2; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Version=${CANDIDATE_VERSION} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Commit=${CANDIDATE_SHA} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.BuiltAt=${BUILT_AT}" \
              -o "dist/control-center-${{ matrix.arch }}-${pass}" ./cmd/control-center
            CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" \
              go build -trimpath -buildvcs=false -ldflags "-s -w" \
              -o "dist/control-center-privileged-worker-${{ matrix.arch }}-${pass}" ./cmd/control-center-privileged-worker
          done
          cmp "dist/control-center-${{ matrix.arch }}-1" "dist/control-center-${{ matrix.arch }}-2"
          cmp "dist/control-center-privileged-worker-${{ matrix.arch }}-1" "dist/control-center-privileged-worker-${{ matrix.arch }}-2"
          sha256sum \
            "dist/control-center-${{ matrix.arch }}-1" \
            "dist/control-center-privileged-worker-${{ matrix.arch }}-1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-${{ env.CANDIDATE_VERSION }}-${{ matrix.arch }}
          path: |
            dist/control-center-${{ matrix.arch }}-1
            dist/control-center-privileged-worker-${{ matrix.arch }}-1
          if-no-files-found: error
          retention-days: 14

  disposable-runtime:
    name: Disposable runtime / update / rollback
    needs: [full-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build dual-runtime candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILT_AT="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Version=${CANDIDATE_VERSION} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Commit=${CANDIDATE_SHA} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.BuiltAt=${BUILT_AT}" \
            -o dist/control-center-linux-amd64 ./cmd/control-center
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o dist/control-center-privileged-worker-linux-amd64 ./cmd/control-center-privileged-worker
      - name: Generate disposable update trust
        shell: bash
        run: |
          set -Eeuo pipefail
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/update-private.pem"
          openssl pkey -in "$RUNNER_TEMP/update-private.pem" -pubout -out "$RUNNER_TEMP/update-public.pem"
      - name: Install and exercise runtime lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            sudo bash install/uninstall.sh >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo env \
            CONTROL_CENTER_BINARY="$GITHUB_WORKSPACE/dist/control-center-linux-amd64" \
            CONTROL_CENTER_PRIVILEGED_WORKER_BINARY="$GITHUB_WORKSPACE/dist/control-center-privileged-worker-linux-amd64" \
            CONTROL_CENTER_UPDATE_PUBLIC_KEY="$RUNNER_TEMP/update-public.pem" \
            bash install/install.sh
          systemctl is-active --quiet control-center-privileged-worker.service
          systemctl is-enabled --quiet control-center-privileged-worker.service
          test -S /run/control-center/privileged-worker.sock
          test "$(stat -Lc '%U:%G:%a' /run/control-center/privileged-worker.sock)" = 'root:control-center:660'
          curl -fsS http://127.0.0.1:8876/api/v1/health
          curl -fsS http://127.0.0.1:8876/api/v1/readiness | grep -Fq '"ready":true'
          sudo env \
            CONTROL_CENTER_UPDATE_PRIVATE_KEY="$RUNNER_TEMP/update-private.pem" \
            CONTROL_CENTER_UPDATE_TEST_TARGET_VERSION=1.1.1-beta.1 \
            CONTROL_CENTER_UPDATE_TEST_BROKEN_VERSION=1.1.1-beta.2 \
            CONTROL_CENTER_UPDATE_TEST_DOWNGRADE_VERSION=1.1.0-rc.1 \
            bash scripts/update-acceptance.sh
          sudo bash scripts/auth-acceptance.sh
          sudo bash scripts/operations-acceptance.sh
          sudo env \
            CONTROL_CENTER_BINARY="$GITHUB_WORKSPACE/dist/control-center-linux-amd64" \
            CONTROL_CENTER_PRIVILEGED_WORKER_BINARY="$GITHUB_WORKSPACE/dist/control-center-privileged-worker-linux-amd64" \
            CONTROL_CENTER_UPDATE_PUBLIC_KEY="$RUNNER_TEMP/update-public.pem" \
            bash install/install.sh --repair

  staging-package:
    name: Prepare staging candidate
    needs: [full-validation, reproducible-build, disposable-runtime, baseline-immutability]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Recheck GATE-FROZEN identity before secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin 1.1.x:"$CANONICAL_REF"
          GATE_FROZEN_SHA="$(git rev-parse "$CANONICAL_REF")"
          test "$GATE_FROZEN_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Detect remote staging configuration
        id: config
        env:
          STAGING_HOST: ${{ secrets.CONTROL_CENTER_STAGING_HOST }}
          STAGING_USER: ${{ secrets.CONTROL_CENTER_STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.CONTROL_CENTER_STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.CONTROL_CENTER_STAGING_KNOWN_HOSTS }}
          STAGING_SIGNING_KEY: ${{ secrets.CONTROL_CENTER_STAGING_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_KNOWN_HOSTS STAGING_SIGNING_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Remote staging'
              echo
              echo "Not configured: ${missing[*]}"
              echo 'Disposable runtime acceptance remains authoritative for development, but production promotion must not proceed without real-server staging evidence.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed dual-runtime staging package
        if: steps.config.outputs.configured == 'true'
        env:
          STAGING_SIGNING_KEY: ${{ secrets.CONTROL_CENTER_STAGING_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILT_AT="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          printf '%s\n' "$STAGING_SIGNING_KEY" > "$RUNNER_TEMP/staging-private.pem"
          chmod 0600 "$RUNNER_TEMP/staging-private.pem"
          openssl pkey -in "$RUNNER_TEMP/staging-private.pem" -pubout -out dist/staging-public.pem
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Version=${CANDIDATE_VERSION} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.Commit=${CANDIDATE_SHA} -X github.com/ControlCenterSoft/srv-deployment/internal/buildinfo.BuiltAt=${BUILT_AT}" \
            -o dist/control-center-linux-amd64 ./cmd/control-center
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o dist/control-center-privileged-worker-linux-amd64 ./cmd/control-center-privileged-worker
          go run ./cmd/release-tool package-v2 \
            --binary dist/control-center-linux-amd64 \
            --worker dist/control-center-privileged-worker-linux-amd64 \
            --version "$CANDIDATE_VERSION" \
            --channel beta \
            --commit "$CANDIDATE_SHA" \
            --arch amd64 \
            --private-key "$RUNNER_TEMP/staging-private.pem" \
            --output dist/control-center-staging.tar.gz \
            --built-at "$BUILT_AT"
          expected_entries=$'bootstrap-manifest.json\nbootstrap-manifest.sig\nmanifest.json\nmanifest.sig\ncontrol-center\ncontrol-center-privileged-worker'
          test "$(tar -tzf dist/control-center-staging.tar.gz)" = "$expected_entries"
          sha256sum dist/control-center-staging.tar.gz > dist/control-center-staging.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.config.outputs.configured == 'true'
        with:
          name: control-center-staging-${{ env.CANDIDATE_VERSION }}
          path: |
            dist/control-center-staging.tar.gz
            dist/control-center-staging.tar.gz.sha256
            dist/staging-public.pem
          if-no-files-found: error
          retention-days: 7

  remote-staging:
    name: Real test-server staging
    if: needs.staging-package.outputs.configured == 'true'
    needs: [staging-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: control-center-staging-${{ env.CANDIDATE_VERSION }}
          path: staging
      - name: Recheck GATE-FROZEN identity before SSH secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin 1.1.x:"$CANONICAL_REF"
          GATE_FROZEN_SHA="$(git rev-parse "$CANONICAL_REF")"
          test "$GATE_FROZEN_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Configure pinned SSH transport
        env:
          STAGING_SSH_KEY: ${{ secrets.CONTROL_CENTER_STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.CONTROL_CENTER_STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/control-center-staging-ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$RUNNER_TEMP/control-center-staging-ssh/id_control_center_staging"
          chmod 0600 "$RUNNER_TEMP/control-center-staging-ssh/id_control_center_staging"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/control-center-staging-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/control-center-staging-ssh/known_hosts"
      - name: Deploy exact signed candidate
        env:
          CONTROL_CENTER_STAGING_HOST: ${{ secrets.CONTROL_CENTER_STAGING_HOST }}
          CONTROL_CENTER_STAGING_USER: ${{ secrets.CONTROL_CENTER_STAGING_USER }}
          CONTROL_CENTER_STAGING_PORT: ${{ secrets.CONTROL_CENTER_STAGING_PORT }}
          CONTROL_CENTER_STAGING_SSH_KEY_FILE: ${{ runner.temp }}/control-center-staging-ssh/id_control_center_staging
          CONTROL_CENTER_STAGING_KNOWN_HOSTS_FILE: ${{ runner.temp }}/control-center-staging-ssh/known_hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/staging-deploy.sh \
            --package staging/control-center-staging.tar.gz \
            --public-key staging/staging-public.pem \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-sha "$CANDIDATE_SHA"

  acceptance-summary:
    name: Candidate acceptance summary
    if: ${{ always() }}
    needs: [full-validation, baseline-immutability, reproducible-build, disposable-runtime, staging-package, remote-staging]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate
        env:
          FULL: ${{ needs.full-validation.result }}
          BASELINE: ${{ needs.baseline-immutability.result }}
          REPRO: ${{ needs.reproducible-build.result }}
          RUNTIME: ${{ needs.disposable-runtime.result }}
          STAGING_PACKAGE: ${{ needs.staging-package.result }}
          STAGING_CONFIGURED: ${{ needs.staging-package.outputs.configured }}
          REMOTE: ${{ needs.remote-staging.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$FULL" = success
          test "$BASELINE" = success
          test "$REPRO" = success
          test "$RUNTIME" = success
          test "$STAGING_PACKAGE" = success
          if [[ "$STAGING_CONFIGURED" == true ]]; then
            test "$REMOTE" = success
            echo 'REMOTE_STAGING=PASSED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'REMOTE_STAGING=NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'LOCAL_FULL_ACCEPTANCE=PASSED' >> "$GITHUB_STEP_SUMMARY"
