name: Control Center 1.1.x Acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact candidate commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-center-1.1-acceptance
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Exact candidate identity
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Deterministic gates
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          bash -n install/*.sh scripts/*.sh
          ./scripts/secret-scan.sh
          python3 -m unittest discover -s tests -p 'test_gemini_review.py' -v

  staging-contract:
    name: Staging deployment contract
    needs: [candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Require typed staging entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x scripts/staging-deploy.sh || {
            echo "STAGING=BLOCKED"
            echo "A versioned typed scripts/staging-deploy.sh is required before remote staging may be enabled."
            echo "Arbitrary SSH/root command execution is prohibited."
            exit 1
          }

  acceptance:
    name: Acceptance summary
    if: ${{ always() }}
    needs: [candidate, staging-contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          STAGING: ${{ needs.staging-contract.result }}
        run: |
          test "$CANDIDATE" = success
          test "$STAGING" = success
