name: QA staging preflight least-privilege boundary

on:
  pull_request:
    branches: ['1.1.x']
    paths:
      - 'scripts/stage-ops-agent-signed.sh'
      - 'tests/test_ops_agent_staging_preflight_boundary.py'
      - '.github/workflows/qa-staging-preflight-boundary.yml'

permissions:
  contents: read

jobs:
  staging-preflight-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reproduce least-privilege preflight contract
        run: python3 -m unittest tests.test_ops_agent_staging_preflight_boundary
