name: SRV Control Center 1.3.0 server-state hotfix

on:
  push:
    branches: [hotfix/1.3.0-state-repository]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-publisher-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate syntax and integration contract
        run: |
          set -Eeuo pipefail
          publisher='releases/1.3.0/system/srvcc-github-state-publisher'
          configurator='releases/1.3.0/system/srvcc-configure-auto-updates'
          bash -n "$publisher"
          bash -n "$configurator"
          grep -Fq 'STATE_REPO="${SRVCC_STATE_REPO:-${AGENT_ROOT}/state-repo}"' "$publisher"
          grep -Fq 'STATE_BRANCH="${SRVCC_STATE_BRANCH:-server-state}"' "$publisher"
          grep -Fq 'gh auth status --hostname github.com' "$publisher"
          grep -Fq 'gh auth setup-git' "$publisher"
          grep -Fq 'failed to recreate state repository' "$publisher"
          grep -Fq 'SECURITY_SCAN_BLOCKED.txt' "$publisher"
          grep -Fq 'srvcc-github-state-publisher' "$configurator"
          grep -Fq 'install -m 0755 -o root -g root "$STATE_PUBLISHER_SOURCE" "$STATE_PUBLISHER"' "$configurator"

      - name: Exercise create push self-heal and secret blocking
        run: |
          set -Eeuo pipefail
          publisher="$GITHUB_WORKSPACE/releases/1.3.0/system/srvcc-github-state-publisher"
          tmp="$(mktemp -d)"
          remote="$tmp/remote.git"
          seed="$tmp/seed"
          project="$tmp/project"
          agent="$tmp/agent"
          state_repo="$agent/state-repo"
          release_meta="$tmp/release.json"
          log="$tmp/state.log"

          git init --bare "$remote"
          git init -b main "$seed"
          git -C "$seed" config user.name CI
          git -C "$seed" config user.email ci@example.invalid
          printf '# state publisher CI remote\n' > "$seed/README.md"
          git -C "$seed" add README.md
          git -C "$seed" commit -m seed
          git -C "$seed" remote add origin "$remote"
          git -C "$seed" push -u origin main

          mkdir -p "$project"
          printf 'safe-v1\n' > "$project/app.txt"
          printf 'SHOULD_NOT_PUBLISH=secret\n' > "$project/.env"
          cat > "$release_meta" <<'JSON'
          {"version":"1.3.0","release_id":"1.3.0","git_sha":"ci-hotfix"}
          JSON

          run_publisher() {
            SRVCC_REPO_URL="$remote" \
            SRVCC_PROJECT="$project" \
            SRVCC_AGENT_ROOT="$agent" \
            SRVCC_STATE_REPO="$state_repo" \
            SRVCC_RELEASE_META="$release_meta" \
            SRVCC_LOG="$log" \
              bash "$publisher"
          }

          run_publisher
          git --git-dir="$remote" rev-parse refs/heads/server-state
          test -s "$state_repo/server-state/summary.env"
          grep -Fq 'release_version=1.3.0' "$state_repo/server-state/summary.env"
          grep -Fq 'safe-v1' "$state_repo/source/app.txt"
          test ! -e "$state_repo/source/.env"
          first_sha="$(git --git-dir="$remote" rev-parse refs/heads/server-state)"

          rm -rf "$state_repo"
          printf 'safe-v2\n' > "$project/app.txt"
          run_publisher
          second_sha="$(git --git-dir="$remote" rev-parse refs/heads/server-state)"
          test "$second_sha" != "$first_sha"
          grep -Fq 'safe-v2' "$state_repo/source/app.txt"
          grep -Fq 'STATE PASS: Server state pushed' "$log"

          before_block="$second_sha"
          printf 'github_pat_123456789012345678901234567890\n' > "$project/bad.txt"
          if run_publisher; then
            echo 'publisher unexpectedly accepted a secret-like token' >&2
            exit 1
          fi
          after_block="$(git --git-dir="$remote" rev-parse refs/heads/server-state)"
          test "$after_block" = "$before_block"
          test -s "$agent/SECURITY_SCAN_BLOCKED.txt"
