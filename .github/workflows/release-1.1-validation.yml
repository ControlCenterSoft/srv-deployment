name: SRV Control Center 1.1.0 historical validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate archived 1.1.0 release
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('releases/1.1.0')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['release_id']=='1.1.0', manifest
          assert manifest['release_version']=='1.1.0', manifest
          for name,item in manifest['scripts'].items():
              digest=hashlib.sha256((root/item['path']).read_bytes()).hexdigest()
              assert digest==item['sha256'], (name,digest,item['sha256'])
          PY
          bash -n releases/1.1.0/preflight.sh
          bash -n releases/1.1.0/apply.sh
          bash -n releases/1.1.0/acceptance.sh
          bash -n releases/1.1.0/rollback.sh
          python3 -m compileall -q releases/1.1.0/payload/app
