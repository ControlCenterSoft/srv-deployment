name: SRV Control Center 1.4.0 backup safety

on:
  push:
    branches: [release/1.4.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  backup-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PXE-aware backup packaging
        run: |
          set -Eeuo pipefail
          bash -n releases/1.4.0/apply.sh
          bash -n releases/1.4.0/rollback.sh
          python3 -m py_compile releases/1.4.0/system/srv-control-backup
          python3 releases/1.4.0/tests/pxe_backup_contract.py
          grep -Fq '/usr/local/libexec/srv-control-backup' releases/1.4.0/apply.sh
          grep -Fq '/usr/local/libexec/srv-control-backup' releases/1.4.0/rollback.sh
          grep -Fq 'invalidate_restored_pxe_authorizations' releases/1.4.0/system/srv-control-backup
          grep -Fq 'pxe/smb-credential.json' releases/1.4.0/system/srv-control-backup
          grep -Fq "config = COALESCE(config, '{}'::jsonb) - 'boot_token' - 'report_token'" releases/1.4.0/system/srv-control-backup

      - name: Publish PXE backup audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_STATE: ${{ job.status }}
        run: |
          state=failure
          description='SRV PXE backup audit failed'
          if [[ "$AUDIT_STATE" == success ]]; then state=success; description='SRV PXE backup audit passed'; fi
          python3 - "$state" "$description" > /tmp/status.json <<'PY'
          import json,sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': 'srv-pxe-backup-audit',
              'description': sys.argv[2],
              'target_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json