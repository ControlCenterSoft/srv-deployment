name: build-stable-real-host-v1

on:
  push:
    branches: ["ops/1.0.0-stable-real-host-v1"]

permissions:
  contents: read
  statuses: write

env:
  STATUS_CONTEXT: ops/stable-v1-build

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Mark build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({"state":"pending","context":os.environ["STATUS_CONTEXT"],"description":"Building stable real-host acceptance","target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
      - name: Materialize immutable accepted RC v7
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ControlCenterSoft/srv-deployment/fe579e3f38e18bf1fc56a93699489b762206427d/ops/rc1-real-host-acceptance-v7/run-verified.sh' -o /tmp/v7-launcher.sh
          chmod 0700 /tmp/v7-launcher.sh
          sudo env RC1_V7_BUILD_ONLY=1 OUTPUT_V7=/tmp/v7.sh bash /tmp/v7-launcher.sh
          sudo chown "$USER:$USER" /tmp/v7.sh
          printf '%s  %s\n' 'fcbaac43459b0ef9fffe239c56961201bc514d8d14cf02f9df4f423ad94e80d4' /tmp/v7.sh | sha256sum -c -
      - name: Transform and validate stable acceptance
        run: |
          set -Eeuo pipefail
          python3 ops/stable-real-host-v1/transform.py /tmp/v7.sh /tmp/stable-v1.sh
          bash -n /tmp/stable-v1.sh
          grep -Fq 'RC_VERSION="1.0.0"' /tmp/stable-v1.sh
          grep -Fq 'RC_COMMIT="1b364ae88789696bf98537d21544de8a259d086d"' /tmp/stable-v1.sh
          grep -Fq 'BETA_VERSION="1.0.0-rc.1"' /tmp/stable-v1.sh
          grep -Fq 'BETA_COMMIT="77b62d5829a46b1b29698495043146d79f37dc48"' /tmp/stable-v1.sh
          grep -Fq 'scripts/stable-update-acceptance.sh' /tmp/stable-v1.sh
          grep -Fq 'recover_accepted_baseline()' /tmp/stable-v1.sh
          grep -Fq 'BASE="/opt/control-center-stable-acceptance"' /tmp/stable-v1.sh
          ! grep -Fq '/opt/control-center-rc1-acceptance' /tmp/stable-v1.sh
          ! grep -Fq 'scripts/rc1-update-acceptance.sh' /tmp/stable-v1.sh
          echo '=== STABLE_ACCEPTANCE_SHA256 ==='
          sha256sum /tmp/stable-v1.sh
          echo '=== STABLE_ACCEPTANCE_KEY_ANCHORS ==='
          grep -nE 'RC_VERSION=|RC_COMMIT=|BETA_VERSION=|BETA_COMMIT=|recover_accepted_baseline|upgrade-accepted-rc1-to-stable|stable-forward-update-broken-rollback|FINAL_STATUS=PASSED|STABLE REAL-HOST' /tmp/stable-v1.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stable-real-host-v1-script
          path: /tmp/stable-v1.sh
          if-no-files-found: error
          retention-days: 30
      - name: Publish build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure; DESC='Stable real-host acceptance build failed'
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Stable real-host acceptance build passed'; fi
          export STATE DESC
          python3 - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({"state":os.environ["STATE"],"context":os.environ["STATUS_CONTEXT"],"description":os.environ["DESC"],"target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
