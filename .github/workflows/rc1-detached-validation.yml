name: rc1-detached-validation

on:
  push:
    branches: ["ci/rc1-detached-validation"]

permissions:
  contents: read
  statuses: write

env:
  GOTOOLCHAIN: local
  RC_SHA: 77b62d5829a46b1b29698495043146d79f37dc48
  RC_VERSION: 1.0.0-rc.1
  RC_AMD64_SHA256: dd1bae6364657c1f65a72c63e428f61df58d0030ee85b5320ede6a598a6a6c1d
  RC_ARM64_SHA256: fadd38f5211442073a071a3d87cad35bc1f4f89c0e3466a36861f40dbbf8f54e
  STATUS_CONTEXT: control-center/rc1-detached-ci

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark frozen candidate pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Detached CI validating exact frozen rc.1",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${RC_SHA}" \
            --data-binary @/tmp/status.json

  validate:
    needs: announce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Exact source identity
        run: test "$(git rev-parse HEAD)" = "$RC_SHA"
      - name: Toolchain identity
        run: test "$(go env GOVERSION)" = go1.23.2
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and API tests
        run: go test ./...
      - name: Script syntax
        run: bash -n install/install.sh install/uninstall.sh install/update.sh scripts/build.sh scripts/build-release.sh scripts/auth-acceptance.sh scripts/operations-acceptance.sh scripts/update-acceptance.sh scripts/rc1-update-acceptance.sh scripts/secret-scan.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Exact release build
        run: ./scripts/build-release.sh
      - name: Exact artifact identity
        run: |
          grep -Fq "$RC_AMD64_SHA256" dist/SHA256SUMS
          grep -Fq "$RC_ARM64_SHA256" dist/SHA256SUMS
          test "$(./dist/control-center-linux-amd64 build-info --field version)" = "$RC_VERSION"
          test "$(./dist/control-center-linux-amd64 build-info --field commit)" = "$RC_SHA"
      - name: Reproducible rebuild
        run: |
          cp dist/SHA256SUMS /tmp/first-SHA256SUMS
          cp dist/BUILDINFO.env /tmp/first-BUILDINFO.env
          rm -rf dist
          ./scripts/build-release.sh
          cmp /tmp/first-SHA256SUMS dist/SHA256SUMS
          cmp /tmp/first-BUILDINFO.env dist/BUILDINFO.env
      - name: Release signature smoke
        run: |
          set -a
          source dist/BUILDINFO.env
          set +a
          openssl genpkey -algorithm ED25519 -out /tmp/control-center-update-private.pem
          openssl pkey -in /tmp/control-center-update-private.pem -pubout -out /tmp/control-center-update-public.pem
          go run ./cmd/release-tool package \
            --binary ./dist/control-center-linux-amd64 \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --arch amd64 \
            --private-key /tmp/control-center-update-private.pem \
            --output /tmp/control-center-release.tar.gz \
            --built-at "$BUILT_AT"
          mkdir /tmp/release-check
          tar -xzf /tmp/control-center-release.tar.gz -C /tmp/release-check
          test "$(find /tmp/release-check -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ' -)" = "control-center manifest.json manifest.sig"
          ./dist/control-center-linux-amd64 verify-release \
            --manifest /tmp/release-check/manifest.json \
            --signature /tmp/release-check/manifest.sig \
            --public-key /tmp/control-center-update-public.pem \
            --artifact /tmp/release-check/control-center \
            --field release-id
          rm -f /tmp/control-center-update-private.pem
      - name: Runtime smoke
        run: |
          state_dir=$(mktemp -d)
          log_dir=$(mktemp -d)
          CONTROL_CENTER_STATE_DIR="$state_dir" ./dist/control-center-linux-amd64 bootstrap-admin --username admin
          CONTROL_CENTER_STATE_DIR="$state_dir" CONTROL_CENTER_LOG_DIR="$log_dir" CONTROL_CENTER_LISTEN=127.0.0.1:18876 ./dist/control-center-linux-amd64 > /tmp/control-center.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$state_dir" "$log_dir"' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18876/api/v1/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:18876/api/v1/health
          curl -fsS http://127.0.0.1:18876/api/v1/readiness
          version_json=$(curl -fsS http://127.0.0.1:18876/api/v1/version)
          grep -Fq "\"version\":\"$RC_VERSION\"" <<<"$version_json"
          grep -Fq "\"commit\":\"$RC_SHA\"" <<<"$version_json"

  systemd-acceptance:
    needs: announce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Exact source identity
        run: test "$(git rev-parse HEAD)" = "$RC_SHA"
      - name: Toolchain identity
        run: test "$(go env GOVERSION)" = go1.23.2
      - name: Generate ephemeral update trust
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/control-center-update-private.pem
          openssl pkey -in /tmp/control-center-update-private.pem -pubout -out /tmp/control-center-update-public.pem
          chmod 0600 /tmp/control-center-update-private.pem
      - name: Build exact candidate
        run: |
          ./scripts/build-release.sh
          grep -Fq "$RC_AMD64_SHA256" dist/SHA256SUMS
      - name: Clean install
        run: sudo env CONTROL_CENTER_UPDATE_PUBLIC_KEY=/tmp/control-center-update-public.pem ./install/install.sh
      - name: Clean install service assertion
        run: |
          if ! systemctl is-active --quiet control-center.service; then
            sudo systemctl status control-center.service --no-pager -l || true
            sudo journalctl -u control-center.service -n 120 --no-pager || true
            exit 1
          fi
      - name: Current symlink assertion
        run: |
          sudo ls -ld /usr/local/lib/control-center /usr/local/lib/control-center/current /usr/local/lib/control-center/releases || true
          readlink /usr/local/lib/control-center/current || true
          test -L /usr/local/lib/control-center/current
      - name: Current binary assertion
        run: |
          sudo ls -l /usr/local/lib/control-center/current/control-center || true
          stat -c '%a %U:%G %n' /usr/local/lib/control-center/current/control-center || true
          test -x /usr/local/lib/control-center/current/control-center
      - name: Updater assertion
        run: |
          sudo ls -l /usr/local/sbin/control-center-update || true
          stat -c '%a %U:%G %n' /usr/local/sbin/control-center-update || true
          test -x /usr/local/sbin/control-center-update
      - name: Update trust assertion
        run: |
          sudo ls -l /etc/control-center/update-public-key.pem
          sudo stat -c '%a %U:%G %n' /etc/control-center/update-public-key.pem
          sudo test -f /etc/control-center/update-public-key.pem
      - name: Directory modes assertion
        run: |
          sudo stat -c '%a %U:%G %n' /etc/control-center /var/lib/control-center /var/log/control-center
          test "$(sudo stat -c %a /etc/control-center)" = 750
          test "$(sudo stat -c %a /var/lib/control-center)" = 750
          test "$(sudo stat -c %a /var/log/control-center)" = 750
      - name: Clean install environment assertion
        run: |
          sudo cat /etc/control-center/control-center.env
          sudo grep -qx 'CONTROL_CENTER_LISTEN=127.0.0.1:8876' /etc/control-center/control-center.env
      - name: Clean install HTTP assertion
        run: |
          curl -fsS http://127.0.0.1:8876/api/v1/health
          curl -fsS http://127.0.0.1:8876/api/v1/readiness
      - name: Restart acceptance
        run: |
          sudo systemctl restart control-center.service
          systemctl is-active --quiet control-center.service
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8876/api/v1/readiness >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8876/api/v1/readiness
      - name: Authentication and RBAC acceptance
        run: sudo ./scripts/auth-acceptance.sh
      - name: Operations and diagnostics acceptance
        run: sudo ./scripts/operations-acceptance.sh
      - name: RC signed update and rollback acceptance
        run: sudo env CONTROL_CENTER_UPDATE_PRIVATE_KEY=/tmp/control-center-update-private.pem ./scripts/rc1-update-acceptance.sh
      - name: Restore exact rc.1 after synthetic update tests
        run: |
          set -a
          source dist/BUILDINFO.env
          set +a
          go run ./cmd/release-tool package \
            --binary ./dist/control-center-linux-amd64 \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --arch amd64 \
            --private-key /tmp/control-center-update-private.pem \
            --output /tmp/control-center-rc1.tar.gz \
            --built-at "$BUILT_AT"
          sudo control-center-update --package /tmp/control-center-rc1.tar.gz --allow-downgrade
      - name: Repair and reinstall acceptance
        run: |
          sudo ./install/install.sh --repair
          sudo ./install/install.sh --reinstall
          systemctl is-active --quiet control-center.service
          sudo test -f /etc/control-center/update-public-key.pem
      - name: Preserve-state uninstall and reinstall
        run: |
          sudo ./install/uninstall.sh
          sudo test -f /etc/control-center/control-center.env
          sudo test -f /etc/control-center/update-public-key.pem
          sudo test -d /var/lib/control-center
          sudo ./install/install.sh
          systemctl is-active --quiet control-center.service
      - name: Purge uninstall
        run: |
          sudo ./install/uninstall.sh --purge
          test ! -e /etc/control-center
          test ! -e /var/lib/control-center
          test ! -e /var/log/control-center
          test ! -e /usr/local/lib/control-center
          test ! -e /usr/local/sbin/control-center-update
          ! systemctl is-active --quiet control-center.service
      - name: Remove ephemeral signing key
        if: always()
        run: sudo rm -f /tmp/control-center-update-private.pem /tmp/control-center-update-public.pem /tmp/control-center-rc1.tar.gz

  report-status:
    if: always()
    needs: [announce, validate, systemd-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish frozen candidate status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SYSTEMD_RESULT: ${{ needs.systemd-acceptance.result }}
        run: |
          state=failure
          description="Detached CI failed"
          if [[ "$VALIDATE_RESULT" == success && "$SYSTEMD_RESULT" == success ]]; then
            state=success
            description="Detached CI passed exact frozen rc.1"
          fi
          export STATE="$state" DESCRIPTION="$description"
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            "state": os.environ["STATE"],
            "context": os.environ["STATUS_CONTEXT"],
            "description": os.environ["DESCRIPTION"],
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${RC_SHA}" \
            --data-binary @/tmp/status.json
