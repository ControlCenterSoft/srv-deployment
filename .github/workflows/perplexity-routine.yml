name: Perplexity Routine Engineer

on:
  issues:
    types: [opened, edited, reopened]
  workflow_call:
    inputs:
      code_ref:
        description: Immutable ref containing the routine engineer implementation
        required: true
        type: string
    secrets:
      PERPLEXITY_API_KEY:
        description: Perplexity API credential for this advisory workflow only
        required: true
  workflow_dispatch:
    inputs:
      task:
        description: Low-risk routine research task
        required: true
        type: string
      stream:
        description: Owning Control Center stream
        required: false
        type: string
      target:
        description: Optional PR, SHA, path or documentation target
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: perplexity-routine-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  routine:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          startsWith(github.event.issue.title, '[Perplexity Routine]') &&
          contains(github.event.issue.body || '', '<!-- cc-perplexity-routine:v1 -->') &&
          (
            github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL || 'sonar-pro' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_ref || github.sha }}
          persist-credentials: false

      - name: Check Perplexity configuration
        id: config
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PERPLEXITY_API_KEY}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Perplexity routine engineer'
              echo
              echo 'Skipped: repository secret `PERPLEXITY_API_KEY` is not configured.'
              echo 'No deterministic CI, QA, Security or release gate is affected.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Secret scan repository before external call
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/secret-scan.sh

      - name: Build bounded routine task packet
        if: steps.config.outputs.configured == 'true'
        id: task
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          INPUT_TASK: ${{ inputs.task || '' }}
          INPUT_STREAM: ${{ inputs.stream || '' }}
          INPUT_TARGET: ${{ inputs.target || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "issues":
              issue = os.environ.get("ISSUE_NUMBER", "")
              task_id = f"issue #{issue}"
              packet = (
                  f"Title: {os.environ.get('ISSUE_TITLE', '')}\n\n"
                  f"{os.environ.get('ISSUE_BODY', '')}"
              )
          else:
              task_id = f"manual run {os.environ.get('GITHUB_RUN_ID', '')}"
              packet = (
                  "<!-- cc-perplexity-routine:v1 -->\n"
                  f"Stream: {os.environ.get('INPUT_STREAM', '')}\n"
                  "Risk: routine\n"
                  f"Target: {os.environ.get('INPUT_TARGET', '')}\n"
                  f"Task: {os.environ.get('INPUT_TASK', '')}\n"
                  "Constraints: advisory only; no secrets; no code changes; no merge/release.\n"
              )

          Path(os.environ["RUNNER_TEMP"], "perplexity-routine-task.md").write_text(
              packet, encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"task_id={task_id}\n")
          PY

      - name: Reject task packet containing potential secrets
        if: steps.config.outputs.configured == 'true'
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts import perplexity_routine

          packet = Path(
              os.environ["RUNNER_TEMP"], "perplexity-routine-task.md"
          ).read_text(encoding="utf-8", errors="replace")
          safe = not perplexity_routine.contains_potential_secret(packet)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"safe={'true' if safe else 'false'}\n")
          if not safe:
              print("Routine task rejected before external call: potential secret detected.")
          PY

      - name: Report rejected task safely
        if: >-
          steps.config.outputs.configured == 'true' &&
          steps.guard.outputs.safe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Perplexity routine engineer'
            echo
            echo '**Status:** `REJECTED_BEFORE_EXTERNAL_CALL`'
            echo
            echo 'Potential credential/secret-shaped material was detected in the task packet.'
            echo 'Nothing from this task packet was sent to Perplexity.'
          } > "$RUNNER_TEMP/perplexity-routine-rejected.md"
          cat "$RUNNER_TEMP/perplexity-routine-rejected.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_EVENT_NAME}" == 'issues' && -n "${ISSUE_NUMBER}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --body-file "$RUNNER_TEMP/perplexity-routine-rejected.md"
          fi

      - name: Run Perplexity routine engineer
        if: >-
          steps.config.outputs.configured == 'true' &&
          steps.guard.outputs.safe == 'true'
        id: perplexity
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        shell: bash
        run: |
          set -u
          set +e
          python3 scripts/perplexity_routine.py \
            --task-file "$RUNNER_TEMP/perplexity-routine-task.md" \
            --output-json "$RUNNER_TEMP/perplexity-routine.json" \
            --output-md "$RUNNER_TEMP/perplexity-routine.md" \
            --repository "$GITHUB_REPOSITORY" \
            --task-id "${{ steps.task.outputs.task_id }}" \
            --model "$PERPLEXITY_MODEL"
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            {
              echo '## Perplexity routine engineer'
              echo
              echo '**Status:** `UNAVAILABLE`'
              echo
              echo 'The advisory routine task failed or Perplexity is temporarily unavailable.'
              echo 'No deterministic CI, QA, Security, staging or release gate is affected.'
            } > "$RUNNER_TEMP/perplexity-routine.md"
          fi
          cat "$RUNNER_TEMP/perplexity-routine.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'report_ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish issue result
        if: >-
          github.event_name == 'issues' &&
          steps.config.outputs.configured == 'true' &&
          steps.guard.outputs.safe == 'true' &&
          steps.perplexity.outputs.report_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- control-center-perplexity-routine-result -->'
          BODY_FILE="$RUNNER_TEMP/perplexity-routine-comment.md"
          {
            echo "$MARKER"
            cat "$RUNNER_TEMP/perplexity-routine.md"
          } > "$BODY_FILE"

          COMMENT_ID=''
          PAGE=1
          while :; do
            PAGE_FILE="$RUNNER_TEMP/perplexity-routine-comments-${PAGE}.json"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100&page=${PAGE}" \
              > "$PAGE_FILE"
            COMMENT_ID="$(jq -r --arg marker "$MARKER" \
              '[.[] | select(.body | contains($marker)) | .id][0] // empty' "$PAGE_FILE")"
            COUNT="$(jq 'length' "$PAGE_FILE")"
            if [[ -n "$COMMENT_ID" || "$COUNT" -lt 100 ]]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -F "body=@${BODY_FILE}" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -F "body=@${BODY_FILE}" >/dev/null
          fi
