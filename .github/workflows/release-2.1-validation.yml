name: Control Center 2.1 Minecraft stabilization validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'releases/2.1.*/**'
      - 'docs/2.1/**'
      - '.github/workflows/release-2.1-validation.yml'
      - 'deployment.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft-2-1-1-hardening-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve frozen 2.1.0 production while staging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('deployment.json',encoding='utf-8'))
          assert data.get('enabled') is True,data
          assert data.get('channel') == 'production',data
          assert data.get('release_id') == '2.1.0',data
          assert data.get('release_path') == 'releases/2.1.0',data
          print('STAGING GUARD PASS: production remains frozen 2.1.0')
          PY
          git diff --exit-code origin/main -- releases/2.1.0

      - name: Revalidate frozen 2.1.0 manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/2.1.0')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['release_id'] == manifest['release_version'] == '2.1.0'
          for stage,item in manifest['scripts'].items():
              digest=hashlib.sha256((root/item['path']).read_bytes()).hexdigest()
              assert digest == item['sha256'],(stage,digest,item['sha256'])
          print('FROZEN 2.1.0 MANIFEST PASS')
          PY

      - name: Print 2.1.1 release script hashes
        run: |
          set -euo pipefail
          sha256sum \
            releases/2.1.1/preflight-2.1.1.sh \
            releases/2.1.1/apply-2.1.1.sh \
            releases/2.1.1/acceptance-2.1.1.sh \
            releases/2.1.1/rollback-2.1.1.sh

      - name: Validate 2.1.1 syntax
        run: |
          set -euo pipefail
          bash -n releases/2.1.1/preflight-2.1.1.sh
          bash -n releases/2.1.1/apply-2.1.1.sh
          bash -n releases/2.1.1/acceptance-2.1.1.sh
          bash -n releases/2.1.1/rollback-2.1.1.sh
          python3 -m py_compile \
            releases/2.1.1/system/srv-control-minecraft-permissions \
            releases/2.1.1/system/srv-control-minecraft-bedrock-update \
            releases/2.1.1/system/srv-control-minecraft-dispatch

      - name: Validate direct upgrade and frozen-base chaining
        run: |
          set -euo pipefail
          preflight=releases/2.1.1/preflight-2.1.1.sh
          apply=releases/2.1.1/apply-2.1.1.sh
          rollback=releases/2.1.1/rollback-2.1.1.sh
          grep -Fq "{'1.3.8','2.0.0','2.1.0'}" "$preflight"
          grep -Fq 'bash "$BASE_RELEASE/preflight-2.1.0.sh"' "$preflight"
          grep -Fq 'bash "$BASE_RELEASE/apply-2.1.0.sh"' "$apply"
          grep -Fq 'bash "$BASE_RELEASE/rollback-2.1.0.sh"' "$rollback"
          grep -Fq 'original-source-version' "$apply"
          grep -Fq 'original-source-version' "$rollback"

      - name: Validate unprivileged runtime ownership contract
        run: |
          set -euo pipefail
          helper=releases/2.1.1/system/srv-control-minecraft-permissions
          apply=releases/2.1.1/apply-2.1.1.sh
          acceptance=releases/2.1.1/acceptance-2.1.1.sh
          rollback=releases/2.1.1/rollback-2.1.1.sh
          grep -Fq "TARGET_USER = 'minecraft'" "$helper"
          grep -Fq "TARGET_GROUP = 'minecraft'" "$helper"
          grep -Fq 'minecraft account unexpectedly resolves to uid 0' "$helper"
          grep -Fq 'runtime-metadata.jsonl' "$apply"
          grep -Fq 'User=minecraft' "$apply"
          grep -Fq 'Group=minecraft' "$apply"
          grep -Fq 'srv-control-minecraft-permissions.service' "$apply"
          grep -Fq 'User=minecraft' "$acceptance"
          grep -Fq 'Group=minecraft' "$acceptance"
          grep -Fq '.control-center-2.1.1-permission-probe' "$acceptance"
          grep -Fq 'runtime-metadata.jsonl' "$rollback"
          grep -Fq 'os.lchown' "$rollback"

      - name: Validate canonical updater contract
        run: |
          set -euo pipefail
          worker=releases/2.1.1/system/srv-control-minecraft-bedrock-update
          dispatcher=releases/2.1.1/system/srv-control-minecraft-dispatch
          apply=releases/2.1.1/apply-2.1.1.sh
          acceptance=releases/2.1.1/acceptance-2.1.1.sh
          grep -Fq "TIMER = 'srv-control-minecraft-bedrock-update.timer'" "$worker"
          grep -Fq 'skipped-version-unknown' "$worker"
          grep -Fq 'journal_version' "$worker"
          grep -Fq "CANONICAL_TIMER = 'srv-control-minecraft-bedrock-update.timer'" "$dispatcher"
          grep -Fq "'canonical_update_path': True" "$dispatcher"
          grep -Fq 'systemctl disable --now srv-control-minecraft-auto-update.timer' "$apply"
          grep -Fq 'systemctl disable --now minecraft-update.timer' "$apply"
          grep -Fq 'systemctl enable --now "$UPDATE_TIMER"' "$apply"
          grep -Fq "decision_ready') is True" "$acceptance"
          grep -Fq 'legacy minecraft-update.timer remains enabled' "$acceptance"
          grep -Fq 'conflicting multi-instance Minecraft timer remains enabled' "$acceptance"

      - name: Validate locked 2.1.1 manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('releases/2.1.1')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('release_id') == manifest.get('release_version') == '2.1.1',manifest
          assert manifest.get('upgrade_from') == '>=1.3.8,<2.1.1',manifest
          for stage in ('preflight','apply','acceptance','rollback'):
              item=manifest['scripts'][stage]
              assert item['path'] == f'{stage}-2.1.1.sh',item
              assert re.fullmatch(r'[0-9a-f]{64}',item['sha256']),item
              digest=hashlib.sha256((root/item['path']).read_bytes()).hexdigest()
              assert digest == item['sha256'],(stage,digest,item['sha256'])
          print('LOCKED 2.1.1 MANIFEST PASS')
          PY
