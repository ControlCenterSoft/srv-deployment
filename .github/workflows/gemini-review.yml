name: Gemini Independent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - 'ops/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_GATE_LEVEL: ${{ vars.GEMINI_GATE_LEVEL || 'NONE' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Gemini configuration
        id: config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Gemini independent review'
              echo
              echo 'Skipped: repository secret `GEMINI_API_KEY` is not configured.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build review diff
        if: steps.config.outputs.configured == 'true'
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGE_ID="PR #${{ github.event.pull_request.number }}"
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${GITHUB_SHA}"
            CHANGE_ID="push ${GITHUB_SHA}"
            if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
              BASE_SHA="${GITHUB_SHA}^"
            fi
          else
            HEAD_SHA="${GITHUB_SHA}"
            BASE_SHA="${GITHUB_SHA}^"
            CHANGE_ID="manual ${GITHUB_SHA}"
          fi

          git diff --no-ext-diff --unified=40 "${BASE_SHA}" "${HEAD_SHA}" -- . ':(exclude)ops/**' > "$RUNNER_TEMP/gemini-review.diff"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "change_id=${CHANGE_ID}" >> "$GITHUB_OUTPUT"
          echo "Diff bytes: $(wc -c < "$RUNNER_TEMP/gemini-review.diff")" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Gemini review
        if: steps.config.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gemini_review.py \
            --diff-file "$RUNNER_TEMP/gemini-review.diff" \
            --output-json "$RUNNER_TEMP/gemini-review.json" \
            --output-md "$RUNNER_TEMP/gemini-review.md" \
            --repository "$GITHUB_REPOSITORY" \
            --change-id "${{ steps.diff.outputs.change_id }}" \
            --sha "${{ steps.diff.outputs.head_sha }}" \
            --model "$GEMINI_MODEL"
          cat "$RUNNER_TEMP/gemini-review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR review comment
        if: steps.config.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- control-center-gemini-review -->'
          BODY_FILE="$RUNNER_TEMP/gemini-review-comment.md"
          {
            echo "$MARKER"
            cat "$RUNNER_TEMP/gemini-review.md"
          } > "$BODY_FILE"

          COMMENT_ID=''
          PAGE=1
          while :; do
            PAGE_FILE="$RUNNER_TEMP/gemini-comments-${PAGE}.json"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&page=${PAGE}" > "$PAGE_FILE"
            COMMENT_ID="$(jq -r --arg marker "$MARKER" '[.[] | select(.body | contains($marker)) | .id][0] // empty' "$PAGE_FILE")"
            COUNT="$(jq 'length' "$PAGE_FILE")"
            if [[ -n "$COMMENT_ID" || "$COUNT" -lt 100 ]]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F "body=@${BODY_FILE}" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${BODY_FILE}" >/dev/null
          fi

      - name: Enforce Gemini severity gate
        if: steps.config.outputs.configured == 'true'
        env:
          REVIEW_FILE: ${{ runner.temp }}/gemini-review.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          threshold = os.environ.get("GEMINI_GATE_LEVEL", "NONE").upper()
          ranks = {"LOW": 1, "MEDIUM": 2, "HIGH": 3, "BLOCKER": 4}
          if threshold in {"NONE", "OFF", "DISABLED"}:
              raise SystemExit(0)
          if threshold not in ranks:
              raise SystemExit(f"Invalid GEMINI_GATE_LEVEL: {threshold}")

          with open(os.environ["REVIEW_FILE"], encoding="utf-8") as fh:
              review = json.load(fh)
          blocked = [
              finding for finding in review.get("findings", [])
              if ranks.get(str(finding.get("severity", "")).upper(), 0) >= ranks[threshold]
          ]
          if blocked:
              print(f"Gemini gate failed: {len(blocked)} finding(s) at {threshold} or above", file=sys.stderr)
              for finding in blocked:
                  print(f"- {finding.get('severity')}: {finding.get('path')}: {finding.get('title')}", file=sys.stderr)
              raise SystemExit(1)
          PY
