name: stable-real-host-orchestrator-builder

on:
  push:
    branches: ["ops/stable-1.0.0-real-host-acceptance-v1"]

permissions:
  contents: read
  statuses: write

jobs:
  build-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact stable real-host orchestrator
        id: build
        run: |
          STABLE_ACCEPTANCE_BUILD_ONLY=1 OUTPUT_STABLE=/tmp/stable-v1.sh bash ops/stable-1.0.0-real-host-acceptance-v1/run-verified.sh
          bash -n /tmp/stable-v1.sh
          sha="$(sha256sum /tmp/stable-v1.sh | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo '=== FINAL ORCHESTRATOR SHA256 ==='
          echo "$sha  /tmp/stable-v1.sh"
          grep -F 'RC_VERSION="1.0.0"' /tmp/stable-v1.sh
          grep -F 'RC_COMMIT="1b364ae88789696bf98537d21544de8a259d086d"' /tmp/stable-v1.sh
          grep -F 'scripts/stable-update-acceptance.sh' /tmp/stable-v1.sh
          ! grep -Fq 'scripts/rc1-update-acceptance.sh' /tmp/stable-v1.sh
      - name: Publish builder status
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_SHA: ${{ steps.build.outputs.sha }}
        run: |
          python3 - <<'PY' >/tmp/status.json
          import json, os
          sha=os.environ['ORCHESTRATOR_SHA']
          print(json.dumps({
            'state':'success',
            'context':'control-center/stable-real-host-builder',
            'description':sha,
            'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
