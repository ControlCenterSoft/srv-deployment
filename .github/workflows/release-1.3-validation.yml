name: SRV Control Center 1.3.x validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  static-release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active descriptor manifest syntax and UI contract
        shell: bash
        run: |
          set -Eeuo pipefail
          eval "$(python3 - <<'PY'
          import json, pathlib, shlex
          cfg=json.loads(pathlib.Path('deployment.json').read_text(encoding='utf-8'))
          rid=cfg['release_id']; root=pathlib.Path(cfg['release_path'])
          assert rid.startswith('1.3.'),cfg
          assert root == pathlib.Path('releases')/rid,cfg
          print('RELEASE_ID='+shlex.quote(rid)); print('RELEASE_DIR='+shlex.quote(str(root)))
          PY
          )"
          export RELEASE_ID RELEASE_DIR
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          cfg=json.loads(pathlib.Path('deployment.json').read_text())
          root=pathlib.Path(os.environ['RELEASE_DIR']); manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['release_id']==manifest['release_version']==os.environ['RELEASE_ID']
          assert cfg['channel'] in {'release-candidate','production'}
          for name,item in manifest['scripts'].items():
              path=root/item['path']; digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest==item['sha256'],(name,digest,item['sha256'])
              assert pathlib.Path(cfg[name])==path,(name,cfg[name],str(path))
          print('ACTIVE RELEASE',os.environ['RELEASE_ID'],'MANIFEST PASS')
          PY
          bash -n "$RELEASE_DIR"/{preflight,apply,acceptance,rollback}.sh
          bash -n "$RELEASE_DIR"/{preflight-$RELEASE_ID,apply-$RELEASE_ID,acceptance-$RELEASE_ID,rollback-$RELEASE_ID}.sh
          bash -n "$RELEASE_DIR/system/install-auth.sh" "$RELEASE_DIR/system/srvcc-configure-auto-updates"
          python3 -m compileall -q "$RELEASE_DIR/payload/app"
          for file in "$RELEASE_DIR"/payload/static/js/*.js; do node --check "$file"; done
          grep -Fq 'Домен Samba' "$RELEASE_DIR/payload/templates/shell.html"
          grep -Fq '/api/v1/samba/backups' "$RELEASE_DIR/payload/static/js/samba.js"
          grep -Fq 'browseable' "$RELEASE_DIR/payload/static/js/shares.js"
          grep -Fq '13f0a1300001' "$RELEASE_DIR/payload/migrations/versions/13f0a1300001_shares_rbac.py"
          grep -Fq 'samba-dsdb-modules' "$RELEASE_DIR/system/srv-control-samba-agent"
          grep -Fq 'last_update_attempt_at' "$RELEASE_DIR/system/srvcc-configure-auto-updates"
          grep -Fq 'last_successful_update_at' "$RELEASE_DIR/system/srvcc-configure-auto-updates"
          ! grep -R -n -i -E 'пока не работает|будет реализовано|future release only|будет включено' "$RELEASE_DIR/payload/templates" "$RELEASE_DIR/payload/static"
          test "$(git rev-parse HEAD:releases/1.3.0)" = "199555bea5d8b62cde39b2be5b3a721940d3b79a"

  database-rbac-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate current migrations and RBAC
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIR="$(python3 -c 'import json;print(json.load(open("deployment.json"))["release_path"])')"
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --disable-pip-version-check -q -r "$RELEASE_DIR/payload/requirements.lock"
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client >/dev/null
          sudo systemctl start postgresql
          sudo groupadd --system srv-control || true
          sudo useradd --system --gid srv-control --home-dir /var/lib/srv-control --shell /usr/sbin/nologin srv-control || true
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='srv-control'" | grep -q 1 || sudo -u postgres createuser --login srv-control
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='srv_control'" | grep -q 1 || sudo -u postgres createdb --owner=srv-control srv_control
          sudo install -d -m 0750 -o root -g srv-control /opt/srv-control
          sudo cp -a "$RELEASE_DIR/payload/." /opt/srv-control/
          sudo chown -R root:srv-control /opt/srv-control
          sudo -u srv-control env PYTHONPATH=/opt/srv-control /tmp/venv/bin/alembic -c /opt/srv-control/alembic.ini upgrade head
          test "$(sudo -u srv-control psql -d srv_control -Atc 'SELECT version_num FROM alembic_version LIMIT 1;')" = 13f0a1300001
          sudo -u srv-control env PYTHONPATH=/opt/srv-control /tmp/venv/bin/python - <<'PY'
          from app.core.rbac import MODULES,delete_grant,has_permission,is_full_admin,upsert_grant
          from app.core.system_auth import Identity
          i=Identity(username='ci13',uid=65000,gid=65000,groups=('ci13group',),auth_source='local',is_admin=False); ids=[]
          try:
              for m in ('samba','shares'):
                  g=upsert_grant(subject_type='user',subject_name='ci13',source='local',module=m,access='write',actor='ci'); ids.append(int(g['id'])); assert has_permission(i,m,'write')
              assert not has_permission(i,'minecraft','write')
              g=upsert_grant(subject_type='user',subject_name='ci13',source='local',module='samba',access='admin',actor='ci'); ids.append(int(g['id'])); assert is_full_admin(i)
              for m in MODULES: assert has_permission(i,m,'write')
          finally:
              for x in reversed(ids): delete_grant(x)
          print('DATABASE RBAC PASS')
          PY

  minecraft-contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current Minecraft contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIR="$(python3 -c 'import json;print(json.load(open("deployment.json"))["release_path"])')"
          python3 - <<PY
          from importlib.machinery import SourceFileLoader
          from pathlib import Path
          import tempfile
          root=Path('$RELEASE_DIR')
          mc=SourceFileLoader('mc',str(root/'system/srv-control-minecraft-admin-core')).load_module()
          pl=SourceFileLoader('pl',str(root/'system/srv-control-minecraft-player-admin')).load_module()
          up=SourceFileLoader('up',str(root/'system/srv-control-minecraft-update')).load_module()
          assert mc.instance_id('srv_01')=='srv_01'
          try: mc.instance_id('../bad')
          except RuntimeError: pass
          else: raise AssertionError('unsafe id accepted')
          assert {'minecraft-player-kick','minecraft-player-permission'} <= pl.PLAYER_ACTIONS
          assert up.version_tuple('1.21.100.1') > up.version_tuple('1.21.99.1')
          legacy=root/'payload/app/routers/minecraft_legacy.py'
          if legacy.exists():
              compile(legacy.read_text(encoding='utf-8'),str(legacy),'exec')
              js=(root/'payload/static/js/minecraft.js').read_text(encoding='utf-8')
              assert '/api/v1/minecraft/legacy' in js
          print('MINECRAFT CONTRACT PASS')
          PY

  samba-domain-lab-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Samba AD stack and current production workers
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIR="$(python3 -c 'import json;print(json.load(open("deployment.json"))["release_path"])')"
          echo "$RELEASE_DIR" >/tmp/release-dir
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends samba samba-common-bin samba-ad-dc samba-ad-provision samba-dsdb-modules samba-vfs-modules smbclient winbind acl attr ldb-tools >/dev/null
          sudo groupadd --system srv-control || true
          sudo install -d -m 0750 -o root -g srv-control /var/lib/srv-control /var/lib/srv-control/domain-backups /var/lib/srv-control/samba-actions /var/lib/srv-control/system-results /srv/shares
          sudo install -d -m 0700 -o root -g root /var/lib/srv-control/action-secrets /var/lib/srv-control/domain-imports
          for h in srv-control-samba-admin srv-control-samba-agent srv-control-samba-ldif-editor srv-control-samba-monitor srv-control-samba-shares-monitor; do sudo install -m 0755 "$RELEASE_DIR/system/$h" "/usr/local/libexec/$h"; done
      - name: Provision isolated domain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl stop smbd nmbd winbind samba-ad-dc 2>/dev/null || true
          sudo rm -f /etc/samba/smb.conf
          sudo samba-tool domain provision --realm=CI.TEST --domain=CI --server-role=dc --dns-backend=SAMBA_INTERNAL --host-name=SRVCCCI --adminpass='Ci-Only-Strong-Passw0rd!' --use-rfc2307 >/dev/null
          sudo testparm -s --suppress-prompt >/dev/null
          sudo samba-tool dbcheck --cross-ncs >/dev/null
          ROLE="$(sudo testparm -s --suppress-prompt --parameter-name='server role' 2>/dev/null)"
          test "${ROLE,,}" = "active directory domain controller"
      - name: Validate users groups shares through production agent
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo python3 - <<'PY'
          import json,os,secrets,subprocess
          from pathlib import Path
          ACTION=Path('/var/lib/srv-control/samba-actions'); RESULT=Path('/var/lib/srv-control/system-results')
          def a(name,payload):
              request_id=secrets.token_hex(16); request={'schema_version':1,'request_id':request_id,'action':name,'actor':'ci','client_ip':'127.0.0.1','payload':payload}
              (ACTION/f'{request_id}.json').write_text(json.dumps(request),encoding='utf-8')
              result=subprocess.run(['/usr/local/libexec/srv-control-samba-agent'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); assert result.returncode==0,result.stdout
              answer=json.loads((RESULT/f'{request_id}.json').read_text()); assert answer['result']=='success',answer; return answer
          a('samba-password-policy',{'min_length':8,'history_length':3})
          t='ciSecretReference1234567890'; p=Path('/var/lib/srv-control/action-secrets')/t; p.write_text('Ci-User-Strong-Passw0rd!',encoding='utf-8'); os.chmod(p,0o600)
          a('samba-user-create',{'username':'ciuser','secret_ref':t})
          a('samba-group-create',{'name':'CITestGroup','description':'CI test group','members':['ciuser']})
          a('samba-user-update',{'username':'ciuser','display_name':'CI User','email':'ciuser@ci.test','phone':'+10000000000','home_drive':'H:','home_directory':'\\\\SRVCCCI\\home\\ciuser','profile_path':'\\\\SRVCCCI\\profiles\\ciuser','script_path':'login.cmd','groups':['CITestGroup']})
          a('samba-share-create',{'name':'CIShare','comment':'CI share','browseable':False,'subjects':[{'type':'everyone','access':'read'}],'quota':{'limit_gib':None}})
          PY
          sudo testparm -s --suppress-prompt >/dev/null
          sudo samba-tool user show ciuser | grep -F 'displayName: CI User'
          sudo samba-tool user getgroups ciuser | grep -F 'CITestGroup'
      - name: Validate portable backup and isolated restore
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo python3 - <<'PY' >/tmp/meta.json
          import json,subprocess
          r=subprocess.run(['/usr/local/libexec/srv-control-samba-admin'],input=json.dumps({'action':'samba-backup-create','actor':'ci','payload':{'mode':'domain-config'}})+'\n',text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); assert r.returncode==0,r.stdout; o=json.loads(r.stdout); assert o['ok']; print(o['detail'])
          PY
          ARCHIVE="$(python3 -c 'import json;print(json.load(open("/tmp/meta.json"))["archive"])')"
          EXPECTED="$(python3 -c 'import json;print(json.load(open("/tmp/meta.json"))["sha256"])')"
          test "$(sudo sha256sum "/var/lib/srv-control/domain-backups/$ARCHIVE" | awk '{print $1}')" = "$EXPECTED"
          sudo mkdir -p /tmp/domain-smoke
          sudo tar -xf "/var/lib/srv-control/domain-backups/$ARCHIVE" -C /tmp/domain-smoke manifest.json domain control
          OFFICIAL="$(sudo find /tmp/domain-smoke/domain -maxdepth 1 -type f -print -quit)"
          sudo samba-tool domain backup restore --backup-file="$OFFICIAL" --newservername=SRVCCRT --targetdir=/tmp/domain-smoke/restored >/dev/null
          CONF="$(sudo find /tmp/domain-smoke/restored -type f -name smb.conf -print -quit)"; SAM="$(sudo find /tmp/domain-smoke/restored -type f -name sam.ldb -print -quit)"
          sudo test -s "$CONF"; sudo test -s "$SAM"; sudo mkdir -p /tmp/domain-smoke/restored/cache; sudo testparm -s --suppress-prompt "$CONF" >/dev/null
          BASE="$(sudo ldbsearch -H "$SAM" -b '' -s base defaultNamingContext 2>/dev/null | awk -F': ' '/^defaultNamingContext: /{print $2;exit}')"
          test -n "$BASE"; sudo ldbsearch -H "$SAM" -b "$BASE" -s base objectSid 2>/dev/null | grep -q '^objectSid:'
          echo 'SAMBA BACKUP RESTORE PASS'