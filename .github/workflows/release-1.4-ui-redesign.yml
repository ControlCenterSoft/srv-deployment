name: Control Center 1.4 UI redesign validation

on:
  push:
    branches:
      - feature/control-center-ui-redesign
      - release/1.4.0
  pull_request:
    paths:
      - 'releases/1.4.0/**'
      - '.github/workflows/release-1.4-ui-redesign.yml'

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required UI assets
        run: |
          set -euo pipefail
          root='releases/1.4.0/payload'
          for f in \
            templates/login.html \
            templates/shell.html \
            templates/dashboard.html \
            templates/internet.html \
            templates/services.html \
            templates/system.html \
            templates/samba.html \
            templates/shares.html \
            templates/access.html \
            templates/adguard.html \
            templates/torrents.html \
            templates/minecraft.html \
            static/css/login.css \
            static/css/shell.css \
            static/css/module.css \
            static/css/workspace-1.4.css \
            static/css/dashboard-1.4.css \
            static/css/network.css \
            static/css/service-pages.css \
            static/css/system-1.1.css \
            static/css/samba-1.3.css \
            static/css/access.css \
            static/css/service-config-1.2.css \
            static/css/minecraft-1.4.css \
            static/js/ui-1.4.js \
            static/js/login.js \
            static/js/shell.js \
            static/js/dashboard.js \
            static/js/internet.js \
            static/js/services.js \
            static/js/system.js \
            static/js/samba.js \
            static/js/shares.js \
            static/js/access.js \
            static/js/adguard.js \
            static/js/torrents.js \
            static/js/minecraft.js
          do
            test -s "$root/$f" || { echo "missing UI asset: $f"; exit 1; }
          done

      - name: Validate public Control Center naming
        run: |
          set -euo pipefail
          if grep -R -n -F 'SRV Control Center' releases/1.4.0/payload/templates; then
            echo 'legacy public branding remains in 1.4 templates'
            exit 1
          fi
          grep -Fq '>CONTROL CENTER<' releases/1.4.0/payload/templates/shell.html
          grep -Fq 'Вход в систему' releases/1.4.0/payload/templates/login.html
          grep -Fq 'Обзор системы' releases/1.4.0/payload/templates/dashboard.html
          grep -Fq 'Домен и доступ' releases/1.4.0/payload/templates/samba.html
          grep -Fq 'Сетевые ресурсы' releases/1.4.0/payload/templates/shares.html
          grep -Fq 'Пользователи и права' releases/1.4.0/payload/templates/access.html
          grep -Fq 'Загрузки' releases/1.4.0/payload/templates/torrents.html
          grep -Fq 'Minecraft Bedrock — Control Center' releases/1.4.0/payload/templates/minecraft.html

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          for f in releases/1.4.0/payload/static/js/*.js
          do
            node --check "$f"
          done

      - name: Validate page DOM contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('releases/1.4.0/payload')
          contracts = {
              'templates/login.html': {'loginForm','loginUsername','loginPassword','loginError'},
              'templates/shell.html': {
                  'mainNav','navBackdrop','mobileMenuButton','mainMenu','moduleFrame','globalSearch',
                  'backendHealthDot','backendHealth','releaseVersion','githubSync','sessionUser',
                  'logoutButton','refreshButton'
              },
              'templates/dashboard.html': {
                  'streamDot','streamText','serviceGrid','networkTx','networkRx','storageList',
                  'cpuProcesses','ramProcesses','cpuValue','ramValue','loadAverage','databaseStatus'
              },
              'templates/internet.html': {
                  'networkLiveDot','networkLiveText','networkWan','networkGateway','networkMetric',
                  'networkLan','networkDns','networkVpn','networkInterfaces','diagnosticsGrid',
                  'networkPlanForm','networkPlanResultPanel','networkPlanStatus','networkPlanMessages'
              },
              'templates/services.html': {'serviceGrid','serviceMessage'},
              'templates/system.html': {
                  'systemLiveDot','systemLiveText','rebootButton','systemHostname','systemOs',
                  'systemKernel','systemArchitecture','systemUptime','systemCpu','systemLoad',
                  'systemMemory','systemRelease','systemGitHubSync','systemStorage','githubForm',
                  'osForm','backupForm','backupRows'
              },
              'templates/samba.html': {
                  'sambaOverview','sambaHealth','sambaMessage','passwordPolicyForm','policyComplexity',
                  'policyHistory','policyMinLength','policySave','domainBackupMode','domainBackupCreate',
                  'domainRestoreOpen','domainRestoreBox','domainRestoreFile','domainRestoreStart',
                  'domainBackupRows','userSearch','userNew','userList','userEditor','groupSearch',
                  'groupNew','groupList','groupEditor'
              },
              'templates/shares.html': {'shareSearch','shareNew','shareMessage','shareList','shareEditor'},
              'templates/access.html': {
                  'identityBadge','pamState','domainState','ssoState','localUserCount','domainUserCount',
                  'groupCount','groupGrantForm','groupGrantSource','groupGrantSubject','groupGrantModule',
                  'groupGrantAccess','userGrantForm','userGrantSource','userGrantSubject','userGrantModule',
                  'userGrantAccess','grantMessage','grantRows'
              },
              'templates/adguard.html': {
                  'adguardStatus','adguardActions','adguardMessage','adguardConfigPanel','adguardConfigForm',
                  'adguardMode','adguardSocksHost','adguardSocksPort','adguardSave'
              },
              'templates/torrents.html': {'torrentGrid'},
              'templates/minecraft.html': {
                  'backendBadge','serviceBadge','minecraftMessage','summaryState','summaryName','summaryVersion',
                  'summaryStarted','summaryWorld','summaryMode','summaryPlayers','summaryMaxPlayers','summaryUpdate',
                  'summarySchedule','refreshAll','serverStart','serverRestart','serverStop','serviceDetails','updateNow',
                  'updaterDetails','backupNow','backupSummary','broadcastMessage','broadcastSend','liveSummary',
                  'overviewErrors','settingsForm','level-name','server-name','gamemode','difficulty','max-players',
                  'server-port','server-portv6','view-distance','tick-distance','player-idle-timeout',
                  'default-player-permission-level','online-mode','allow-list','allow-cheats','reloadSettings',
                  'reloadPlayers','newPlayerName','newPlayerXuid','newPlayerPermission','addPlayer','playerSettings',
                  'playersBody','reloadWorlds','worldsBody','reloadBackups','backupsBody','reloadLogs','logText'
              },
          }
          for rel, required in contracts.items():
              text = (root / rel).read_text(encoding='utf-8')
              values = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              ids = set(values)
              missing = sorted(required - ids)
              if missing:
                  raise SystemExit(f'{rel}: missing DOM id(s): {", ".join(missing)}')
              duplicates = sorted({value for value in values if values.count(value) > 1})
              if duplicates:
                  raise SystemExit(f'{rel}: duplicate DOM id(s): {", ".join(duplicates)}')
              print(f'{rel}: DOM contract PASS ({len(required)} required ids)')
          PY

      - name: Validate responsive design contracts
        run: |
          set -euo pipefail
          for f in \
            releases/1.4.0/payload/static/css/login.css \
            releases/1.4.0/payload/static/css/shell.css \
            releases/1.4.0/payload/static/css/dashboard-1.4.css \
            releases/1.4.0/payload/static/css/network.css \
            releases/1.4.0/payload/static/css/service-pages.css \
            releases/1.4.0/payload/static/css/system-1.1.css \
            releases/1.4.0/payload/static/css/samba-1.3.css \
            releases/1.4.0/payload/static/css/access.css \
            releases/1.4.0/payload/static/css/workspace-1.4.css \
            releases/1.4.0/payload/static/css/minecraft-1.4.css
          do
            grep -Fq '@media' "$f" || { echo "missing responsive rules: $f"; exit 1; }
          done
          grep -Fq '.main-nav.open' releases/1.4.0/payload/static/css/shell.css
          grep -Fq '.nav-backdrop.open' releases/1.4.0/payload/static/css/shell.css

      - name: Validate interaction safety and accessibility contracts
        run: |
          set -euo pipefail
          grep -Fq ':focus-visible' releases/1.4.0/payload/static/css/module.css
          grep -Fq ':focus-visible' releases/1.4.0/payload/static/css/shell.css
          grep -Fq 'prefers-reduced-motion' releases/1.4.0/payload/static/css/module.css
          grep -Fq 'prefers-reduced-motion' releases/1.4.0/payload/static/css/shell.css
          grep -Fq 'aria-current' releases/1.4.0/payload/static/js/shell.js
          grep -Fq 'ArrowDown' releases/1.4.0/payload/static/js/shell.js
          grep -Fq 'mobileMenuButton' releases/1.4.0/payload/static/js/shell.js
          grep -Fq 'window.ControlCenterUI' releases/1.4.0/payload/static/js/ui-1.4.js
          grep -Fq 'ui.confirm' releases/1.4.0/payload/static/js/services.js
          grep -Fq 'ui.confirm' releases/1.4.0/payload/static/js/access.js
          grep -Fq 'aria-busy' releases/1.4.0/payload/static/js/services.js
          grep -Fq 'aria-busy' releases/1.4.0/payload/static/js/access.js

      - name: Compile application Python
        run: |
          python3 -m compileall -q releases/1.4.0/payload/app
