name: SRV Control Center 1.3.0 Samba performance hotfix

on:
  push:
    branches: [hotfix/1.3.0-samba-domain-performance]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samba-snapshot-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate performance contracts
        run: |
          set -Eeuo pipefail
          monitor='releases/1.3.0/system/srv-control-samba-monitor'
          agent_service='releases/1.3.0/system/srv-control-samba-agent.service'
          timer='releases/1.3.0/system/srv-control-samba-monitor.timer'
          python3 -m py_compile "$monitor"
          ! grep -Fq '"user", "show"' "$monitor"
          ! grep -Fq '"user", "getgroups"' "$monitor"
          ! grep -Fq '"group", "listmembers"' "$monitor"
          grep -Fq 'DIRECTORY_FILTER' "$monitor"
          grep -Fq 'local-samdb-bulk' "$monitor"
          grep -Fq 'primaryGroupID' "$monitor"
          grep -Fq 'ExecStartPost=/usr/bin/systemctl start --no-block srv-control-samba-monitor.service' "$agent_service"
          grep -Fq 'OnBootSec=10s' "$timer"
          grep -Fq 'OnUnitActiveSec=30s' "$timer"

      - name: Install Samba AD stack
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            samba samba-common-bin samba-ad-dc samba-ad-provision \
            samba-dsdb-modules samba-vfs-modules smbclient winbind acl attr ldb-tools
          sudo groupadd --system srv-control || true
          sudo install -d -m 0750 -o root -g srv-control /var/lib/srv-control
          sudo install -m 0755 releases/1.3.0/system/srv-control-samba-monitor /usr/local/libexec/srv-control-samba-monitor

      - name: Provision performance lab domain
        run: |
          set -Eeuo pipefail
          sudo systemctl stop smbd nmbd winbind samba-ad-dc 2>/dev/null || true
          sudo rm -f /etc/samba/smb.conf
          sudo samba-tool domain provision \
            --realm=PERF.TEST --domain=PERF --server-role=dc \
            --dns-backend=SAMBA_INTERNAL --host-name=SRVCCPERF \
            --adminpass='Perf-CI-Strong-Passw0rd!' --use-rfc2307
          for n in $(seq 1 20); do
            sudo samba-tool user create "perfuser${n}" 'Perf-CI-User-Passw0rd!' >/dev/null
          done
          sudo samba-tool group add PerfGroup >/dev/null
          members="$(printf 'perfuser%s,' $(seq 1 20) | sed 's/,$//')"
          sudo samba-tool group addmembers PerfGroup "$members" >/dev/null
          sudo samba-tool user setexpiry perfuser1 --noexpiry >/dev/null
          sudo samba-tool user setattribute perfuser1 displayName 'Performance User 1' >/dev/null

      - name: Validate bulk directory snapshot correctness and latency
        run: |
          sudo python3 - <<'PY'
          import importlib.machinery
          import time
          path='/usr/local/libexec/srv-control-samba-monitor'
          module=importlib.machinery.SourceFileLoader('samba_monitor_perf', path).load_module()
          started=time.monotonic()
          users,groups,error=module.directory_snapshot()
          elapsed=time.monotonic()-started
          assert error is None, error
          assert elapsed < 8.0, f'bulk directory snapshot too slow: {elapsed:.3f}s'
          by_user={u['username']:u for u in users}
          by_group={g['name']:g for g in groups}
          assert 'perfuser1' in by_user, sorted(by_user)[:20]
          assert by_user['perfuser1']['display_name']=='Performance User 1', by_user['perfuser1']
          assert 'PerfGroup' in by_user['perfuser1']['groups'], by_user['perfuser1']
          assert 'Domain Users' in by_user['perfuser1']['groups'], by_user['perfuser1']
          assert 'PerfGroup' in by_group, sorted(by_group)[:30]
          assert 'perfuser1' in by_group['PerfGroup']['members'], by_group['PerfGroup']
          assert len([name for name in by_user if name.startswith('perfuser')]) == 20
          print(f'BULK SNAPSHOT PASS users={len(users)} groups={len(groups)} elapsed={elapsed:.3f}s')
          PY

      - name: Validate full monitor JSON contract
        run: |
          set -Eeuo pipefail
          sudo /usr/local/libexec/srv-control-samba-monitor
          sudo python3 - <<'PY'
          import json
          data=json.load(open('/var/lib/srv-control/samba-domain-status.json',encoding='utf-8'))
          assert data['schema_version']==2,data
          assert data['directory_source']=='local-samdb-bulk',data
          assert isinstance(data['collection_ms'],int) and data['collection_ms'] >= 0,data
          users={u['username']:u for u in data['users']}
          groups={g['name']:g for g in data['groups']}
          assert 'perfuser1' in users,users.keys()
          assert 'PerfGroup' in users['perfuser1']['groups'],users['perfuser1']
          assert 'Domain Users' in users['perfuser1']['groups'],users['perfuser1']
          assert 'perfuser1' in groups['PerfGroup']['members'],groups['PerfGroup']
          print('FULL MONITOR PASS collection_ms=',data['collection_ms'])
          PY
