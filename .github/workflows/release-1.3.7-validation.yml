name: Control Center 1.3.7 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment.json'
      - 'releases/1.3.7/**'
      - '.github/workflows/release-1.3.7-validation.yml'
      - '.github/workflows/release-1.3.6-validation.yml'
      - 'tools/validate-upgrade-contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-1-3-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          set -euxo pipefail
          bash -n releases/1.3.7/preflight-1.3.7.sh
          bash -n releases/1.3.7/apply-1.3.7.sh
          bash -n releases/1.3.7/acceptance-1.3.7.sh
          bash -n releases/1.3.7/rollback-1.3.7.sh

      - name: Manifest deployment and hashes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('releases/1.3.7')
          manifest=json.loads((root/'manifest.json').read_text())
          dep=json.loads(pathlib.Path('deployment.json').read_text())
          assert manifest['release_id']==manifest['release_version']=='1.3.7',manifest
          assert dep['release_id']=='1.3.7' and dep['release_path']=='releases/1.3.7',dep
          for stage,entry in manifest['scripts'].items():
              p=root/entry['path']
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == entry['sha256'],(stage,actual,entry['sha256'])
              assert pathlib.Path(dep[stage]) == p,(stage,dep[stage],p)
          print('1.3.7 MANIFEST PASS')
          PY

      - name: Upgrade compatibility
        run: |
          set -euxo pipefail
          python3 tools/validate-upgrade-contract.py \
            releases/1.3.7/manifest.json \
            --require-patch-line \
            --require-version 1.2.0 \
            --require-version 1.3.0 \
            --require-version 1.3.1 \
            --require-version 1.3.2 \
            --require-version 1.3.3 \
            --require-version 1.3.4 \
            --require-version 1.3.5 \
            --require-version 1.3.6

      - name: Current real-server upgrade path
        run: |
          set -euxo pipefail
          git fetch origin server-state:refs/remotes/origin/server-state
          git show origin/server-state:diagnostics/latest/release.json > /tmp/current-release.json
          cat /tmp/current-release.json
          python3 tools/validate-upgrade-contract.py \
            releases/1.3.7/manifest.json \
            --server-state-release /tmp/current-release.json

      - name: Acceptance release-directory regression
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases/1.3.7/acceptance-1.3.7.sh').read_text()
          assert 'SOURCE="${RELEASE_DIR}/acceptance-1.3.3.sh"' in p
          assert 'TMP="$(mktemp "${RELEASE_DIR}/.acceptance-1.3.7.XXXXXX.sh")"' in p
          assert 'TMP="$(mktemp "${TMPDIR:-/tmp}/srvcc-acceptance-1.3.7' not in p
          assert 'adapted acceptance escaped release directory' in p
          assert 'text=text.replace("1.3.3","1.3.7")' in p
          assert "data.get('version') == '1.3.7'" in p
          predecessor=Path('releases/1.3.7/acceptance-1.3.3.sh').read_text()
          assert 'SOURCE="${RELEASE_DIR}/acceptance.sh"' in predecessor
          assert Path('releases/1.3.7/acceptance.sh').is_file()
          print('ACCEPTANCE RELEASE-DIRECTORY REGRESSION PASS')
          PY

      - name: Rollback release-directory regression
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases/1.3.7/rollback-1.3.7.sh').read_text()
          assert 'TMP="$(mktemp "${SOURCE_DIR}/.rollback-1.3.7.XXXXXX.sh")"' in p
          assert 'new=\'TMP="$(mktemp "${RELEASE_DIR}/.srvcc-rollback-1.3.7.XXXXXX.sh")"\'' in p
          assert 'adapted rollback escaped release directory' in p
          predecessor=Path('releases/1.3.7/rollback-1.3.3.sh').read_text()
          assert 'SOURCE="${RELEASE_DIR}/rollback.sh"' in predecessor
          base=Path('releases/1.3.7/rollback.sh').read_text()
          assert 'PREVIOUS_ROLLBACK="${RELEASE_DIR}/../1.2.0/rollback.sh"' in base
          assert Path('releases/1.2.0/rollback.sh').is_file()
          print('ROLLBACK RELEASE-DIRECTORY REGRESSION PASS')
          PY

      - name: Updater recovery contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          apply=Path('releases/1.3.7/apply-1.3.7.sh').read_text()
          assert 'systemctl enable --now srvcc-github-agent.timer' in apply
          assert "data['version']='1.3.7'" in apply
          assert 'legacy Minecraft helper is absent after core apply' in apply
          print('UPDATER RECOVERY CONTRACT PASS')
          PY

      - name: Payload lineage and frozen 1.3.6
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD:releases/1.3.6)" = "f7423bf6a1288283aa0c1b5bbe4a880817fefc28"
          test "$(git rev-parse HEAD:releases/1.3.7/payload)" = "$(git rev-parse HEAD:releases/1.3.6/payload)"
          test "$(git rev-parse HEAD:releases/1.3.7/system)" = "$(git rev-parse HEAD:releases/1.3.6/system)"
