<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06131d">
  <title>Control Center · Вход</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <script src="/static/release-111-login.js?v={{ version }}" defer></script>
</head>
<body class="login-body-111">
  <main class="login-shell-111">
    <section class="login-card-111">
      <div class="login-brand-111"><span>C</span><div><strong>CONTROL CENTER</strong><small>{{ version }} · {{ build }}</small></div></div>
      <h1>Вход</h1>
      <p>Используйте локальную учётную запись Linux или доменную учётную запись после активации Домена.</p>
      <div class="login-mode-111">
        <button type="button" class="active" data-auth-mode="local">Локальная</button>
        <button type="button" data-auth-mode="domain" {% if not domain_enabled %}disabled{% endif %}>Доменная</button>
      </div>
      <form id="loginForm111" autocomplete="on">
        <input type="hidden" id="loginMode111" value="local">
        <label>Пользователь<input id="loginUser111" name="username" autocomplete="username" required></label>
        <label>Пароль<input id="loginPassword111" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary login-submit-111" type="submit">Войти</button>
        <div id="loginMessage111" class="inline-message"></div>
      </form>
      {% if domain_enabled %}<div class="login-domain-hint-111">Домен: <b>{{ domain_name }}</b></div>{% endif %}
    </section>
  </main>
</body>
</html>
