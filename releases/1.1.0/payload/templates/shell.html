<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRV Control Center</title>
    <link rel="stylesheet" href="/static/css/shell.css?v=1.1.0-ui4">
</head>
<body>
<div class="app-shell">
    <main class="frame-area">
        <iframe id="moduleFrame" name="moduleFrame" src="/ui/dashboard" title="SRV Control Center"></iframe>
    </main>

    <aside class="main-nav">
        <div class="brand">
            <div class="brand-mark">SRV</div>
            <div class="brand-text">
                <strong>Control Center</strong>
                <span>{{ canonical_host }}</span>
            </div>
        </div>

        <nav id="mainMenu">
            <a class="nav-item active" href="/ui/dashboard" target="moduleFrame" data-route="/ui/dashboard">
                <span class="nav-icon">⌂</span><span>Главная</span>
            </a>
            <a class="nav-item" href="/ui/module/internet" target="moduleFrame" data-route="/ui/module/internet" data-module="network">
                <span class="nav-icon">◎</span><span>Сеть</span>
            </a>
            <a class="nav-item" href="/ui/module/torrents" target="moduleFrame" data-route="/ui/module/torrents" data-module="downloads">
                <span class="nav-icon">↓</span><span>Торренты</span>
            </a>
            <a class="nav-item" href="/ui/module/adguard" target="moduleFrame" data-route="/ui/module/adguard" data-module="network">
                <span class="nav-icon">◉</span><span>AdGuard VPN</span>
            </a>
            <a class="nav-item" href="/ui/module/services" target="moduleFrame" data-route="/ui/module/services" data-modules="network,pxe">
                <span class="nav-icon">▦</span><span>Сервисы</span>
            </a>
            <a class="nav-item" href="/ui/module/access" target="moduleFrame" data-route="/ui/module/access" data-admin-only="true">
                <span class="nav-icon">◈</span><span>Права пользователей</span>
            </a>
            <a class="nav-item" href="/ui/module/system" target="moduleFrame" data-route="/ui/module/system">
                <span class="nav-icon">⚙</span><span>Система</span>
            </a>
        </nav>

        <div class="nav-footer">
            <div class="session-user">
                <strong id="sessionUser">—</strong>
                <button id="logoutButton" type="button">Выйти</button>
            </div>
            <div class="health-dot" id="backendHealthDot"></div>
            <div class="backend-state">
                <strong id="backendHealth">Проверка...</strong>
                <span>Backend</span>
            </div>
            <div class="release-meta">
                <strong id="releaseVersion">Релиз —</strong>
                <span id="githubSync">GitHub: —</span>
            </div>
        </div>
    </aside>
</div>
<script src="/static/js/shell.js?v=1.1.0-ui4"></script>
</body>
</html>
