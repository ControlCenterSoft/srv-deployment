<!doctype html>
<html lang="ru">
<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ module.title }}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/module.css"
    >

</head>

<body>

<div class="page">

    <header class="page-header">

        <div>

            <h1>
                {{ module.title }}
            </h1>

            <p>
                {{ module.description }}
            </p>

        </div>

    </header>


    <section class="placeholder-panel">

        <div class="placeholder-symbol">
            ◇
        </div>

        <h2>
            Раздел подготовлен
        </h2>

        <p>
            {{ module.stage }}
        </p>

        <p class="placeholder-note">
            Главное меню уже работает независимо от содержимого
            этого раздела.
        </p>

    </section>

</div>

</body>
</html>
