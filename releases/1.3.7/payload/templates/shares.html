<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Общий / сетевой доступ — SRV Control Center</title>
    <link rel="stylesheet" href="/static/css/module.css?v=1.3.0-rc1">
    <link rel="stylesheet" href="/static/css/service-pages.css?v=1.3.0-rc1">
    <link rel="stylesheet" href="/static/css/samba-1.3.css?v=1.3.0-rc1">
</head>
<body>
<div class="page">
    <header class="page-header">
        <div>
            <h1>Общий / сетевой доступ</h1>
            <p>Управление SMB-шарами, доменными правами, видимостью и квотами.</p>
        </div>
    </header>

    <section class="panel">
        <div class="toolbar">
            <input class="grow" id="shareSearch" type="search" placeholder="Поиск по имени, комментарию или пути">
            <button class="action-button" id="shareNew" type="button">Создать шару</button>
        </div>
        <div class="action-message" id="shareMessage"></div>
        <div class="split-pane">
            <div class="object-list" id="shareList"></div>
            <div class="object-editor" id="shareEditor">
                <div class="empty-state">Выберите сетевую шару или создайте новую.</div>
            </div>
        </div>
    </section>
</div>
<script src="/static/js/shares.js?v=1.3.0-rc1"></script>
</body>
</html>
