<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — SRV Control Center</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
        <div class="brand-mark">SRV</div>
        <h1 id="loginTitle">Control Center</h1>
        <p>Вход локальной или доменной учётной записью сервера.</p>
        <form id="loginForm" autocomplete="on">
            <label>
                <span>Пользователь</span>
                <input id="loginUsername" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                <span>Пароль</span>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Войти</button>
        </form>
        <div id="loginError" class="login-error" role="alert" hidden></div>
    </section>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
