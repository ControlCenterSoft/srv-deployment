<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHCP — SRV Control Center</title><link rel="stylesheet" href="/static/css/module.css?v=1.4.0"><link rel="stylesheet" href="/static/css/release-1.4.css?v=1.4.0"></head><body><div class="page">
<header class="page-header"><div><h1>DHCP</h1><p>Интерфейс, сеть, пул адресов, шлюз, DNS, резервирования и дополнительные DHCP options.</p></div></header>
<section class="panel"><div class="panel-title">Основные параметры</div><form id="dhcpForm" class="grid-3">
<label class="field"><span>Интерфейс</span><input id="dhcpInterface" required placeholder="enp2s0"></label><label class="field"><span>Сеть</span><input id="dhcpNetwork" required placeholder="192.168.10.0"></label><label class="field"><span>Маска</span><input id="dhcpNetmask" required value="255.255.255.0"></label>
<label class="field"><span>Начало пула</span><input id="dhcpStart" required placeholder="192.168.10.100"></label><label class="field"><span>Конец пула</span><input id="dhcpEnd" required placeholder="192.168.10.240"></label><label class="field"><span>Шлюз</span><input id="dhcpGateway" required placeholder="192.168.10.1"></label>
<label class="field"><span>DNS (через запятую)</span><input id="dhcpDns" placeholder="192.168.10.1, 1.1.1.1"></label><label class="field"><span>Срок аренды</span><input id="dhcpLease" value="12h"></label><label class="field"><span>Состояние</span><select id="dhcpEnabled"><option value="true">Включён</option><option value="false">Выключен</option></select></label>
<div class="section-actions"><button class="action-button" type="submit">Сохранить и применить</button></div></form><div class="action-message" id="dhcpMessage"></div></section>
<section class="panel"><div class="panel-title">Дополнительные DHCP параметры</div><form id="optionForm" class="toolbar-wrap"><label class="field"><span>Код option</span><input id="optionCode" type="number" min="1" max="254" required></label><label class="field" style="min-width:320px"><span>Значение</span><input id="optionValue" class="code-input" required></label><button class="action-button" type="submit">Добавить</button></form><div class="table-wrap"><table class="data-table"><thead><tr><th>Код</th><th>Значение</th><th>Статус</th><th></th></tr></thead><tbody id="optionRows"></tbody></table></div></section>
<section class="panel"><div class="panel-title">Резервирования</div><form id="reservationForm" class="toolbar-wrap"><label class="field"><span>MAC</span><input id="reservationMac" class="mac-input code-input" maxlength="17" required placeholder="00155D0A7903"></label><label class="field"><span>IP</span><input id="reservationIp" required></label><label class="field"><span>Имя</span><input id="reservationHost"></label><button class="action-button" type="submit">Зарезервировать</button></form><div class="table-wrap"><table class="data-table"><thead><tr><th>MAC</th><th>IP</th><th>Имя</th><th></th></tr></thead><tbody id="reservationRows"></tbody></table></div></section>
<section class="panel"><div class="panel-title">Текущие DHCP-клиенты</div><div class="table-wrap"><table class="data-table"><thead><tr><th>MAC</th><th>IP</th><th>Имя</th><th>Аренда</th><th>PXE</th></tr></thead><tbody id="leaseRows"></tbody></table></div></section>
</div><script src="/static/js/dhcp-1.4.js?v=1.4.0"></script></body></html>
