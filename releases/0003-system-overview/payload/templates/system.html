<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Система — SRV Control Center</title>

    <link
        rel="stylesheet"
        href="/static/css/module.css"
    >
</head>

<body>

<div class="page">

    <header class="page-header">

        <div>
            <h1>Система</h1>
            <p>
                Состояние SRV, ресурсы, хранилище
                и ключевые службы.
            </p>
        </div>

        <div class="live-status">
            <span
                class="live-dot"
                id="systemLiveDot"
            ></span>
            <span id="systemLiveText">
                Проверка...
            </span>
        </div>

    </header>


    <section class="summary-grid">

        <div class="panel">
            <div class="panel-title">
                Сервер
            </div>

            <div class="stat-row">
                <span>Имя</span>
                <strong id="systemHostname">—</strong>
            </div>

            <div class="stat-row">
                <span>ОС</span>
                <strong id="systemOs">—</strong>
            </div>

            <div class="stat-row">
                <span>Ядро</span>
                <strong id="systemKernel">—</strong>
            </div>

            <div class="stat-row">
                <span>Архитектура</span>
                <strong id="systemArchitecture">—</strong>
            </div>

            <div class="stat-row">
                <span>Uptime</span>
                <strong id="systemUptime">—</strong>
            </div>
        </div>


        <div class="panel">
            <div class="panel-title">
                Ресурсы и релиз
            </div>

            <div class="stat-row">
                <span>CPU</span>
                <strong id="systemCpu">—</strong>
            </div>

            <div class="stat-row">
                <span>Load average</span>
                <strong id="systemLoad">—</strong>
            </div>

            <div class="stat-row">
                <span>RAM</span>
                <strong id="systemMemory">—</strong>
            </div>

            <div class="stat-row">
                <span>Релиз</span>
                <strong id="systemRelease">—</strong>
            </div>

            <div class="stat-row">
                <span>GitHub sync</span>
                <strong id="systemGitHubSync">—</strong>
            </div>
        </div>

    </section>


    <section class="panel">
        <div class="panel-title">
            Хранилище
        </div>

        <div
            class="storage-list"
            id="systemStorage"
        ></div>
    </section>


    <section class="panel">
        <div class="panel-title">
            Ключевые службы
        </div>

        <div
            class="service-grid"
            id="systemServices"
        ></div>
    </section>

</div>

<script src="/static/js/system.js"></script>

</body>
</html>
