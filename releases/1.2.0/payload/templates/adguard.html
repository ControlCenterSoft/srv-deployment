<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdGuard VPN — SRV Control Center</title>
    <link rel="stylesheet" href="/static/css/module.css?v=1.2.0-rc1">
    <link rel="stylesheet" href="/static/css/service-pages.css?v=1.2.0-rc1">
    <link rel="stylesheet" href="/static/css/service-config-1.2.css?v=1.2.0-rc1">
</head>
<body>
<div class="page">
    <header class="page-header">
        <div>
            <h1>AdGuard VPN</h1>
            <p>Состояние, SOCKS-параметры и управление VPN-сервисом.</p>
        </div>
    </header>

    <section class="panel">
        <div class="status-grid" id="adguardStatus"></div>
        <div class="service-actions" id="adguardActions"></div>
        <div class="action-message" id="adguardMessage"></div>
    </section>

    <section class="panel config-panel" id="adguardConfigPanel">
        <div class="panel-title">Настройки</div>
        <form id="adguardConfigForm">
            <div class="config-grid">
                <label>
                    <span>Режим</span>
                    <select id="adguardMode">
                        <option value="SOCKS">SOCKS</option>
                    </select>
                </label>
                <label>
                    <span>SOCKS адрес</span>
                    <input id="adguardSocksHost" type="text" maxlength="255" value="127.0.0.1" required>
                </label>
                <label>
                    <span>SOCKS порт</span>
                    <input id="adguardSocksPort" type="number" min="1" max="65535" step="1" value="1080" required>
                </label>
            </div>
            <div class="config-actions">
                <button class="action-button" id="adguardSave" type="submit">Сохранить настройки</button>
            </div>
        </form>
        <div class="config-note">Изменение SOCKS-параметров не выполняет подключение автоматически. После сохранения используйте кнопку «Подключить».</div>
    </section>
</div>
<script src="/static/js/adguard.js?v=1.2.0-rc1"></script>
</body>
</html>
